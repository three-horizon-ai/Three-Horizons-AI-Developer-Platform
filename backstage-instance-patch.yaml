apiVersion: rhdh.redhat.com/v1alpha1
kind: Backstage
metadata:
  name: developer-hub
  namespace: developer-hub
spec:
  application:
    extraEnvs:
      - name: AUTH_GITHUB_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: github-auth-secret
            key: clientId
      - name: AUTH_GITHUB_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: github-auth-secret
            key: clientSecret
    extraAppConfig:
      - configMapRef: github-auth-config
        filename: github-auth.yaml 