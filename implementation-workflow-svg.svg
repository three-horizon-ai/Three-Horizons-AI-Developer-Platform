<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f7f7f7"/>
  
  <!-- Title -->
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#333333">Three Horizons Implementation Workflow</text>
  <text x="500" y="85" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666666">A step-by-step guide to platform implementation</text>
  
  <!-- Horizon Sections -->
  <rect x="100" y="115" width="800" height="95" rx="8" ry="8" fill="#2188ff" fill-opacity="0.1" stroke="#2188ff" stroke-width="2"/>
  <text x="150" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2188ff">Horizon 1: Foundation</text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="16" fill="#666666">Core infrastructure, basic services, and essential capabilities</text>
  
  <rect x="100" y="220" width="800" height="95" rx="8" ry="8" fill="#f9c513" fill-opacity="0.1" stroke="#f9c513" stroke-width="2"/>
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f9c513">Horizon 2: Enhancement</text>
  <text x="150" y="275" font-family="Arial, sans-serif" font-size="16" fill="#666666">Advanced features, optimization, and increased automation</text>
  
  <rect x="100" y="325" width="800" height="95" rx="8" ry="8" fill="#6f42c1" fill-opacity="0.1" stroke="#6f42c1" stroke-width="2"/>
  <text x="150" y="355" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#6f42c1">Horizon 3: Innovation</text>
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="16" fill="#666666">AI-driven features, advanced analytics, and transformation capabilities</text>
  
  <!-- Implementation Phases -->
  <!-- Phase 1 -->
  <rect x="50" y="450" width="160" height="80" rx="8" ry="8" fill="#0078D4" fill-opacity="0.1" stroke="#0078D4" stroke-width="2"/>
  <text x="130" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Infrastructure</text>
  <text x="130" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Azure Resources</text>
  <text x="130" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">AKS/ARO Setup</text>

  <!-- Phase 2 -->
  <rect x="230" y="450" width="160" height="80" rx="8" ry="8" fill="#EE0000" fill-opacity="0.1" stroke="#EE0000" stroke-width="2"/>
  <text x="310" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Developer Hub</text>
  <text x="310" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Red Hat Developer Hub</text>
  <text x="310" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Template Configuration</text>

  <!-- Phase 3 -->
  <rect x="410" y="450" width="160" height="80" rx="8" ry="8" fill="#24292E" fill-opacity="0.1" stroke="#24292E" stroke-width="2"/>
  <text x="490" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">GitHub Integration</text>
  <text x="490" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">GitHub Enterprise Cloud</text>
  <text x="490" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Copilot & Security</text>

  <!-- Phase 4 -->
  <rect x="590" y="450" width="160" height="80" rx="8" ry="8" fill="#2188ff" fill-opacity="0.1" stroke="#2188ff" stroke-width="2"/>
  <text x="670" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">CI/CD Pipeline</text>
  <text x="670" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">GitHub Actions</text>
  <text x="670" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">GitOps Workflows</text>
  
  <!-- Phase 5 -->
  <rect x="770" y="450" width="160" height="80" rx="8" ry="8" fill="#6f42c1" fill-opacity="0.1" stroke="#6f42c1" stroke-width="2"/>
  <text x="850" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Monitoring</text>
  <text x="850" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Azure Monitor</text>
  <text x="850" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Prometheus/Grafana</text>
  
  <!-- Connection Arrows -->
  <path d="M 210 490 L 230 490" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 390 490 L 410 490" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 570 490 L 590 490" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 750 490 L 770 490" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Implementation Steps -->
  <rect x="50" y="560" width="180" height="120" rx="8" ry="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="50" y1="590" x2="230" y2="590" stroke="#ddd" stroke-width="2"/>
  <text x="140" y="580" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Implementation Steps</text>
  <text x="60" y="610" font-family="Arial, sans-serif" font-size="12">1. Resource Group Creation</text>
  <text x="60" y="630" font-family="Arial, sans-serif" font-size="12">2. Virtual Network Setup</text>
  <text x="60" y="650" font-family="Arial, sans-serif" font-size="12">3. AKS/ARO Deployment</text>
  <text x="60" y="670" font-family="Arial, sans-serif" font-size="12">4. Storage Configuration</text>
  
  <rect x="250" y="560" width="180" height="120" rx="8" ry="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="250" y1="590" x2="430" y2="590" stroke="#ddd" stroke-width="2"/>
  <text x="340" y="580" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Implementation Steps</text>
  <text x="260" y="610" font-family="Arial, sans-serif" font-size="12">1. RHDH Operator Install</text>
  <text x="260" y="630" font-family="Arial, sans-serif" font-size="12">2. Database Configuration</text>
  <text x="260" y="650" font-family="Arial, sans-serif" font-size="12">3. Developer Hub Deployment</text>
  <text x="260" y="670" font-family="Arial, sans-serif" font-size="12">4. Template Setup</text>
  
  <rect x="450" y="560" width="180" height="120" rx="8" ry="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="450" y1="590" x2="630" y2="590" stroke="#ddd" stroke-width="2"/>
  <text x="540" y="580" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Implementation Steps</text>
  <text x="460" y="610" font-family="Arial, sans-serif" font-size="12">1. GitHub OAuth Setup</text>
  <text x="460" y="630" font-family="Arial, sans-serif" font-size="12">2. Authentication Config</text>
  <text x="460" y="650" font-family="Arial, sans-serif" font-size="12">3. Copilot Integration</text>
  <text x="460" y="670" font-family="Arial, sans-serif" font-size="12">4. Catalog Integration</text>
  
  <rect x="650" y="560" width="280" height="120" rx="8" ry="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="650" y1="590" x2="930" y2="590" stroke="#ddd" stroke-width="2"/>
  <text x="790" y="580" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Implementation Steps</text>
  <text x="660" y="610" font-family="Arial, sans-serif" font-size="12">1. Flux/GitOps Setup</text>
  <text x="660" y="630" font-family="Arial, sans-serif" font-size="12">2. Monitoring Deployment</text>
  <text x="660" y="650" font-family="Arial, sans-serif" font-size="12">3. GitHub Actions Workflows</text>
  <text x="660" y="670" font-family="Arial, sans-serif" font-size="12">4. End-to-End Validation</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>