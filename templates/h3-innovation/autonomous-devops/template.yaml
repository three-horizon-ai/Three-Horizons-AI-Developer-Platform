apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: h3-autonomous-devops
  title: "H3: Autonomous DevOps System"
  description: "Self-healing, intelligent DevOps automation system with AI-driven operations and autonomous decision making for Horizon 3"
  annotations:
    backstage.io/managed-by-location: url:https://github.com/three-horizon-ai/Three-Horizons-AI-Developer-Platform/blob/main/templates/h3-innovation/autonomous-devops/template.yaml
  tags:
    - horizon-3
    - innovation
    - autonomous
    - devops
    - self-healing
    - ai-operations
    - automation
spec:
  owner: platform-team
  type: autonomous-system
  
  parameters:
    - title: Autonomous DevOps Configuration
      required:
        - name
        - owner
        - autonomyLevel
      properties:
        name:
          title: "Autonomous DevOps System Name"
          type: string
          pattern: '^[a-z0-9-]+$'
          description: "Unique name for your autonomous DevOps system"
          default: h3-autonomous-devops
        description:
""          title: "Description"
          type: string
          description: "Description of your autonomous DevOps system"
          default: Self-healing, intelligent DevOps automation system with AI-driven operations
        owner:
          title: "Owner"
          type: string
          description: "Owner of the autonomous system (GitHub username or team)"
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        autonomyLevel:
          title: "Autonomy Level"
          type: string
          description: "Level of autonomy for the DevOps system"
          default: high
          enum:
            - basic
            - medium
            - high
            - full-autonomous
            
    - title: Self-Healing Capabilities
      required:
        - enableSelfHealing
        - healingScope
      properties:
        enableSelfHealing:
          title: "Enable Self-Healing"
          type: boolean
          description: "Enable automatic system recovery and healing"
          default: true
        healingScope:
          title: "Self-Healing Scope"
          type: array
          description: "Areas where self-healing should be applied"
          items:
            type: string
            enum:
              - infrastructure
              - applications
              - network
              - storage
              - security
              - performance
              - costs
              - compliance
          default: ["infrastructure", "applications", "performance"]
          ui:widget: checkboxes
        enablePreventiveMaintenance:
          title: "Enable Preventive Maintenance"
          type: boolean
          description: "Perform preventive maintenance based on AI predictions"
          default: true
        enableCapacityPlanning:
          title: "Enable Autonomous Capacity Planning"
          type: boolean
          description: "Automatically scale resources based on predicted demand"
          default: true
        healingStrategies:
          title: "Healing Strategies"
          type: array
          description: "Strategies for system healing"
          items:
            type: string
            enum:
              - restart-services
              - scale-resources
              - failover-regions
              - rollback-deployments
              - patch-security
              - optimize-performance
              - rebalance-load
          default: ["restart-services", "scale-resources", "rollback-deployments"]
          ui:widget: checkboxes
          
    - title: AI-Driven Operations
      required:
        - enableAIDecisionMaking
        - aiModels
      properties:
        enableAIDecisionMaking:
          title: "Enable AI Decision Making"
          type: boolean
          description: "Allow AI to make operational decisions"
          default: true
        aiModels:
          title: "AI Models for Operations"
          type: array
          description: "AI models to use for operational decisions"
          items:
            type: string
            enum:
              - gpt-4o
              - claude-3-sonnet
              - custom-ops-model
              - anomaly-detection-model
              - prediction-model
              - optimization-model
          default: ["gpt-4o", "anomaly-detection-model"]
          ui:widget: checkboxes
        enablePredictiveAnalytics:
          title: "Enable Predictive Analytics"
          type: boolean
          description: "Use AI for predictive failure analysis"
          default: true
        enableAnomalyDetection:
          title: "Enable Anomaly Detection"
          type: boolean
          description: "Automatically detect system anomalies"
          default: true
        enableIntelligentRouting:
          title: "Enable Intelligent Traffic Routing"
          type: boolean
          description: "AI-driven traffic routing optimization"
          default: true
        decisionThreshold:
          title: "AI Decision Confidence Threshold"
          type: number
          description: "Minimum confidence level for autonomous decisions (0-1)"
          default: 0.8
          minimum: 0.5
          maximum: 1.0
          
    - title: Monitoring and Observability
      required:
        - enableAdvancedMonitoring
        - observabilityStack
      properties:
        enableAdvancedMonitoring:
          title: "Enable Advanced Monitoring"
          type: boolean
          description: "Deploy comprehensive monitoring infrastructure"
          default: true
        observabilityStack:
          title: "Observability Stack"
          type: array
          description: "Observability tools to deploy"
          items:
            type: string
            enum:
              - prometheus
              - grafana
              - jaeger
              - elastic-stack
              - datadog
              - new-relic
              - azure-monitor
              - custom-metrics
          default: ["prometheus", "grafana", "jaeger", "azure-monitor"]
          ui:widget: checkboxes
        enableDistributedTracing:
          title: "Enable Distributed Tracing"
          type: boolean
          description: "Full distributed tracing across all services"
          default: true
        enableLogAggregation:
          title: "Enable Log Aggregation"
          type: boolean
          description: "Centralized log collection and analysis"
          default: true
        enableMetricsCorrelation:
          title: "Enable Metrics Correlation"
          type: boolean
          description: "AI-powered correlation of metrics and events"
          default: true
        enableRealTimeAlerts:
          title: "Enable Real-Time Alerts"
          type: boolean
          description: "Intelligent real-time alerting system"
          default: true
          
    - title: Deployment Automation
      required:
        - enableContinuousDeployment
        - deploymentStrategies
      properties:
        enableContinuousDeployment:
          title: "Enable Continuous Deployment"
          type: boolean
          description: "Fully automated deployment pipeline"
          default: true
        deploymentStrategies:
          title: "Deployment Strategies"
          type: array
          description: "Automated deployment strategies"
          items:
            type: string
            enum:
              - blue-green
              - canary
              - rolling
              - a-b-testing
              - feature-flags
              - progressive-delivery
          default: ["canary", "blue-green", "progressive-delivery"]
          ui:widget: checkboxes
        enableAutomaticRollback:
          title: "Enable Automatic Rollback"
          type: boolean
          description: "Automatic rollback on deployment failures"
          default: true
        enableQualityGates:
          title: "Enable AI Quality Gates"
          type: boolean
          description: "AI-powered quality assessment before deployment"
          default: true
        enableChaosEngineering:
          title: "Enable Chaos Engineering"
          type: boolean
          description: "Automated resilience testing"
          default: true
          
    - title: Security Automation
      required:
        - enableSecurityAutomation
        - securityPolicies
      properties:
        enableSecurityAutomation:
          title: "Enable Security Automation"
          type: boolean
          description: "Automated security monitoring and response"
          default: true
        securityPolicies:
          title: "Automated Security Policies"
          type: array
          description: "Security policies to automate"
          items:
            type: string
            enum:
              - vulnerability-scanning
              - threat-detection
              - compliance-checking
              - access-control
              - incident-response
              - patch-management
              - secret-rotation
          default: ["vulnerability-scanning", "threat-detection", "incident-response"]
          ui:widget: checkboxes
        enableThreatResponse:
          title: "Enable Automated Threat Response"
          type: boolean
          description: "Automatic response to security threats"
          default: true
        enableComplianceMonitoring:
          title: "Enable Compliance Monitoring"
          type: boolean
          description: "Continuous compliance monitoring and remediation"
          default: true
        enableSecretManagement:
          title: "Enable Automated Secret Management"
          type: boolean
          description: "Automatic secret rotation and management"
          default: true
          
    - title: Azure Integration
      required:
        - azureSubscription
        - azureLocation
        - enableAzureAutomation
      properties:
        azureSubscription:
          title: "Azure Subscription ID"
          type: string
          description: "Azure subscription ID for autonomous operations"
          ui:help: 'Enter your Azure subscription ID (GUID format)'
        azureLocation:
          title: "Azure Location"
          type: string
          description: "Primary Azure region for operations"
          default: eastus
          enum:
            - eastus
            - westus2
            - northeurope
            - westeurope
            - australiaeast
            - southeastasia
        enableAzureAutomation:
          title: "Enable Azure Automation"
          type: boolean
          description: "Use Azure Automation for runbooks"
          default: true
        enableLogicApps:
          title: "Enable Azure Logic Apps"
          type: boolean
          description: "Use Logic Apps for workflow automation"
          default: true
        enableFunctions:
          title: "Enable Azure Functions"
          type: boolean
          description: "Use serverless functions for automation"
          default: true
        enableAzureAI:
          title: "Enable Azure AI Services"
          type: boolean
          description: "Integrate with Azure AI for decision making"
          default: true
          
    - title: Cost Optimization
      required:
        - enableCostOptimization
        - optimizationStrategies
      properties:
        enableCostOptimization:
          title: "Enable Autonomous Cost Optimization"
          type: boolean
          description: "Automatically optimize cloud costs"
          default: true
        optimizationStrategies:
          title: "Cost Optimization Strategies"
          type: array
          description: "Strategies for cost optimization"
          items:
            type: string
            enum:
              - right-sizing
              - reserved-instances
              - spot-instances
              - auto-scaling
              - resource-scheduling
              - unused-resource-cleanup
              - storage-optimization
          default: ["right-sizing", "auto-scaling", "unused-resource-cleanup"]
          ui:widget: checkboxes
        costThreshold:
          title: "Cost Alert Threshold"
          type: number
          description: "Monthly cost threshold for alerts (USD)"
          default: 1000
          minimum: 100
        enableBudgetManagement:
          title: "Enable Budget Management"
          type: boolean
          description: "Automatic budget management and enforcement"
          default: true
          
    - title: Governance and Compliance
      required:
        - enableGovernance
        - complianceFrameworks
      properties:
        enableGovernance:
          title: "Enable Autonomous Governance"
          type: boolean
          description: "Automated governance and compliance enforcement"
          default: true
        complianceFrameworks:
          title: "Compliance Frameworks"
          type: array
          description: "Compliance frameworks to automate"
          items:
            type: string
            enum:
              - soc2
              - iso27001
              - pci-dss
              - hipaa
              - gdpr
              - nist
              - cis
          default: ["soc2", "iso27001"]
          ui:widget: checkboxes
        enableAuditTrails:
          title: "Enable Audit Trails"
          type: boolean
          description: "Comprehensive audit trail generation"
          default: true
        enablePolicyEnforcement:
          title: "Enable Policy Enforcement"
          type: boolean
          description: "Automatic policy enforcement"
          default: true

  steps:
    - id: template
      name: Render Autonomous DevOps Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: "${{ parameters.description }}"
          owner: ${{ parameters.owner }}
          autonomyLevel: ${{ parameters.autonomyLevel }}
          enableSelfHealing: ${{ parameters.enableSelfHealing }}
          healingScope: ${{ parameters.healingScope }}
          enablePreventiveMaintenance: ${{ parameters.enablePreventiveMaintenance }}
          enableCapacityPlanning: ${{ parameters.enableCapacityPlanning }}
          healingStrategies: ${{ parameters.healingStrategies }}
          enableAIDecisionMaking: ${{ parameters.enableAIDecisionMaking }}
          aiModels: ${{ parameters.aiModels }}
          enablePredictiveAnalytics: ${{ parameters.enablePredictiveAnalytics }}
          enableAnomalyDetection: ${{ parameters.enableAnomalyDetection }}
          enableIntelligentRouting: ${{ parameters.enableIntelligentRouting }}
          decisionThreshold: ${{ parameters.decisionThreshold }}
          enableAdvancedMonitoring: ${{ parameters.enableAdvancedMonitoring }}
          observabilityStack: ${{ parameters.observabilityStack }}
          enableDistributedTracing: ${{ parameters.enableDistributedTracing }}
          enableLogAggregation: ${{ parameters.enableLogAggregation }}
          enableMetricsCorrelation: ${{ parameters.enableMetricsCorrelation }}
          enableRealTimeAlerts: ${{ parameters.enableRealTimeAlerts }}
          enableContinuousDeployment: ${{ parameters.enableContinuousDeployment }}
          deploymentStrategies: ${{ parameters.deploymentStrategies }}
          enableAutomaticRollback: ${{ parameters.enableAutomaticRollback }}
          enableQualityGates: ${{ parameters.enableQualityGates }}
          enableChaosEngineering: ${{ parameters.enableChaosEngineering }}
          enableSecurityAutomation: ${{ parameters.enableSecurityAutomation }}
          securityPolicies: ${{ parameters.securityPolicies }}
          enableThreatResponse: ${{ parameters.enableThreatResponse }}
          enableComplianceMonitoring: ${{ parameters.enableComplianceMonitoring }}
          enableSecretManagement: ${{ parameters.enableSecretManagement }}
          azureSubscription: ${{ parameters.azureSubscription }}
          azureLocation: ${{ parameters.azureLocation }}
          enableAzureAutomation: ${{ parameters.enableAzureAutomation }}
          enableLogicApps: ${{ parameters.enableLogicApps }}
          enableFunctions: ${{ parameters.enableFunctions }}
          enableAzureAI: ${{ parameters.enableAzureAI }}
          enableCostOptimization: ${{ parameters.enableCostOptimization }}
          optimizationStrategies: ${{ parameters.optimizationStrategies }}
          costThreshold: ${{ parameters.costThreshold }}
          enableBudgetManagement: ${{ parameters.enableBudgetManagement }}
          enableGovernance: ${{ parameters.enableGovernance }}
          complianceFrameworks: ${{ parameters.complianceFrameworks }}
          enableAuditTrails: ${{ parameters.enableAuditTrails }}
          enablePolicyEnforcement: ${{ parameters.enablePolicyEnforcement }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: "'Autonomous DevOps System: ${{ parameters.name }}'"
        repoUrl: github.com/three-horizon-ai/${{ parameters.name }}
        defaultBranch: main
        gitCommitMessage: 'Initial autonomous DevOps setup for ${{ parameters.name }}'
        gitAuthorName: ${{ parameters.owner }}
        gitAuthorEmail: ${{ parameters.owner }}@users.noreply.github.com

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: https://github.com/three-horizon-ai/${{ parameters.name }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Autonomous Operations Dashboard
        url: https://autonomous-ops.${{ parameters.name }}.local
      - title: AI Decision Console
        url: https://ai-console.${{ parameters.name }}.local
