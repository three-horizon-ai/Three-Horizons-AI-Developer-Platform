apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: h0-developer-environment
  title: Three Horizons AI Dev Box - Complete Development Environment
  description: Azure Dev Box template with pre-configured tools, VS Code extensions, and automated setup for Three Horizons AI Platform development
  tags:
    - h0
    - setup
    - devbox
    - development-environment
    - vscode
    - azure
    - kubernetes
    - node
    - python
    - dotnet
    - ai
    - devcontainer
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: three-horizon-ai/devbox-template
spec:
  owner: three-horizons-platform-team
  type: environment
  parameters:
    - title: Azure DevBox Hub-Spoke Configuration
      required:
        - azure_subscription_id
        - azure_tenant_id
        - service_principal_id
        - service_principal_secret
        - organization_name
        - project_name
        - location
        - developer_name
        - team_name
        - instance_id
      properties:
        azure_subscription_id:
          title: Azure Subscription ID
          type: string
          description: Your Azure subscription ID
          ui:autofocus: true
          ui:help: 'You can find this in the Azure Portal under Subscriptions'
        azure_tenant_id:
          title: Azure Tenant ID
          type: string
          description: Your Azure AD tenant ID
          ui:help: 'You can find this in the Azure Portal under Azure Active Directory'
        service_principal_id:
          title: Service Principal Client ID
          type: string
          description: The client ID of your service principal
          ui:help: 'Service principal must have DevCenter Admin and Contributor roles'
        service_principal_secret:
          title: Service Principal Secret
          type: string
          description: The secret for your service principal
          ui:widget: password
          ui:help: 'This will be stored securely and used for Azure authentication'
        organization_name:
          title: Organization Name
          type: string
          description: Name of your organization for the DevBox environment
          default: 'three-horizons'
          ui:help: 'Used for naming the central Dev Center and resource organization'
        project_name:
          title: Project Name
          type: string
          description: Name of the initial DevBox project
          default: 'developer-hub'
          ui:help: 'This will be the first project created in the Dev Center'
        location:
          title: Azure Region
          type: string
          description: Azure region for deploying resources
          default: 'eastus2'
          enum:
            - eastus2
            - westus2
            - westeurope
            - northeurope
            - southeastasia
            - australiaeast
          enumNames:
            - 'East US 2'
            - 'West US 2'
            - 'West Europe'
            - 'North Europe'
            - 'Southeast Asia'
            - 'Australia East'
        developer_name:
          title: Developer Name
          type: string
          description: Name of the developer who will use this DevBox
          ui:help: 'This will be used for tagging and identification'
        team_name:
          title: Team Name
          type: string
          description: Name of the development team
          ui:help: 'This will be used for resource organization and access control'
        environment:
          title: Environment
          type: string
          description: Environment type for this deployment
          default: 'dev'
          enum:
            - dev
            - test
            - prod
          enumNames:
            - 'Development'
            - 'Testing'
            - 'Production'
        network_type:
          title: Network Configuration
          type: string
          description: Type of network connection for DevBoxes
          default: 'microsoft-hosted'
          enum:
            - microsoft-hosted
            - azure-network
          enumNames:
            - 'Microsoft-hosted (Simpler setup)'
            - 'Azure Virtual Network (More control)'
          ui:help: 'Microsoft-hosted is recommended for most scenarios'
        devbox_definition:
          title: DevBox Configuration
          type: string
          description: Type of DevBox to create
          default: 'standard-dev-workstation'
          enum:
            - standard-dev-workstation
            - power-user-workstation
            - data-science-workstation
          enumNames:
            - 'Standard Developer Workstation (4 vCPU, 16GB RAM)'
            - 'Power User Workstation (8 vCPU, 32GB RAM)'
            - 'Data Science Workstation (16 vCPU, 64GB RAM)'
        max_devboxes_per_user:
          title: Max DevBoxes per User
          type: integer
          description: Maximum number of DevBoxes each user can create (0 = unlimited)
          default: 3
          minimum: 0
          maximum: 10
        auto_stop_enabled:
          title: Enable Auto-Stop
          type: boolean
          description: Automatically stop DevBoxes after inactivity
          default: true
          ui:help: 'Helps control costs by stopping unused DevBoxes'
        auto_stop_grace_period:
          title: Auto-Stop Grace Period (minutes)
          type: integer
          description: Minutes of inactivity before auto-stop
          default: 60
          minimum: 30
          maximum: 1440
        instance_id:
          title: Instance ID
          type: string
          description: Unique identifier for this deployment
          default: ${{ '20240101-1200-' + (1000000 + (999999 * Math.random()) | 0) }}
          ui:help: 'Auto-generated unique ID to avoid resource naming conflicts'

    - title: Developer Information
      required:
        - developer_name
        - team
        - preferred_shell
      properties:
        developer_name:
          title: Developer Name
          type: string
          description: Your name for personalizing the environment
          pattern: '^[a-zA-Z0-9\s-]+$'
        team:
          title: Team
          type: string
          description: Your team name
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        preferred_shell:
          title: Preferred Shell
          type: string
          description: Your preferred shell environment
          default: zsh
          enum:
            - bash
            - zsh
            - fish
        instance_id:
          title: Instance Identifier
          type: string
          description: Unique identifier for this deployment (auto-generated if empty)
          default: ${{ '${' }}new Date().toISOString().replace(/[-T:\.Z]/g, '').slice(0, 12)}}
            - powershell

    - title: Development Stack
      properties:
        languages:
          title: Programming Languages
          type: array
          description: Select programming languages to configure
          items:
            type: string
            enum:
              - nodejs
              - python
              - dotnet
              - java
              - go
              - rust
          uniqueItems: true
          default: ["nodejs", "python", "dotnet"]
        cloud_tools:
          title: Cloud Tools
          type: array
          description: Select cloud tools to install
          items:
            type: string
            enum:
              - azure-cli
              - kubectl
              - helm
              - terraform
              - bicep
              - docker
              - podman
              - k9s
              - argocd-cli
          uniqueItems: true
          default: ["azure-cli", "kubectl", "helm", "docker", "bicep"]
        ai_tools:
          title: AI/ML Tools
          type: array
          description: Select AI/ML development tools
          items:
            type: string
            enum:
              - azure-ai-cli
              - openai-cli
              - jupyter
              - tensorboard
              - mlflow
              - huggingface-cli
              - langchain
          uniqueItems: true
          default: ["azure-ai-cli", "jupyter", "langchain"]

    - title: VS Code Configuration
      properties:
        vscode_extensions:
          title: VS Code Extensions
          type: array
          description: Pre-install VS Code extensions
          items:
            type: string
            enum:
              - ms-vscode.vscode-typescript-next
              - ms-python.python
              - ms-dotnettools.csharp
              - ms-azuretools.vscode-azureresourcegroups
              - ms-kubernetes-tools.vscode-kubernetes-tools
              - ms-vscode.azure-account
              - github.copilot
              - github.copilot-chat
              - redhat.vscode-yaml
              - ms-vscode.powershell
              - hashicorp.terraform
              - ms-azuretools.vscode-bicep
          uniqueItems: true
          default: ["github.copilot", "github.copilot-chat", "ms-azuretools.vscode-azureresourcegroups", "ms-kubernetes-tools.vscode-kubernetes-tools"]
        workspace_settings:
          title: Custom Workspace Settings
          type: boolean
          description: Apply custom VS Code workspace settings for Three Horizons development
          default: true

    - title: Azure Configuration
      properties:
        setup_azure_auth:
          title: Setup Azure Authentication
          type: boolean
          description: Configure Azure CLI authentication and subscription
          default: true
        azure_subscription_id:
          title: Azure Subscription ID (Optional)
          type: string
          description: Azure subscription ID to configure by default
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        setup_aks_access:
          title: Setup AKS Access
          type: boolean
          description: Configure kubectl for AKS clusters
          default: true

    - title: Repository Settings
      required:
        - repo_name
      properties:
        repo_name:
          title: Repository Name
          type: string
          description: Name for the developer environment repository
          default: my-three-horizons-devbox
          pattern: '^[a-z0-9-]+$'
        include_samples:
          title: Include Sample Code
          type: boolean
          description: Include sample code and templates for each horizon
          default: true

  steps:
    - id: authenticate-azure
      name: Authenticate with Azure
      action: azure:auth:service-principal
      input:
        clientId: ${{ parameters.service_principal_id }}
        clientSecret: ${{ parameters.service_principal_secret }}
        tenantId: ${{ parameters.azure_tenant_id }}
        subscriptionId: ${{ parameters.azure_subscription_id }}

    - id: create-resource-group
      name: Create Azure Resource Group
      action: azure:resource-group:create
      input:
        resourceGroupName: 'rg-${{ parameters.organization_name }}-devbox-${{ parameters.environment }}-${{ parameters.location }}-${{ parameters.instance_id }}'
        location: ${{ parameters.location }}
        tags:
          Organization: ${{ parameters.organization_name }}
          Environment: ${{ parameters.environment }}
          Project: ${{ parameters.project_name }}
          Developer: ${{ parameters.developer_name }}
          Team: ${{ parameters.team_name }}
          CreatedBy: red-hat-developer-hub
          InstanceId: ${{ parameters.instance_id }}
          CreatedDate: ${{ '${' }}new Date().toISOString()}}

    - id: deploy-hub-infrastructure
      name: Deploy Dev Center Hub Infrastructure
      action: azure:arm:deploy
      input:
        resourceGroupName: ${{ steps['create-resource-group'].output.resourceGroupName }}
        deploymentName: 'devbox-hub-${{ parameters.instance_id }}'
        templateUri: 'https://raw.githubusercontent.com/three-horizon-ai/Three-Horizons-AI-Developer-Platform/main/resources/bicep/devbox-hub-architecture.bicep'
        parameters:
          organizationName:
            value: ${{ parameters.organization_name }}
          location:
            value: ${{ parameters.location }}
          environment:
            value: ${{ parameters.environment }}
          instanceId:
            value: ${{ parameters.instance_id }}
          networkType:
            value: ${{ parameters.network_type }}

    - id: wait-for-hub-deployment
      name: Wait for Hub Deployment
      action: debug:wait
      input:
        seconds: 300

    - id: deploy-project
      name: Deploy DevBox Project
      action: azure:arm:deploy
      input:
        resourceGroupName: ${{ steps['create-resource-group'].output.resourceGroupName }}
        deploymentName: 'devbox-project-${{ parameters.project_name }}-${{ parameters.instance_id }}'
        templateUri: 'https://raw.githubusercontent.com/three-horizon-ai/Three-Horizons-AI-Developer-Platform/main/resources/bicep/devbox-project.bicep'
        parameters:
          projectName:
            value: ${{ parameters.project_name }}
          location:
            value: ${{ parameters.location }}
          developerName:
            value: ${{ parameters.developer_name }}
          teamName:
            value: ${{ parameters.team_name }}
          environment:
            value: ${{ parameters.environment }}
          instanceId:
            value: ${{ parameters.instance_id }}
          devCenterId:
            value: ${{ steps['deploy-hub-infrastructure'].output.devCenterId }}
          networkConnectionName:
            value: ${{ steps['deploy-hub-infrastructure'].output.networkConnectionName }}
          devBoxDefinition:
            value: ${{ parameters.devbox_definition }}
          userPrincipalId:
            value: ${{ user.entity.metadata.annotations['microsoft.com/object-id'] || user.entity.spec.profile.email }}
          maxDevBoxesPerUser:
            value: ${{ parameters.max_devboxes_per_user }}
          autoStopEnabled:
            value: ${{ parameters.auto_stop_enabled }}
          autoStopGracePeriodMinutes:
            value: ${{ parameters.auto_stop_grace_period }}

    - id: wait-for-project-deployment
      name: Wait for Project Deployment
      action: debug:wait
      input:
        seconds: 180

    - id: create-devbox-config
      name: Create Dev Box Configuration
      action: fs:create
      input:
        path: devbox-config.json
        content: |
          {
            "name": "${{ parameters.repo_name }}-devbox",
            "resourceGroup": "${{ steps['create-resource-group'].output.resourceGroupName }}",
            "devCenter": "${{ steps['deploy-devbox-infrastructure'].output.devCenterName }}",
            "project": "${{ steps['deploy-devbox-infrastructure'].output.projectName }}",
            "pool": "${{ steps['deploy-devbox-infrastructure'].output.poolName }}",
            "imageDefinition": "three-horizons-ai-devbox",
            "size": "${{ parameters.devbox_size }}",
            "region": "${{ parameters.devbox_region }}",
            "useImageDefinition": ${{ parameters.use_image_definition }},
            "developer": {
              "name": "${{ parameters.developer_name }}",
              "team": "${{ parameters.team }}",
              "shell": "${{ parameters.preferred_shell }}"
            },
            "tools": {
              "languages": ${{ parameters.languages | dump }},
              "cloudTools": ${{ parameters.cloud_tools | dump }},
              "aiTools": ${{ parameters.ai_tools | dump }},
              "vscodeExtensions": ${{ parameters.vscode_extensions | dump }}
            },
            "azure": {
              "setupAuth": ${{ parameters.setup_azure_auth }},
              "subscriptionId": "${{ parameters.azure_subscription_id }}",
              "setupAksAccess": ${{ parameters.setup_aks_access }}
            },
            "deployment": {
              "resourceGroupId": "${{ steps['create-resource-group'].output.resourceGroupId }}",
              "devCenterResourceId": "${{ steps['deploy-devbox-infrastructure'].output.devCenterResourceId }}",
              "projectResourceId": "${{ steps['deploy-devbox-infrastructure'].output.projectResourceId }}",
              "poolResourceId": "${{ steps['deploy-devbox-infrastructure'].output.poolResourceId }}",
              "devBoxPortalUrl": "${{ steps['deploy-devbox-infrastructure'].output.devBoxPortalUrl }}",
              "nextSteps": ${{ steps['deploy-devbox-infrastructure'].output.nextSteps | dump }}
            }
          }

    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          devbox_size: ${{ parameters.devbox_size }}
          devbox_region: ${{ parameters.devbox_region }}
          use_image_definition: ${{ parameters.use_image_definition }}
          developer_name: ${{ parameters.developer_name }}
          team: ${{ parameters.team }}
          preferred_shell: ${{ parameters.preferred_shell }}
          languages: ${{ parameters.languages }}
          cloud_tools: ${{ parameters.cloud_tools }}
          ai_tools: ${{ parameters.ai_tools }}
          vscode_extensions: ${{ parameters.vscode_extensions }}
          workspace_settings: ${{ parameters.workspace_settings }}
          setup_azure_auth: ${{ parameters.setup_azure_auth }}
          azure_subscription_id: ${{ parameters.azure_subscription_id }}
          setup_aks_access: ${{ parameters.setup_aks_access }}
          repo_name: ${{ parameters.repo_name }}
          include_samples: ${{ parameters.include_samples }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: Three Horizons AI Platform Developer Environment for ${{ parameters.developer_name }}
        repoUrl: github.com?owner=three-horizon-ai&repo=${{ parameters.repo_name }}
        defaultBranch: main
        gitCommitMessage: 'Initial setup: Three Horizons Developer Environment'
        topics:
          - three-horizons
          - devbox
          - development-environment
          - azure
          - ai-platform

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    text:
      - title: Three Horizons AI Dev Box Created Successfully! 🎉
        content: |
          Your Azure Dev Box **${{ parameters.repo_name }}** has been successfully provisioned for the Three Horizons AI Platform!
          
          ## 📋 Dev Box Configuration
          - **Resource Group**: ${{ steps['create-resource-group'].output.resourceGroupName }}
          - **Dev Center**: ${{ steps['deploy-devbox-infrastructure'].output.devCenterName }}
          - **Project**: ${{ steps['deploy-devbox-infrastructure'].output.projectName }}
          - **Pool**: ${{ steps['deploy-devbox-infrastructure'].output.poolName }}
          - **Size**: ${{ parameters.devbox_size }}
          - **Region**: ${{ parameters.devbox_region }}
          - **Image**: {% if parameters.use_image_definition %}three-horizons-ai-devbox (pre-configured){% else %}Custom configuration{% endif %}
          
          ## 🔧 Tools Configured
          - **Languages**: ${{ parameters.languages | join(', ') }}
          - **Cloud Tools**: ${{ parameters.cloud_tools | join(', ') }}
          - **AI/ML Tools**: ${{ parameters.ai_tools | join(', ') }}
          
          ## 🚀 Next Steps
          1. **Access your Dev Box** at the [Azure Dev Box Portal](${{ steps['deploy-devbox-infrastructure'].output.devBoxPortalUrl }})
          2. **Create a new Dev Box** using the **${{ steps['deploy-devbox-infrastructure'].output.poolName }}** pool
          3. **Connect to your Dev Box** and run the setup script
          4. **Open VS Code** with pre-installed extensions
          5. **Start developing** with the Three Horizons platform
          
          The repository contains your personalized development environment configuration and deployment details.
          
          ## 📖 Detailed Instructions
          ${{ steps['deploy-devbox-infrastructure'].output.nextSteps.step1 }}
          ${{ steps['deploy-devbox-infrastructure'].output.nextSteps.step2 }}
          ${{ steps['deploy-devbox-infrastructure'].output.nextSteps.step3 }}
          ${{ steps['deploy-devbox-infrastructure'].output.nextSteps.step4 }}
    links:
      - title: Azure Dev Box Portal
        url: ${{ steps['deploy-devbox-infrastructure'].output.devBoxPortalUrl }}
      - title: Azure Resource Group
        url: https://portal.azure.com/#@/resource/subscriptions/${{ azure.subscriptionId }}/resourceGroups/${{ steps['create-resource-group'].output.resourceGroupName }}/overview
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: VS Code Devcontainer
        url: vscode://ms-vscode-remote.remote-containers/cloneInVolume?url=${{ steps.publish.output.remoteUrl }}
      - title: GitHub Codespaces
        url: https://github.com/codespaces/new?hide_repo_select=true&ref=main&repo=${{ steps.publish.output.repoId }}
      - title: Three Horizons Documentation
        url: https://github.com/three-horizon-ai/Three-Horizons-AI-Developer-Platform/tree/main/docs
