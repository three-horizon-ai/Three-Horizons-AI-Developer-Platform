apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: h2-security-pipeline
  title: "H2: Enhanced Security Pipeline"
  description: "Advanced security pipeline with vulnerability scanning, policy enforcement, and compliance checks for Horizon 2"
  annotations:
    backstage.io/managed-by-location: url:https://github.com/three-horizon-ai/Three-Horizons-AI-Developer-Platform/blob/main/templates/h2-optimization/security-pipeline/template.yaml
  tags:
    - horizon-2
    - optimization
    - security
    - compliance
    - vulnerability-scanning
    - policy-enforcement
spec:
  owner: platform-team
  type: security
  
  parameters:
    - title: Security Pipeline Configuration
      required:
        - name
        - owner
        - securityLevel
      properties:
        name:
          title: "Security Pipeline Name"
          type: string
          pattern: '^[a-z0-9-]+$'
          description: "Unique name for your security pipeline"
          default: h2-security-pipeline
        description:
""          title: "Description"
          type: string
          description: "Description of your security pipeline"
          default: Enhanced security pipeline with comprehensive scanning and policy enforcement
        owner:
          title: "Owner"
          type: string
          description: "Owner of the security pipeline (GitHub username or team)"
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        securityLevel:
          title: "Security Level"
          type: string
          description: "Security compliance level"
          default: high
          enum:
            - basic
            - medium
            - high
            - enterprise
            
    - title: Vulnerability Scanning
      required:
        - enableSAST
        - enableDAST
        - enableSCA
      properties:
        enableSAST:
          title: "Enable SAST"
          type: boolean
          description: "Enable Static Application Security Testing"
          default: true
        enableDAST:
          title: "Enable DAST"
          type: boolean
          description: "Enable Dynamic Application Security Testing"
          default: true
        enableSCA:
          title: "Enable SCA"
          type: boolean
          description: "Enable Software Composition Analysis"
          default: true
        enableContainerScanning:
          title: "Enable Container Scanning"
          type: boolean
          description: "Enable container image vulnerability scanning"
          default: true
        enableIaCScan:
          title: "Enable IaC Scanning"
          type: boolean
          description: "Enable Infrastructure as Code security scanning"
          default: true
        scanTools:
          title: "Security Scanning Tools"
          type: array
          description: "Security tools to integrate"
          items:
            type: string
            enum:
              - sonarqube
              - snyk
              - codeql
              - trivy
              - checkov
              - bandit
              - semgrep
          default: ["sonarqube", "snyk", "trivy"]
          ui:widget: checkboxes
          
    - title: Policy Enforcement
      required:
        - enableOPA
        - enableFalco
      properties:
        enableOPA:
          title: "Enable OPA Gatekeeper"
          type: boolean
          description: "Enable Open Policy Agent for policy enforcement"
          default: true
        enableFalco:
          title: "Enable Falco"
          type: boolean
          description: "Enable Falco for runtime security monitoring"
          default: true
        enablePodSecurityStandards:
          title: "Enable Pod Security Standards"
          type: boolean
          description: "Enable Kubernetes Pod Security Standards"
          default: true
        enableNetworkPolicies:
          title: "Enable Network Policies"
          type: boolean
          description: "Enable Kubernetes Network Policies"
          default: true
        policyFramework:
          title: "Policy Framework"
          type: string
          description: "Security policy framework to implement"
          default: nist
          enum:
            - nist
            - cis
            - pci-dss
            - iso27001
            - custom
            
    - title: Compliance Requirements
      required:
        - complianceStandards
        - enableAuditing
      properties:
        complianceStandards:
          title: "Compliance Standards"
          type: array
          description: "Compliance standards to enforce"
          items:
            type: string
            enum:
              - soc2
              - pci-dss
              - hipaa
              - gdpr
              - ccpa
              - fedramp
          default: ["soc2"]
          ui:widget: checkboxes
        enableAuditing:
          title: "Enable Security Auditing"
          type: boolean
          description: "Enable comprehensive security auditing"
          default: true
        enableSecretScanning:
          title: "Enable Secret Scanning"
          type: boolean
          description: "Enable scanning for exposed secrets"
          default: true
        enableCISBenchmarks:
          title: "Enable CIS Benchmarks"
          type: boolean
          description: "Enable CIS Kubernetes benchmarks"
          default: true
          
    - title: Azure Security Integration
      required:
        - enableDefender
        - azureSubscription
      properties:
        enableDefender:
          title: "Enable Microsoft Defender"
          type: boolean
          description: "Enable Microsoft Defender for Cloud"
          default: true
        azureSubscription:
          title: "Azure Subscription ID"
          type: string
          description: "Azure subscription ID for security services"
          ui:help: 'Enter your Azure subscription ID (GUID format)'
        enableSentinel:
          title: "Enable Azure Sentinel"
          type: boolean
          description: "Enable Azure Sentinel for SIEM"
          default: false
        enableKeyVault:
          title: "Enable Azure Key Vault"
          type: boolean
          description: "Enable Azure Key Vault for secret management"
          default: true
        enableSecurityCenter:
          title: "Enable Security Center"
          type: boolean
          description: "Enable Azure Security Center recommendations"
          default: true
          
    - title: Notification Configuration
      required:
        - alertingSeverity
        - notificationChannels
      properties:
        alertingSeverity:
          title: "Minimum Alerting Severity"
          type: string
          description: "Minimum severity level for security alerts"
          default: medium
          enum:
            - low
            - medium
            - high
            - critical
        notificationChannels:
          title: "Notification Channels"
          type: array
          description: "Channels for security notifications"
          items:
            type: string
            enum:
              - email
              - slack
              - teams
              - pagerduty
              - jira
          default: ["email", "slack"]
          ui:widget: checkboxes
        slackChannel:
          title: "Slack Channel"
          type: string
          description: "Slack channel for security notifications"
          default: "#security-alerts"
        emailRecipients:
          title: "Email Recipients"
          type: string
          description: "Email addresses for security notifications (comma-separated)"
          ui:help: 'Enter email addresses separated by commas'

  steps:
    - id: template
      name: Render Security Pipeline Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: "${{ parameters.description }}"
          owner: ${{ parameters.owner }}
          securityLevel: ${{ parameters.securityLevel }}
          enableSAST: ${{ parameters.enableSAST }}
          enableDAST: ${{ parameters.enableDAST }}
          enableSCA: ${{ parameters.enableSCA }}
          enableContainerScanning: ${{ parameters.enableContainerScanning }}
          enableIaCScan: ${{ parameters.enableIaCScan }}
          scanTools: ${{ parameters.scanTools }}
          enableOPA: ${{ parameters.enableOPA }}
          enableFalco: ${{ parameters.enableFalco }}
          enablePodSecurityStandards: ${{ parameters.enablePodSecurityStandards }}
          enableNetworkPolicies: ${{ parameters.enableNetworkPolicies }}
          policyFramework: ${{ parameters.policyFramework }}
          complianceStandards: ${{ parameters.complianceStandards }}
          enableAuditing: ${{ parameters.enableAuditing }}
          enableSecretScanning: ${{ parameters.enableSecretScanning }}
          enableCISBenchmarks: ${{ parameters.enableCISBenchmarks }}
          enableDefender: ${{ parameters.enableDefender }}
          azureSubscription: ${{ parameters.azureSubscription }}
          enableSentinel: ${{ parameters.enableSentinel }}
          enableKeyVault: ${{ parameters.enableKeyVault }}
          enableSecurityCenter: ${{ parameters.enableSecurityCenter }}
          alertingSeverity: ${{ parameters.alertingSeverity }}
          notificationChannels: ${{ parameters.notificationChannels }}
          slackChannel: ${{ parameters.slackChannel }}
          emailRecipients: ${{ parameters.emailRecipients }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: "'Enhanced security pipeline for ${{ parameters.name }}'"
        repoUrl: github.com/three-horizon-ai/${{ parameters.name }}
        defaultBranch: main
        gitCommitMessage: 'Initial security pipeline setup for ${{ parameters.name }}'
        gitAuthorName: ${{ parameters.owner }}
        gitAuthorEmail: ${{ parameters.owner }}@users.noreply.github.com

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: https://github.com/three-horizon-ai/${{ parameters.name }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Security Dashboard
        url: https://security-dashboard.${{ parameters.name }}.local
