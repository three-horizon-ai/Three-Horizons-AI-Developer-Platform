apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: three-horizon-ai/${{ values.name }}
    backstage.io/source-location: url:https://github.com/three-horizon-ai/${{ values.name }}
    argocd/app-name: ${{ values.name }}
  tags:
    - horizon-2
    - optimization
    - gitops
    - argocd
spec:
  type: gitops-application
  lifecycle: production
  owner: ${{ values.owner }}
  system: three-horizons
  dependsOn:
    - resource:argocd-server
