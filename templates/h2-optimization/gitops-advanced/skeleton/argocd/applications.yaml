apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.argoCDNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/three-horizon-ai/${{ values.name }}
    targetRevision: HEAD
    path: manifests/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.name }}-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}-staging
  namespace: ${{ values.argoCDNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/three-horizon-ai/${{ values.name }}
    targetRevision: HEAD
    path: manifests/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.name }}-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}-prod
  namespace: ${{ values.argoCDNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/three-horizon-ai/${{ values.name }}
    targetRevision: HEAD
    path: manifests/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.name }}-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync for production
    automated: null
