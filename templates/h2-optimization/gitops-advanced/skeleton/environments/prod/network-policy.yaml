apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${{ values.component_id }}-netpol
  namespace: ${{ values.component_id }}-prod
  labels:
    app.kubernetes.io/name: ${{ values.component_id }}
    app.kubernetes.io/instance: ${{ values.component_id }}-prod
    app.kubernetes.io/managed-by: argocd
    horizon: h2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.component_id }}
      app.kubernetes.io/instance: ${{ values.component_id }}-prod
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8080
  - from: []
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 443
