sonar.projectKey=${{ values.component_id }}
sonar.projectName=${{ values.component_id }}
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.spec.js
sonar.exclusions=node_modules/**,coverage/**,dist/**,build/**,.github/**,k8s/**

# Language configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/junit.xml

# Code coverage
sonar.coverage.exclusions=tests/**,**/*.test.js,**/*.spec.js,src/config/**

# Quality gates
sonar.qualitygate.wait=true

# SonarCloud configuration (if using SonarCloud)
sonar.organization=your-organization
sonar.host.url=https://sonarcloud.io

# Additional settings
sonar.sourceEncoding=UTF-8
sonar.log.level=INFO
