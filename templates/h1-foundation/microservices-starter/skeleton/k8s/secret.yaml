apiVersion: v1
kind: Secret
metadata:
  name: ${{ values.component_id }}-secrets
  namespace: ${{ values.namespace | default("default") }}
  labels:
    app: ${{ values.component_id }}
    horizon: h1
    component: microservice
type: Opaque
stringData:
  # Database Configuration (examples)
  DATABASE_URL: "postgresql://user:password@postgres:5432/mydb"
  REDIS_URL: "redis://redis:6379"
  
  # Azure Key Vault Integration
  AZURE_KEY_VAULT_URL: "https://${{ values.component_id }}-kv.vault.azure.net/"
  
  # API Keys (examples)
  API_SECRET_KEY: "your-secret-api-key-here"
  JWT_SECRET: "your-jwt-secret-here"
  
  # External Service Credentials
  EXTERNAL_API_KEY: "external-service-api-key"
  WEBHOOK_SECRET: "webhook-secret-key"
  
  # Azure Service Principal (if needed)
  AZURE_CLIENT_ID: "your-azure-client-id"
  AZURE_CLIENT_SECRET: "your-azure-client-secret"
  AZURE_TENANT_ID: "your-azure-tenant-id"
  
  # Storage Account Keys
  AZURE_STORAGE_ACCOUNT_NAME: "${{ values.component_id }}storage"
  AZURE_STORAGE_ACCOUNT_KEY: "your-storage-account-key"
  
  # Application Insights
  APPINSIGHTS_INSTRUMENTATIONKEY: "your-app-insights-key"
  APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=your-key;IngestionEndpoint=https://region.in.applicationinsights.azure.com/"
