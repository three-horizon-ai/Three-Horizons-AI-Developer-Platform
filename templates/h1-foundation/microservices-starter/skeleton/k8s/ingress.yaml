apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ values.component_id }}-ingress
  namespace: ${{ values.namespace | default("default") }}
  labels:
    app: ${{ values.component_id }}
    horizon: h1
    component: microservice
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Requested-With"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - ${{ values.component_id }}.${{ values.domain | default("example.com") }}
    secretName: ${{ values.component_id }}-tls
  rules:
  - host: ${{ values.component_id }}.${{ values.domain | default("example.com") }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${{ values.component_id }}-service
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: ${{ values.component_id }}-service
            port:
              number: 80
      - path: /ready
        pathType: Exact
        backend:
          service:
            name: ${{ values.component_id }}-service
            port:
              number: 80
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: ${{ values.component_id }}-service
            port:
              number: 3000
