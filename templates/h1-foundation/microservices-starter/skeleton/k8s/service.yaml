apiVersion: v1
kind: Service
metadata:
  name: ${{ values.component_id }}-service
  namespace: ${{ values.namespace | default("default") }}
  labels:
    app: ${{ values.component_id }}
    horizon: h1
    component: microservice
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: ${{ values.component_id }}
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 3000
    targetPort: 3000
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.component_id }}-headless
  namespace: ${{ values.namespace | default("default") }}
  labels:
    app: ${{ values.component_id }}
    horizon: h1
    component: microservice
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: ${{ values.component_id }}
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
