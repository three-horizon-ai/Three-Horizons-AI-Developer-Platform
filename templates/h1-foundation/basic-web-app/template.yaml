apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: h1-basic-web-app
  title: "H1: Basic Web Application"
  description: "Horizon 1 - Foundation: Create a basic web application with Azure deployment"
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - h1-foundation
    - web-app
    - azure
    - nodejs
    - recommended
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Project Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          pattern: '^([a-z0-9\-]+)$'
        description:
          title: Description
          type: string
          description: Help others understand what this application is for
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
    - title: Azure Configuration
      required:
        - azureLocation
        - subscriptionId
      properties:
        azureLocation:
          title: Azure Location
          type: string
          description: Azure region for deployment
          default: centralus
          enum:
            - centralus
            - eastus
            - eastus2
            - westus2
            - westeurope
        subscriptionId:
          title: Azure Subscription ID
          type: string
          description: Azure subscription ID for resource deployment
    - title: Repository Information
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          owner: ${{ parameters.owner }}
          azureLocation: ${{ parameters.azureLocation }}
          subscriptionId: ${{ parameters.subscriptionId }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts: ["github.com"]
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
