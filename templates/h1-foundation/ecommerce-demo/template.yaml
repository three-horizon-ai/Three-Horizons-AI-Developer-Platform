apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: h1-ecommerce-demo
  title: H1: E-commerce Demo Application
  description: Complete e-commerce demo showcasing Horizon 1 Foundation capabilities with microservices architecture
  annotations:
    backstage.io/managed-by-location: url:https://github.com/three-horizon-ai/Three-Horizons-AI-Developer-Platform/blob/main/templates/h1-foundation/ecommerce-demo/template.yaml
  tags:
    - horizon-1
    - foundation
    - demo
    - ecommerce
    - microservices
    - azure
    - kubernetes
spec:
  owner: platform-team
  type: application
  
  parameters:
    - title: Application Information
      required:
        - name
        - owner
      properties:
        name:
          title: Application Name
          type: string
          pattern: '^[a-z0-9-]+$'
          description: Unique name for your e-commerce application
          default: ecommerce-demo
        description:
          title: Description
          type: string
          description: Short description of your application
          default: E-commerce demo application with microservices architecture
        owner:
          title: Owner
          type: string
          description: Owner of the application (GitHub username or team)
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Azure Configuration
      required:
        - azureSubscription
        - azureLocation
      properties:
        azureSubscription:
          title: Azure Subscription ID
          type: string
          description: Azure subscription where resources will be deployed
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        azureLocation:
          title: Azure Location
          type: string
          description: Azure region for deployment
          default: centralus
          enum:
            - centralus
            - eastus
            - eastus2
            - westus2
            - westeurope
            - northeurope
        resourceGroupName:
          title: Resource Group Name
          type: string
          description: Azure resource group name (will be created if not exists)
          default: rg-ecommerce-demo
          pattern: '^[a-zA-Z0-9._-]+$'

    - title: Repository Information
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - three-horizon-ai

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: https://github.com/three-horizon-ai/ecommerce-templates
        targetPath: ./ecommerce-app
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: fetch-infrastructure
      name: Fetch Infrastructure Templates
      action: fetch:template
      input:
        url: ./infrastructure
        targetPath: ./infrastructure
        values:
          name: ${{ parameters.name }}
          azureSubscription: ${{ parameters.azureSubscription }}
          azureLocation: ${{ parameters.azureLocation }}
          resourceGroupName: ${{ parameters.resourceGroupName }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: 'E-commerce demo application for ${{ parameters.name }}'
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: 'Initial commit: E-commerce demo application'

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: create-azure-resources
      name: Deploy Azure Infrastructure
      action: azure:arm-template
      input:
        subscriptionId: ${{ parameters.azureSubscription }}
        resourceGroupName: ${{ parameters.resourceGroupName }}
        location: ${{ parameters.azureLocation }}
        templatePath: './infrastructure/main.bicep'
        parameters:
          appName: ${{ parameters.name }}
          location: ${{ parameters.azureLocation }}

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Azure Portal
        url: https://portal.azure.com/#@/resource/subscriptions/${{ parameters.azureSubscription }}/resourceGroups/${{ parameters.resourceGroupName }}
      - title: Application URL
        url: https://${{ parameters.name }}.azurewebsites.net
