name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AZURE_SUBSCRIPTION_ID: ${{ values.azureSubscription }}
  AZURE_LOCATION: ${{ values.azureLocation }}
  RESOURCE_GROUP: ${{ values.resourceGroup }}
  NODE_VERSION: ${{ values.nodeVersion }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ values.nodeVersion }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Run security audit
      run: npm audit
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          dist/
          build/
          out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Azure
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure
      run: |
        echo "Deploying to Azure..."
        echo "Target: ${{ values.deploymentTarget }}"
        echo "Environment: ${{ values.environment }}"
        # Add deployment logic here based on target type
    
    - name: Health Check
      run: |
        echo "Performing health check..."
        # Add health check logic here
