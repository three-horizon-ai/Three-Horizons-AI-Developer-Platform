apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: h1-basic-cicd
  title: H1: Basic CI/CD Pipeline
  description: Set up basic CI/CD pipeline for Horizon 1 with GitHub Actions and Azure deployment
  annotations:
    backstage.io/managed-by-location: url:https://github.com/three-horizon-ai/Three-Horizons-AI-Developer-Platform/blob/main/templates/h1-foundation/basic-cicd/template.yaml
  tags:
    - horizon-1
    - foundation
    - cicd
    - github-actions
    - azure
    - devops
spec:
  owner: platform-team
  type: workflow
  
  parameters:
    - title: Pipeline Configuration
      required:
        - name
        - owner
        - targetType
      properties:
        name:
          title: Pipeline Name
          type: string
          pattern: '^[a-z0-9-]+$'
          description: Unique name for your CI/CD pipeline
          default: basic-cicd-pipeline
        description:
          title: Description
          type: string
          description: Description of your CI/CD pipeline
          default: Basic CI/CD pipeline for Horizon 1 applications
        owner:
          title: Owner
          type: string
          description: Owner of the pipeline (GitHub username or team)
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        targetType:
          title: Target Application Type
          type: string
          description: Type of application to deploy
          default: web-app
          enum:
            - web-app
            - api
            - microservice
            - static-site
            - container
            
    - title: Azure Configuration
      required:
        - azureSubscription
        - azureLocation
        - resourceGroup
      properties:
        azureSubscription:
          title: Azure Subscription ID
          type: string
          description: Azure subscription ID for deployment
          ui:help: 'Enter your Azure subscription ID (GUID format)'
        azureLocation:
          title: Azure Location
          type: string
          description: Azure region for deployment
          default: eastus
          enum:
            - eastus
            - westus2
            - northeurope
            - westeurope
            - australiaeast
            - southeastasia
        resourceGroup:
          title: Resource Group
          type: string
          description: Azure resource group name
          default: rg-cicd-demo
          
    - title: Build Configuration
      required:
        - buildTool
        - nodeVersion
      properties:
        buildTool:
          title: Build Tool
          type: string
          description: Build tool to use
          default: npm
          enum:
            - npm
            - yarn
            - pnpm
            - maven
            - gradle
            - dotnet
        nodeVersion:
          title: Node.js Version
          type: string
          description: Node.js version for build
          default: '18'
          enum:
            - '16'
            - '18'
            - '20'
            - '21'
        enableTesting:
          title: Enable Testing
          type: boolean
          description: Include testing step in pipeline
          default: true
        enableSecurity:
          title: Enable Security Scanning
          type: boolean
          description: Include security scanning step
          default: true
          
    - title: Deployment Configuration
      required:
        - deploymentTarget
        - environment
      properties:
        deploymentTarget:
          title: Deployment Target
          type: string
          description: Azure service to deploy to
          default: app-service
          enum:
            - app-service
            - container-apps
            - aks
            - static-web-apps
            - functions
        environment:
          title: Environment
          type: string
          description: Target environment
          default: dev
          enum:
            - dev
            - staging
            - prod
        enableBlueGreen:
          title: Enable Blue-Green Deployment
          type: boolean
          description: Enable blue-green deployment strategy
          default: false
        enableRollback:
          title: Enable Automatic Rollback
          type: boolean
          description: Enable automatic rollback on failure
          default: true

  steps:
    - id: template
      name: Render CI/CD Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          targetType: ${{ parameters.targetType }}
          azureSubscription: ${{ parameters.azureSubscription }}
          azureLocation: ${{ parameters.azureLocation }}
          resourceGroup: ${{ parameters.resourceGroup }}
          buildTool: ${{ parameters.buildTool }}
          nodeVersion: ${{ parameters.nodeVersion }}
          enableTesting: ${{ parameters.enableTesting }}
          enableSecurity: ${{ parameters.enableSecurity }}
          deploymentTarget: ${{ parameters.deploymentTarget }}
          environment: ${{ parameters.environment }}
          enableBlueGreen: ${{ parameters.enableBlueGreen }}
          enableRollback: ${{ parameters.enableRollback }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: 'Basic CI/CD Pipeline for ${{ parameters.name }}'
        repoUrl: github.com/three-horizon-ai/${{ parameters.name }}
        defaultBranch: main
        gitCommitMessage: 'Initial CI/CD pipeline setup for ${{ parameters.name }}'
        gitAuthorName: ${{ parameters.owner }}
        gitAuthorEmail: ${{ parameters.owner }}@users.noreply.github.com

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: https://github.com/three-horizon-ai/${{ parameters.name }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: GitHub Actions
        url: ${{ steps.publish.output.remoteUrl }}/actions
