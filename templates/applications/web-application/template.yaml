apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: three-horizons-web-application
  title: Three Horizons Web Application Template
  description: Create a new web application with standard Three Horizons configurations
  tags:
    - recommended
    - web
    - typescript
    - react
spec:
  owner: three-horizons-platform-team
  type: web-application
  parameters:
    - title: Provide Application Information
      required:
        - name
        - description
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the application
          ui:autofocus: true
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
        description:
          title: Description
          type: string
          description: Description of the application
        owner:
          title: Owner
          type: string
          description: Owner of the application
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
      
    - title: Select Technologies
      required:
        - framework
      properties:
        framework:
          title: Framework
          type: string
          enum:
            - React
            - Angular
            - Vue
          default: React
          description: Which web framework to use
        state:
          title: State Management
          type: string
          enum:
            - Redux
            - MobX
            - None
          default: Redux
          description: State management solution
        testing:
          title: Testing Framework
          type: string
          enum:
            - Jest
            - Testing Library
            - Cypress
          default: Jest
          description: Testing framework to use
          
    - title: Configure CI/CD
      properties:
        cicd:
          title: CI/CD Pipeline
          type: string
          enum:
            - GitHub Actions
            - Azure DevOps
          default: GitHub Actions
          description: CI/CD pipeline to configure
        containerize:
          title: Containerize
          type: boolean
          description: Containerize the application
          default: true
  
  steps:
    - id: template
      name: Fetch Application Template
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          framework: ${{ parameters.framework }}
          stateManagement: ${{ parameters.state }}
          testingFramework: ${{ parameters.testing }}
          cicdPipeline: ${{ parameters.cicd }}
          containerize: ${{ parameters.containerize }}

    - id: copyWorkflow
      name: Copy Correct CI/CD Workflow
      action: fetch:template
      input:
        url: ${{ parameters.containerize == true && './ci-workflows/container' || './ci-workflows/standard' }}
        targetPath: ./.github/workflows/
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          
    - id: publish
      name: Publish Application
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=ThreeHorizonsOrg&repo=${{ parameters.name }}
        defaultBranch: main
        
    - id: register
      name: Register Application in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'
  
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }} 