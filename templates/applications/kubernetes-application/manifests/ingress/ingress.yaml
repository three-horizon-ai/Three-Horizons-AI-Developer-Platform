apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{values.name}}
  namespace: {{values.namespace}}
  labels:
    app: {{values.name}}
    part-of: three-horizons
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: {{values.ingressHost}}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{values.name}}
            port:
              number: 80
  tls:
  - hosts:
    - {{values.ingressHost}}
    secretName: {{values.name}}-tls 