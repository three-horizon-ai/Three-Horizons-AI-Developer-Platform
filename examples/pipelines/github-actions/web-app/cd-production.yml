name: Deploy to Production

on:
  workflow_dispatch:  # Manual trigger
  release:
    types: [published]  # Triggered when a release is published

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build for Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm test
        
      - name: Build application
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          REACT_APP_ENVIRONMENT: production
          GENERATE_SOURCEMAP: false
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: build/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v3
      
      - name: Run dependency vulnerability scan
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          
      - name: Run SAST scan
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  pre-deploy-approval:
    name: Production Deployment Approval
    needs: [security]
    runs-on: ubuntu-latest
    environment:
      name: production-approval
    steps:
      - name: Approval Check
        run: echo "Deployment to production approved"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deploy-approval]
    environment:
      name: production
      url: https://app.example.com
    steps:
      - uses: actions/checkout@v3
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: build/
          
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRODUCTION }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "build"
          output_location: ""
          deployment_environment: production

  post-deploy-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Health check
        run: |
          # Wait for DNS and CDN propagation
          sleep 120
          
          # Perform health check
          npx http-status-check https://app.example.com/health
          
      - name: Run smoke tests
        run: |
          npm ci
          npm run test:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://app.example.com
          
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [post-deploy-validation]
    if: always()
    steps:
      - name: Check previous step status
        id: check
        run: |
          if [ "${{ needs.post-deploy-validation.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=Production deployment successful!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "message=Production deployment failed!" >> $GITHUB_OUTPUT
          fi
          
      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: deployments
          SLACK_TITLE: Production Deployment ${{ steps.check.outputs.status }}
          SLACK_MESSAGE: ${{ steps.check.outputs.emoji }} ${{ steps.check.outputs.message }}
          SLACK_COLOR: ${{ steps.check.outputs.status == 'success' && 'good' || 'danger' }} 