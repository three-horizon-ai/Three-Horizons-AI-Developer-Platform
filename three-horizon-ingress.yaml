apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: three-horizon-ingress
  namespace: three-horizon
  annotations:
    kubernetes.io/ingress.class: "nginx"  # Ajuste conforme seu cluster
    # Adicione outras anotações conforme necessário para o seu ambiente
spec:
  rules:
  - host: three-horizon.example.com  # Substitua pelo seu domínio real
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: three-horizon  # Este deve ser o nome do serviço criado pelo operador
            port:
              number: 7007  # Porta padrão do Backstage 