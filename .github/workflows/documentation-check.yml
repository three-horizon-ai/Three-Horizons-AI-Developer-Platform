name: Documentation Check

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check broken links
        run: |
          ./scripts/validation/enhanced-link-checker.sh
          
      - name: Generate report
        if: success() || failure()
        run: |
          ./scripts/validation/generate-doc-map.sh
          
      - name: Archive link check results
        if: success() || failure()
        uses: actions/upload-artifact@v3
        with:
          name: documentation-report
          path: |
            docs/reports/link-check-report-*.md
            docs/DOCUMENTATION_MAP.md

  language-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run language check
        run: |
          ./scripts/language-check.sh
          
      - name: Generate report
        if: success() || failure()
        run: |
          echo "## Language Check Report" > language-check-report.md
          echo "Generated on $(date)" >> language-check-report.md
          echo "" >> language-check-report.md
          cat language-check.log >> language-check-report.md || echo "No language issues found" >> language-check-report.md
          
      - name: Archive language check results
        if: success() || failure()
        uses: actions/upload-artifact@v3
        with:
          name: language-check-report
          path: language-check-report.md
          
  validate-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate SVGs
        run: |
          node scripts/utilities/svg-validation.js
          
      - name: Generate report
        if: success() || failure()
        run: |
          echo "## SVG Validation Report" > svg-validation-report.md
          echo "Generated on $(date)" >> svg-validation-report.md
          echo "" >> svg-validation-report.md
          cat svg-validation.log >> svg-validation-report.md || echo "All SVGs are valid" >> svg-validation-report.md
          
      - name: Archive SVG validation results
        if: success() || failure()
        uses: actions/upload-artifact@v3
        with:
          name: svg-validation-report
          path: svg-validation-report.md