<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!-- Background -->
  <rect width="900" height="700" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="450" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Deployment Options</text>
  
  <!-- Table Headers -->
  <rect x="100" y="80" width="700" height="60" fill="#0078d4" stroke="#004b8c" stroke-width="1"/>
  <text x="200" y="120" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Feature</text>
  <text x="450" y="120" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Azure Red Hat OpenShift (ARO)</text>
  <text x="700" y="120" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Azure Kubernetes Service (AKS)</text>
  
  <!-- Row 1: Management -->
  <rect x="100" y="140" width="200" height="60" fill="#e6f2ff" stroke="#cccccc" stroke-width="1"/>
  <text x="200" y="177" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Management</text>
  
  <rect x="300" y="140" width="300" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Jointly managed by Microsoft and Red Hat</text>
  <text x="450" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Full enterprise support</text>
  
  <rect x="600" y="140" width="200" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Microsoft managed</text>
  <text x="700" y="185" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Azure support</text>
  
  <!-- Row 2: Features -->
  <rect x="100" y="200" width="200" height="80" fill="#e6f2ff" stroke="#cccccc" stroke-width="1"/>
  <text x="200" y="247" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Platform Features</text>
  
  <rect x="300" y="200" width="300" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">OpenShift Container Platform</text>
  <text x="450" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Built-in CI/CD, registry, monitoring</text>
  <text x="450" y="265" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Advanced networking and security</text>
  
  <rect x="600" y="200" width="200" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="225" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Kubernetes core</text>
  <text x="700" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Add-ons for extended functionality</text>
  <text x="700" y="265" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Integration with Azure services</text>
  
  <!-- Row 3: Cost -->
  <rect x="100" y="280" width="200" height="60" fill="#e6f2ff" stroke="#cccccc" stroke-width="1"/>
  <text x="200" y="317" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Cost</text>
  
  <rect x="300" y="280" width="300" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Higher cost with included Red Hat</text>
  <text x="450" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">subscription and services</text>
  
  <rect x="600" y="280" width="200" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Lower cost, pay for</text>
  <text x="700" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">resources consumed</text>
  
  <!-- Row 4: Developer Hub Installation -->
  <rect x="100" y="340" width="200" height="80" fill="#e6f2ff" stroke="#cccccc" stroke-width="1"/>
  <text x="200" y="387" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Developer Hub Installation</text>
  
  <rect x="300" y="340" width="300" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Via Operator in OpenShift marketplace</text>
  <text x="450" y="385" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Native integration with OpenShift</text>
  <text x="450" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Simplified management</text>
  
  <rect x="600" y="340" width="200" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Via Helm charts</text>
  <text x="700" y="385" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manual configuration</text>
  <text x="700" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">More customization options</text>
  
  <!-- Row 5: Use Cases -->
  <rect x="100" y="420" width="200" height="100" fill="#e6f2ff" stroke="#cccccc" stroke-width="1"/>
  <text x="200" y="477" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Ideal Use Cases</text>
  
  <rect x="300" y="420" width="300" height="100" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="445" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Enterprise with OpenShift investment</text>
  <text x="450" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Hybrid cloud deployments</text>
  <text x="450" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Mission-critical applications</text>
  <text x="450" y="505" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Need for advanced cluster features</text>
  
  <rect x="600" y="420" width="200" height="100" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="445" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Cost-sensitive projects</text>
  <text x="700" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Azure-native workloads</text>
  <text x="700" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Flexibility in configuration</text>
  <text x="700" y="505" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Smaller scale deployments</text>
  
  <!-- Row 6: Migration Path -->
  <rect x="100" y="520" width="200" height="80" fill="#e6f2ff" stroke="#cccccc" stroke-width="1"/>
  <text x="200" y="567" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Migration Path</text>
  
  <rect x="300" y="520" width="300" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="450" y="545" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Seamless for existing OpenShift users</text>
  <text x="450" y="565" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Consistent experience with on-premises</text>
  <text x="450" y="585" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">OpenShift deployments</text>
  
  <rect x="600" y="520" width="200" height="80" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="700" y="545" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Standard Kubernetes</text>
  <text x="700" y="565" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">migrations</text>
  <text x="700" y="585" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Platform-specific refactoring</text>
  
  <!-- Summary Box -->
  <rect x="100" y="620" width="700" height="60" rx="5" fill="#0078d4" stroke="#004b8c" stroke-width="1"/>
  <text x="450" y="650" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Three Horizons supports both deployment options with the same developer experience</text>
  
  <!-- Legend -->
  <rect x="100" y="600" width="20" height="20" fill="#EE0000" rx="3"/>
  <text x="130" y="615" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Red Hat recommended</text>
  
  <rect x="250" y="600" width="20" height="20" fill="#0078d4" rx="3"/>
  <text x="280" y="615" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Azure recommended</text>
  
  <rect x="400" y="600" width="20" height="20" fill="#5cb85c" rx="3"/>
  <text x="430" y="615" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Three Horizons optimized</text>
</svg>
