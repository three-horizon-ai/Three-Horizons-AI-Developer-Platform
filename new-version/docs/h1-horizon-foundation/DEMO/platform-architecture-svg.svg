<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a">Three Horizons AI Platform Architecture</text>
  
  <!-- Developer Experience Layer -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="1100" height="100" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1976d2">Developer Experience Layer</text>
    
    <!-- Components -->
    <rect x="50" y="40" width="200" height="40" rx="5" fill="#bbdefb"/>
    <text x="150" y="65" text-anchor="middle" font-size="14" fill="#0d47a1">🖥️ DevBox</text>
    
    <rect x="300" y="40" width="200" height="40" rx="5" fill="#bbdefb"/>
    <text x="400" y="65" text-anchor="middle" font-size="14" fill="#0d47a1">📚 Developer Portal</text>
    
    <rect x="550" y="40" width="200" height="40" rx="5" fill="#bbdefb"/>
    <text x="650" y="65" text-anchor="middle" font-size="14" fill="#0d47a1">🤖 AI Assistants</text>
    
    <rect x="800" y="40" width="200" height="40" rx="5" fill="#bbdefb"/>
    <text x="900" y="65" text-anchor="middle" font-size="14" fill="#0d47a1">🚀 Self-Service</text>
  </g>
  
  <!-- Platform Core Layer -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="1100" height="150" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#388e3c">Platform Core Services</text>
    
    <!-- Azure -->
    <rect x="50" y="50" width="300" height="80" rx="5" fill="#c8e6c9"/>
    <text x="200" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">☁️ Microsoft Azure</text>
    <text x="200" y="95" text-anchor="middle" font-size="12" fill="#2e7d32">AKS/ARO • AI Services</text>
    <text x="200" y="110" text-anchor="middle" font-size="12" fill="#2e7d32">Monitor • Defender</text>
    
    <!-- Red Hat -->
    <rect x="400" y="50" width="300" height="80" rx="5" fill="#c8e6c9"/>
    <text x="550" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">📚 Red Hat Dev Hub</text>
    <text x="550" y="95" text-anchor="middle" font-size="12" fill="#2e7d32">Backstage • Catalog</text>
    <text x="550" y="110" text-anchor="middle" font-size="12" fill="#2e7d32">Golden Paths • Plugins</text>
    
    <!-- GitHub -->
    <rect x="750" y="50" width="300" height="80" rx="5" fill="#c8e6c9"/>
    <text x="900" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">🐙 GitHub Enterprise</text>
    <text x="900" y="95" text-anchor="middle" font-size="12" fill="#2e7d32">Actions • Copilot</text>
    <text x="900" y="110" text-anchor="middle" font-size="12" fill="#2e7d32">Advanced Security</text>
  </g>
  
  <!-- AI & Automation Layer -->
  <g transform="translate(50, 370)">
    <rect x="0" y="0" width="1100" height="120" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
    <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#c2185b">AI & Automation Services</text>
    
    <rect x="50" y="50" width="240" height="50" rx="5" fill="#f8bbd0"/>
    <text x="170" y="80" text-anchor="middle" font-size="14" fill="#880e4f">🧠 GitHub Copilot</text>
    
    <rect x="320" y="50" width="240" height="50" rx="5" fill="#f8bbd0"/>
    <text x="440" y="80" text-anchor="middle" font-size="14" fill="#880e4f">🧪 Azure AI Foundry</text>
    
    <rect x="590" y="50" width="240" height="50" rx="5" fill="#f8bbd0"/>
    <text x="710" y="80" text-anchor="middle" font-size="14" fill="#880e4f">🔌 Model Context Protocol</text>
    
    <rect x="860" y="50" width="190" height="50" rx="5" fill="#f8bbd0"/>
    <text x="955" y="80" text-anchor="middle" font-size="14" fill="#880e4f">🤖 Agents</text>
  </g>
  
  <!-- Infrastructure Layer -->
  <g transform="translate(50, 510)">
    <rect x="0" y="0" width="1100" height="120" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#f57c00">Infrastructure & Operations</text>
    
    <rect x="50" y="50" width="200" height="50" rx="5" fill="#ffe0b2"/>
    <text x="150" y="80" text-anchor="middle" font-size="14" fill="#e65100">🔧 IaC (Terraform)</text>
    
    <rect x="280" y="50" width="200" height="50" rx="5" fill="#ffe0b2"/>
    <text x="380" y="80" text-anchor="middle" font-size="14" fill="#e65100">🌊 GitOps</text>
    
    <rect x="510" y="50" width="200" height="50" rx="5" fill="#ffe0b2"/>
    <text x="610" y="80" text-anchor="middle" font-size="14" fill="#e65100">📊 Monitoring</text>
    
    <rect x="740" y="50" width="200" height="50" rx="5" fill="#ffe0b2"/>
    <text x="840" y="80" text-anchor="middle" font-size="14" fill="#e65100">🔒 Security</text>
    
    <rect x="970" y="50" width="80" height="50" rx="5" fill="#ffe0b2"/>
    <text x="1010" y="80" text-anchor="middle" font-size="14" fill="#e65100">📈 SRE</text>
  </g>
  
  <!-- Three Horizons Timeline -->
  <g transform="translate(50, 660)">
    <rect x="0" y="0" width="1100" height="100" rx="10" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
    <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#424242">Implementation Horizons</text>
    
    <!-- H1 -->
    <rect x="50" y="50" width="300" height="40" rx="5" fill="#81c784"/>
    <text x="200" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">🌅 H1: Foundation (Months 1-3)</text>
    
    <!-- H2 -->
    <rect x="400" y="50" width="300" height="40" rx="5" fill="#64b5f6"/>
    <text x="550" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">🌄 H2: Enhancement (Months 4-6)</text>
    
    <!-- H3 -->
    <rect x="750" y="50" width="300" height="40" rx="5" fill="#ba68c8"/>
    <text x="900" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a148c">🌇 H3: Innovation (Months 7+)</text>
  </g>
  
  <!-- Connections -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Vertical connections -->
  <line x1="600" y1="180" x2="600" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="350" x2="600" y2="370" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="490" x2="600" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="630" x2="600" y2="660" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>