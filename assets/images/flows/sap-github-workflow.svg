<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="sap-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0FAAFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0076CE;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="github-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#24292E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1B1F23;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ci-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#83B81A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5A8010;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="deployment-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DD7B00;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">SAP-GitHub Integration Workflow</text>
  
  <!-- SAP System Section -->
  <rect x="100" y="100" width="200" height="400" rx="10" ry="10" fill="#F8F8F8" stroke="#0076CE" stroke-width="2"/>
  <rect x="100" y="100" width="200" height="40" rx="10" ry="10" fill="url(#sap-gradient)" filter="url(#shadow)"/>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white" font-weight="bold">SAP System</text>
  
  <!-- SAP Components -->
  <rect x="120" y="160" width="160" height="60" rx="5" ry="5" fill="url(#sap-gradient)" filter="url(#shadow)" opacity="0.9"/>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">ABAP Development</text>
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Objects & Code</text>
  
  <rect x="120" y="240" width="160" height="60" rx="5" ry="5" fill="url(#sap-gradient)" filter="url(#shadow)" opacity="0.9"/>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Transport System</text>
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Change Management</text>
  
  <rect x="120" y="320" width="160" height="60" rx="5" ry="5" fill="url(#sap-gradient)" filter="url(#shadow)" opacity="0.9"/>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">gCTS</text>
  <text x="200" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Git Integration</text>
  
  <rect x="120" y="400" width="160" height="60" rx="5" ry="5" fill="url(#sap-gradient)" filter="url(#shadow)" opacity="0.9"/>
  <text x="200" y="430" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">BTP Connectivity</text>
  <text x="200" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Cloud Connector</text>
  
  <!-- GitHub Section -->
  <rect x="500" y="100" width="200" height="400" rx="10" ry="10" fill="#F8F8F8" stroke="#1B1F23" stroke-width="2"/>
  <rect x="500" y="100" width="200" height="40" rx="10" ry="10" fill="url(#github-gradient)" filter="url(#shadow)"/>
  <text x="600" y="125" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white" font-weight="bold">GitHub Enterprise</text>
  
  <!-- GitHub Components -->
  <rect x="520" y="160" width="160" height="60" rx="5" ry="5" fill="url(#github-gradient)" filter="url(#shadow)" opacity="0.9"/>
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Repositories</text>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Code Storage</text>
  
  <rect x="520" y="240" width="160" height="60" rx="5" ry="5" fill="url(#github-gradient)" filter="url(#shadow)" opacity="0.9"/>
  <text x="600" y="270" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Pull Requests</text>
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Code Reviews</text>
  
  <rect x="520" y="320" width="160" height="60" rx="5" ry="5" fill="url(#ci-gradient)" filter="url(#shadow)" opacity="0.9"/>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">GitHub Actions</text>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">CI/CD Pipelines</text>
  
  <rect x="520" y="400" width="160" height="60" rx="5" ry="5" fill="url(#deployment-gradient)" filter="url(#shadow)" opacity="0.9"/>
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Deployment</text>
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Release Management</text>
  
  <!-- Integration Workflow -->
  <rect x="320" y="170" width="160" height="260" rx="10" ry="10" fill="#F8F8F8" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#666" font-weight="bold">Integration Flow</text>
  
  <!-- Integration Steps -->
  <circle cx="400" cy="235" r="25" fill="url(#sap-gradient)" filter="url(#shadow)"/>
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">1</text>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Code Export</text>
  
  <circle cx="400" cy="325" r="25" fill="url(#github-gradient)" filter="url(#shadow)"/>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">2</text>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Git Commit</text>
  
  <circle cx="400" cy="415" r="25" fill="url(#ci-gradient)" filter="url(#shadow)"/>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">3</text>
  <text x="400" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">CI/CD</text>
  
  <!-- Connection Lines -->
  <line x1="280" y1="190" x2="375" y2="235" stroke="#0076CE" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="350" x2="375" y2="325" stroke="#0076CE" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="235" x2="520" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="325" x2="520" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="425" y1="415" x2="520" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="400" y1="260" x2="400" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="350" x2="400" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Bidirectional Line -->
  <line x1="520" y1="430" x2="280" y2="430" stroke="#DD7B00" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="285,425 280,430 285,435" fill="#DD7B00"/>
  <polygon points="515,425 520,430 515,435" fill="#DD7B00"/>
  
  <!-- Legend -->
  <rect x="100" y="520" width="600" height="60" rx="5" ry="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Workflow Legend</text>
  
  <rect x="120" y="555" width="15" height="15" fill="url(#sap-gradient)"/>
  <text x="205" y="567" font-family="Arial, sans-serif" font-size="12" fill="#333">SAP Components</text>
  
  <rect x="250" y="555" width="15" height="15" fill="url(#github-gradient)"/>
  <text x="335" y="567" font-family="Arial, sans-serif" font-size="12" fill="#333">GitHub Components</text>
  
  <rect x="380" y="555" width="15" height="15" fill="url(#ci-gradient)"/>
  <text x="465" y="567" font-family="Arial, sans-serif" font-size="12" fill="#333">CI/CD Process</text>
  
  <rect x="510" y="555" width="15" height="15" fill="url(#deployment-gradient)"/>
  <text x="595" y="567" font-family="Arial, sans-serif" font-size="12" fill="#333">Deployment Process</text>
</svg> 