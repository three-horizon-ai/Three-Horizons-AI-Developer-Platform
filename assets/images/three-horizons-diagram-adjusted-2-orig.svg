<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <!-- Styles -->
  <defs>
    <!-- Gradients for each technology -->
    <linearGradient id="azureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#0063B1" />
    </linearGradient>
    <linearGradient id="openshiftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE0000" />
      <stop offset="100%" stop-color="#BB0000" />
    </linearGradient>
    <linearGradient id="githubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E5494" />
      <stop offset="100%" stop-color="#473366" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
    
    <!-- Patterns for backgrounds -->
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  <rect width="800" height="600" fill="url(#gridPattern)" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold">Three Horizons Architecture</text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666">Azure + OpenShift + GitHub Integration</text>
  
  <!-- Main container with cloud background -->
  <rect x="50" y="100" width="700" height="450" rx="15" ry="15" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)" />
  
  <!-- Azure section -->
  <g class="azure-section">
    <rect x="80" y="140" width="200" height="380" rx="10" ry="10" fill="url(#azureGradient)" opacity="0.1" stroke="url(#azureGradient)" stroke-width="2" />
    <text x="180" y="170" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#0078D4">Azure</text>
    
    <!-- Azure components -->
    <rect x="100" y="190" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#0078D4" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Azure Kubernetes</text>
    <text x="180" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Service (AKS)</text>
    
    <rect x="100" y="290" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#0078D4" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Azure Database</text>
    <text x="180" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">PostgreSQL</text>
    
    <rect x="100" y="390" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#0078D4" stroke-width="2" filter="url(#shadow)" />
    <text x="180" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Azure Container</text>
    <text x="180" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Registry (ACR)</text>
  </g>
  
  <!-- OpenShift section -->
  <g class="openshift-section">
    <rect x="300" y="140" width="200" height="380" rx="10" ry="10" fill="url(#openshiftGradient)" opacity="0.1" stroke="url(#openshiftGradient)" stroke-width="2" />
    <text x="400" y="170" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#EE0000">OpenShift</text>
    
    <!-- OpenShift components -->
    <rect x="320" y="190" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#EE0000" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Developer Hub</text>
    <text x="400" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Backstage Portal</text>
    
    <rect x="320" y="290" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#EE0000" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Container Platform</text>
    <text x="400" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Orchestration</text>
    
    <rect x="320" y="390" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#EE0000" stroke-width="2" filter="url(#shadow)" />
    <text x="400" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Service Mesh</text>
    <text x="400" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">& API Management</text>
  </g>
  
  <!-- GitHub section -->
  <g class="github-section">
    <rect x="520" y="140" width="200" height="380" rx="10" ry="10" fill="url(#githubGradient)" opacity="0.1" stroke="url(#githubGradient)" stroke-width="2" />
    <text x="620" y="170" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#6E5494">GitHub</text>
    
    <!-- GitHub components -->
    <rect x="540" y="190" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#6E5494" stroke-width="2" filter="url(#shadow)" />
    <text x="620" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Actions</text>
    <text x="620" y="240" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">CI/CD Pipelines</text>
    
    <rect x="540" y="290" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#6E5494" stroke-width="2" filter="url(#shadow)" />
    <text x="620" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Repositories</text>
    <text x="620" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Source Control</text>
    
    <rect x="540" y="390" width="160" height="80" rx="8" ry="8" fill="#ffffff" stroke="#6E5494" stroke-width="2" filter="url(#shadow)" />
    <text x="620" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Advanced Security</text>
    <text x="620" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">& CodeQL</text>
  </g>
  
  <!-- Connection lines -->
  <g class="connections">
    <!-- Azure to OpenShift -->
    <path d="M 260 230 L 320 230" stroke="#0078D4" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 260 330 L 320 330" stroke="#0078D4" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 260 430 L 320 430" stroke="#0078D4" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- OpenShift to GitHub -->
    <path d="M 480 230 L 540 230" stroke="#EE0000" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 480 330 L 540 330" stroke="#EE0000" stroke-width="2" stroke-dasharray="5,5" />
    <path d="M 480 430 L 540 430" stroke="#EE0000" stroke-width="2" stroke-dasharray="5,5" />
  </g>
  
  <!-- Bottom text - adjusted with wider frame -->
  <rect x="125" y="565" width="550" height="25" rx="12" ry="12" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1" />
  <text x="400" y="583" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Three Horizons: Fusion of Microsoft Azure, Red Hat OpenShift, and GitHub Enterprise</text>
</svg>
