<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="650"
   height="200"
   viewBox="0 0 650 200"
   version="1.1"
   id="three-horizons-white-logo-svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   aria-labelledby="title-three-horizons-white"
>
  <title id="title-three-horizons-white">Three Horizons Platform White Logo</title>
  <desc id="desc-three-horizons-white">White version of the logo for the Three Horizons Platform</desc>
  
  <style>
    .horizon-1 { fill: #FFFFFF; }
    .horizon-2 { fill: #F0F0F0; }
    .horizon-3 { fill: #E0E0E0; }
    .logo-text { font-family: Arial, sans-serif; font-weight: bold; fill: #FFFFFF; }
    .logo-text-light { font-family: Arial, sans-serif; font-weight: bold; fill: #F0F0F0; }
    .background { fill: transparent; }
  </style>
  
  <!-- Background -->
  <rect width="650" height="200" class="background" />
  
  <!-- Logo Mark - Three Horizons -->
  <g id="logo-mark">
    <!-- Horizon 3 - Innovation -->
    <path d="M60,50 L140,50 C150,50 160,60 160,70 L160,90 C160,100 150,110 140,110 L60,110 C50,110 40,100 40,90 L40,70 C40,60 50,50 60,50 Z" 
          class="horizon-3" />
          
    <!-- Horizon 2 - Growth -->
    <path d="M60,80 L140,80 C150,80 160,90 160,100 L160,120 C160,130 150,140 140,140 L60,140 C50,140 40,130 40,120 L40,100 C40,90 50,80 60,80 Z" 
          class="horizon-2" opacity="0.9" />
          
    <!-- Horizon 1 - Core -->
    <path d="M60,110 L140,110 C150,110 160,120 160,130 L160,150 C160,160 150,170 140,170 L60,170 C50,170 40,160 40,150 L40,130 C40,120 50,110 60,110 Z" 
          class="horizon-1" opacity="0.8" />
  </g>
  
  <!-- Text Logo -->
  <g id="logo-text">
    <text x="200" y="100" font-size="36" class="logo-text">THREE HORIZONS</text>
    <text x="200" y="140" font-size="24" class="logo-text-light">PLATFORM</text>
  </g>
  
  <!-- Three Dots representing the three horizons -->
  <g id="logo-dots">
    <circle cx="220" y="160" r="5" class="horizon-1" />
    <circle cx="240" y="160" r="5" class="horizon-2" />
    <circle cx="260" y="160" r="5" class="horizon-3" />
  </g>
</svg>