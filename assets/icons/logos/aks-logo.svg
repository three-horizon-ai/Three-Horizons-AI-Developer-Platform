<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="200"
   height="200"
   viewBox="0 0 200 200"
   version="1.1"
   id="aks-logo-svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   aria-labelledby="title-aks"
>
  <title id="title-aks">Azure Kubernetes Service Logo</title>
  <desc id="desc-aks">Logo for Microsoft Azure Kubernetes Service (AKS)</desc>
  
  <style>
    .azure-blue { fill: #0072C6; }
    .dark-blue { fill: #0F1689; }
    .light-blue { fill: #2CACE3; }
  </style>
  
  <!-- Kubernetes Wheel -->
  <g id="k8s-wheel">
    <circle cx="100" cy="100" r="75" fill="white" stroke="#0072C6" stroke-width="2"/>
    
    <!-- Inner spokes -->
    <g id="spokes" stroke="#0072C6" stroke-width="3">
      <line x1="100" y1="45" x2="100" y2="70" />
      <line x1="100" y1="130" x2="100" y2="155" />
      <line x1="45" y1="100" x2="70" y2="100" />
      <line x1="130" y1="100" x2="155" y2="100" />
      
      <line x1="62" y1="62" x2="80" y2="80" />
      <line x1="120" y1="120" x2="138" y2="138" />
      <line x1="62" y1="138" x2="80" y2="120" />
      <line x1="120" y1="80" x2="138" y2="62" />
    </g>
    
    <!-- Central kubernetes logo -->
    <g id="k8s-logo">
      <circle cx="100" cy="100" r="20" class="azure-blue" />
      <path d="M90,85 L100,115 L110,85 Z" fill="white" />
    </g>
  </g>
  
  <!-- Azure cloud styling -->
  <path d="M165,45 C180,50 185,65 175,80 C190,85 195,100 185,115 L165,115 L145,85 Z" class="light-blue" opacity="0.7" />
  
  <!-- Text 'AKS' - hidden for simplified logo, uncomment if needed 
  <text x="100" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" class="azure-blue">AKS</text>
  -->
</svg>