<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="800"
   height="500"
   viewBox="0 0 800 500"
   version="1.1"
   id="dev-hub-portal-svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   aria-labelledby="title-dev-hub"
>
  <title id="title-dev-hub">Developer Hub Portal Example</title>
  <desc id="desc-dev-hub">Example mockup of the Three Horizons Developer Hub portal interface</desc>
  
  <style>
    .bg-color { fill: #F5F5F5; }
    .header-bg { fill: #24292E; }
    .sidebar-bg { fill: #FFFFFF; }
    .content-bg { fill: #FFFFFF; }
    .card { fill: #FFFFFF; stroke: #E0E0E0; stroke-width: 1; }
    .card-highlight { fill: #FFFFFF; stroke: #4CAF50; stroke-width: 2; }
    .primary-color { fill: #0072C6; }
    .secondary-color { fill: #4CAF50; }
    .text-color { fill: #333333; }
    .text-light { fill: #666666; }
    .text-white { fill: #FFFFFF; }
    .text-title { font-family: Arial, sans-serif; font-weight: bold; }
    .text-body { font-family: Arial, sans-serif; }
    .text-small { font-family: Arial, sans-serif; font-size: 10px; }
  </style>
  
  <!-- Background -->
  <rect width="800" height="500" class="bg-color" />
  
  <!-- Header -->
  <rect width="800" height="60" class="header-bg" />
  <g id="header-content">
    <text x="20" y="38" font-size="24" class="text-title text-white">DEVELOPER HUB</text>
    <circle cx="750" cy="30" r="20" class="primary-color" />
    <text x="750" y="35" font-size="14" class="text-title text-white" text-anchor="middle">US</text>
    
    <!-- Search bar -->
    <rect x="300" y="15" width="300" height="30" rx="15" fill="#FFFFFF" opacity="0.2" />
    <text x="320" y="35" font-size="14" class="text-body text-white" opacity="0.6">Search...</text>
  </g>
  
  <!-- Left Sidebar -->
  <rect x="0" y="60" width="200" height="440" class="sidebar-bg" />
  <g id="sidebar-content">
    <rect x="10" y="80" width="180" height="40" rx="5" class="primary-color" />
    <text x="25" y="105" font-size="14" class="text-title text-white">Dashboard</text>
    
    <rect x="10" y="130" width="180" height="40" rx="5" fill="transparent" />
    <text x="25" y="155" font-size="14" class="text-title text-color">Catalog</text>
    
    <rect x="10" y="180" width="180" height="40" rx="5" fill="transparent" />
    <text x="25" y="205" font-size="14" class="text-title text-color">Templates</text>
    
    <rect x="10" y="230" width="180" height="40" rx="5" fill="transparent" />
    <text x="25" y="255" font-size="14" class="text-title text-color">Documentation</text>
    
    <rect x="10" y="280" width="180" height="40" rx="5" fill="transparent" />
    <text x="25" y="305" font-size="14" class="text-title text-color">Golden Paths</text>
    
    <rect x="10" y="440" width="180" height="40" rx="5" fill="transparent" />
    <text x="25" y="465" font-size="14" class="text-title text-color">Settings</text>
  </g>
  
  <!-- Main Content Area -->
  <rect x="200" y="60" width="600" height="440" class="content-bg" />
  <g id="main-content">
    <!-- Page Title -->
    <text x="230" y="100" font-size="24" class="text-title text-color">Welcome to Developer Hub</text>
    <text x="230" y="130" font-size="14" class="text-body text-light">Your go-to portal for all development resources</text>
    
    <!-- Statistics Row -->
    <g id="stats">
      <rect x="230" y="150" width="160" height="80" rx="5" class="card" />
      <text x="250" y="180" font-size="14" class="text-body text-light">Projects</text>
      <text x="250" y="210" font-size="24" class="text-title text-color">24</text>
      
      <rect x="410" y="150" width="160" height="80" rx="5" class="card" />
      <text x="430" y="180" font-size="14" class="text-body text-light">Services</text>
      <text x="430" y="210" font-size="24" class="text-title text-color">156</text>
      
      <rect x="590" y="150" width="180" height="80" rx="5" class="card" />
      <text x="610" y="180" font-size="14" class="text-body text-light">Deployments Today</text>
      <text x="610" y="210" font-size="24" class="text-title text-color">37</text>
    </g>
    
    <!-- Quick Access Cards -->
    <text x="230" y="260" font-size="18" class="text-title text-color">Quick Access</text>
    
    <g id="quick-access">
      <rect x="230" y="280" width="160" height="140" rx="5" class="card-highlight" />
      <rect x="250" y="300" width="120" height="70" rx="5" class="primary-color" />
      <text x="310" y="340" font-size="36" class="text-title text-white" text-anchor="middle">K8s</text>
      <text x="250" y="390" font-size="14" class="text-title text-color">Deploy App</text>
      <text x="250" y="410" font-size="12" class="text-body text-light">Start with AKS template</text>
      
      <rect x="410" y="280" width="160" height="140" rx="5" class="card" />
      <rect x="430" y="300" width="120" height="70" rx="5" class="secondary-color" />
      <text x="490" y="340" font-size="36" class="text-title text-white" text-anchor="middle">CI/CD</text>
      <text x="430" y="390" font-size="14" class="text-title text-color">Pipeline Setup</text>
      <text x="430" y="410" font-size="12" class="text-body text-light">GitHub Actions ready</text>
      
      <rect x="590" y="280" width="160" height="140" rx="5" class="card" />
      <rect x="610" y="300" width="120" height="70" rx="5" fill="#9C27B0" />
      <text x="670" y="340" font-size="36" class="text-title text-white" text-anchor="middle">Docs</text>
      <text x="610" y="390" font-size="14" class="text-title text-color">Documentation</text>
      <text x="610" y="410" font-size="12" class="text-body text-light">Platform guidelines</text>
    </g>
    
    <!-- Recent Activity -->
    <text x="230" y="450" font-size="18" class="text-title text-color">Recent Activity</text>
    
    <g id="activity">
      <rect x="230" y="460" width="540" height="20" rx="3" fill="transparent" />
      <circle cx="240" cy="470" r="5" class="primary-color" />
      <text x="255" y="475" font-size="12" class="text-body text-color">Service 'payment-api' deployed to production</text>
      <text x="700" y="475" font-size="10" class="text-small text-light" text-anchor="end">5m ago</text>
      
      <rect x="230" y="485" width="540" height="20" rx="3" fill="transparent" />
      <circle cx="240" cy="495" r="5" class="secondary-color" />
      <text x="255" y="500" font-size="12" class="text-body text-color">Pipeline 'frontend-ci' completed successfully</text>
      <text x="700" y="500" font-size="10" class="text-small text-light" text-anchor="end">15m ago</text>
    </g>
  </g>
</svg>