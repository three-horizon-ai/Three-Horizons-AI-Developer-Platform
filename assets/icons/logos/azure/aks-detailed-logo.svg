<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="300"
   height="200"
   viewBox="0 0 300 200"
   version="1.1"
   id="aks-detailed-logo-svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   aria-labelledby="title-aks-detailed"
>
  <title id="title-aks-detailed">Azure Kubernetes Service Detailed Logo</title>
  <desc id="desc-aks-detailed">Detailed Logo for Microsoft Azure Kubernetes Service (AKS)</desc>
  
  <style>
    .azure-blue { fill: #0072C6; }
    .kubernetes-blue { fill: #326CE5; }
    .text-dark { fill: #333333; font-family: Arial, sans-serif; }
  </style>
  
  <!-- Azure Cloud Background -->
  <path d="M50,40 C30,50 20,90 50,100 C80,110 100,150 50,160 L200,160 L200,40 Z" 
        fill="#E5F2F9" stroke="#0072C6" stroke-width="1" opacity="0.3"/>
  
  <!-- AKS Logo Container -->
  <g id="kubernetes-logo" transform="translate(100,80)">
    <!-- Kubernetes Wheel -->
    <circle cx="0" cy="0" r="45" fill="white" stroke="#326CE5" stroke-width="2"/>
    
    <!-- Kubernetes Spokes -->
    <g id="spokes" stroke="#326CE5" stroke-width="2.5">
      <line x1="0" y1="-30" x2="0" y2="-15" />
      <line x1="0" y1="15" x2="0" y2="30" />
      <line x1="-30" y1="0" x2="-15" y2="0" />
      <line x1="15" y1="0" x2="30" y2="0" />
      
      <line x1="-21.2" y1="-21.2" x2="-10.6" y2="-10.6" />
      <line x1="10.6" y1="10.6" x2="21.2" y2="21.2" />
      <line x1="-21.2" y1="21.2" x2="-10.6" y2="10.6" />
      <line x1="10.6" y1="-10.6" x2="21.2" y2="-21.2" />
    </g>
    
    <!-- Kubernetes Center -->
    <circle cx="0" cy="0" r="15" class="kubernetes-blue" />
    <path d="M-6,-10 L0,10 L6,-10 Z" fill="white" transform="rotate(15)" />
  </g>
  
  <!-- Microsoft Azure Text -->
  <text x="150" y="170" text-anchor="middle" font-size="14" font-weight="bold" class="text-dark">
    Azure Kubernetes Service
  </text>
  
  <!-- Azure Logo -->
  <g id="azure-logo" transform="translate(230,75) scale(0.5)">
    <path d="M0,20 L40,0 L40,40 Z" class="azure-blue" />
    <path d="M45,40 L60,0 L100,40 Z" class="azure-blue" />
  </g>
  
  <!-- Three Horizons Integration Tag -->
  <rect x="70" y="25" width="160" height="25" rx="12.5" fill="#0072C6" opacity="0.8" />
  <text x="150" y="42" text-anchor="middle" font-size="12" fill="white" font-family="Arial, sans-serif">
    Three Horizons Integration
  </text>
</svg>