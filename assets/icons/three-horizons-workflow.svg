<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="800"
   height="400"
   viewBox="0 0 800 400"
   version="1.1"
   id="three-horizons-workflow-svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   aria-labelledby="title-workflow"
>
  <title id="title-workflow">Three Horizons Platform Workflow</title>
  <desc id="desc-workflow">Workflow diagram showing the Three Horizons Platform process flow</desc>
  
  <style>
    .background { fill: #F8F9FA; }
    .azure-blue { fill: #0072C6; }
    .azure-light { fill: #E5F2F9; stroke: #0072C6; }
    .github-dark { fill: #24292E; }
    .github-light { fill: #F0F2F5; stroke: #24292E; }
    .redhat-red { fill: #EE0000; }
    .redhat-light { fill: #FCE9E9; stroke: #EE0000; }
    .text-dark { fill: #333333; font-family: Arial, sans-serif; font-size: 14px; }
    .title-text { fill: #333333; font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; }
    .label-text { fill: #FFFFFF; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
    .step-number { fill: #FFFFFF; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    .connector { stroke: #666666; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); }
    .dashed-connector { stroke: #666666; stroke-width: 2px; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
  </style>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" class="background" />
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Three Horizons Platform Development Workflow</text>
  
  <!-- Workflow Steps -->
  
  <!-- Step 1: Developer Setup -->
  <g id="step-1">
    <circle cx="80" cy="100" r="20" class="github-dark" />
    <text x="80" y="105" text-anchor="middle" class="step-number">1</text>
    <rect x="110" y="80" width="160" height="40" rx="5" class="github-light" />
    <text x="190" y="105" text-anchor="middle" class="text-dark">Developer Setup</text>
  </g>
  
  <!-- Step 2: Golden Path Selection -->
  <g id="step-2">
    <circle cx="80" cy="170" r="20" class="redhat-red" />
    <text x="80" y="175" text-anchor="middle" class="step-number">2</text>
    <rect x="110" y="150" width="160" height="40" rx="5" class="redhat-light" />
    <text x="190" y="175" text-anchor="middle" class="text-dark">Golden Path Selection</text>
  </g>
  
  <!-- Step 3: Code Development -->
  <g id="step-3">
    <circle cx="80" cy="240" r="20" class="github-dark" />
    <text x="80" y="245" text-anchor="middle" class="step-number">3</text>
    <rect x="110" y="220" width="160" height="40" rx="5" class="github-light" />
    <text x="190" y="245" text-anchor="middle" class="text-dark">Code Development</text>
  </g>
  
  <!-- Step 4: CI/CD Pipeline -->
  <g id="step-4">
    <circle cx="320" cy="100" r="20" class="github-dark" />
    <text x="320" y="105" text-anchor="middle" class="step-number">4</text>
    <rect x="350" y="80" width="160" height="40" rx="5" class="github-light" />
    <text x="430" y="105" text-anchor="middle" class="text-dark">CI/CD Pipeline</text>
  </g>
  
  <!-- Step 5: Deployment -->
  <g id="step-5">
    <circle cx="320" cy="170" r="20" class="azure-blue" />
    <text x="320" y="175" text-anchor="middle" class="step-number">5</text>
    <rect x="350" y="150" width="160" height="40" rx="5" class="azure-light" />
    <text x="430" y="175" text-anchor="middle" class="text-dark">Deployment</text>
  </g>
  
  <!-- Step 6: Monitoring -->
  <g id="step-6">
    <circle cx="320" cy="240" r="20" class="azure-blue" />
    <text x="320" y="245" text-anchor="middle" class="step-number">6</text>
    <rect x="350" y="220" width="160" height="40" rx="5" class="azure-light" />
    <text x="430" y="245" text-anchor="middle" class="text-dark">Monitoring & Analytics</text>
  </g>
  
  <!-- Step 7: Feedback -->
  <g id="step-7">
    <circle cx="560" cy="170" r="20" class="redhat-red" />
    <text x="560" y="175" text-anchor="middle" class="step-number">7</text>
    <rect x="590" y="150" width="160" height="40" rx="5" class="redhat-light" />
    <text x="670" y="175" text-anchor="middle" class="text-dark">Feedback & Iteration</text>
  </g>
  
  <!-- Connectors -->
  <path d="M80,120 L80,150" class="connector" />
  <path d="M80,190 L80,220" class="connector" />
  <path d="M270,100 L300,100" class="connector" />
  <path d="M270,170 L300,170" class="connector" />
  <path d="M270,240 L300,240" class="connector" />
  <path d="M510,100 L560,100 L560,150" class="connector" />
  <path d="M510,170 L590,170" class="connector" />
  <path d="M510,240 L560,240 L560,190" class="connector" />
  <path d="M670,190 L670,320 L80,320 L80,260" class="dashed-connector" />
  
  <!-- Platform Elements -->
  <g id="platform-elements">
    <rect x="100" y="310" width="600" height="60" rx="5" fill="#F0F0F0" stroke="#CCCCCC" />
    
    <rect x="120" y="320" width="160" height="40" rx="5" class="github-dark" />
    <text x="200" y="345" text-anchor="middle" class="label-text">GitHub Enterprise</text>
    
    <rect x="320" y="320" width="160" height="40" rx="5" class="azure-blue" />
    <text x="400" y="345" text-anchor="middle" class="label-text">Microsoft Azure</text>
    
    <rect x="520" y="320" width="160" height="40" rx="5" class="redhat-red" />
    <text x="600" y="345" text-anchor="middle" class="label-text">Red Hat Developer Hub</text>
  </g>
</svg>