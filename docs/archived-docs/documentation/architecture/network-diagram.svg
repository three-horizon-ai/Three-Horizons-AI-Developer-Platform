<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Network Architecture</text>
    
    <!-- Azure Cloud Border -->
    <rect x="50" y="70" width="1100" height="680" stroke="#0078d4" stroke-width="3" fill="#f0f5ff" rx="10" ry="10" opacity="0.2"/>
    <text x="600" y="90" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Subscription</text>
    
    <!-- Internet -->
    <rect x="50" y="110" width="1100" height="50" fill="#e6e6e6" rx="5" ry="5"/>
    <text x="600" y="142" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Internet</text>
    
    <!-- Azure Front Door / Application Gateway -->
    <rect x="300" y="180" width="600" height="50" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="212" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Front Door / Application Gateway + WAF</text>
    
    <!-- Main VNET Container -->
    <rect x="100" y="250" width="1000" height="480" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="600" y="275" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0078d4">Virtual Network (10.0.0.0/16)</text>
    
    <!-- Azure Firewall -->
    <rect x="500" y="290" width="200" height="50" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="322" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Firewall</text>
    
    <!-- DMZ Subnet -->
    <rect x="180" y="360" width="200" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="280" y="385" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0078d4">DMZ Subnet</text>
    <text x="280" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">10.0.0.0/24</text>
    
    <!-- Bastion Subnet -->
    <rect x="820" y="360" width="200" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="920" y="385" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Bastion Subnet</text>
    <text x="920" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">10.0.1.0/24</text>
    
    <!-- ARO Subnets -->
    <rect x="150" y="440" width="400" height="270" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="5" ry="5"/>
    <text x="350" y="465" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#cc0000">ARO Cluster</text>
    
    <rect x="180" y="480" width="160" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="260" y="505" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#cc0000">Master Subnet</text>
    <text x="260" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">10.0.2.0/24</text>
    
    <rect x="360" y="480" width="160" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="440" y="505" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#cc0000">Worker Subnet</text>
    <text x="440" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">10.0.3.0/24</text>
    
    <!-- ARO Internal Components -->
    <rect x="180" y="560" width="160" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="260" y="585" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Master Nodes</text>
    
    <rect x="180" y="610" width="160" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="260" y="635" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Private API Server</text>
    
    <rect x="360" y="560" width="160" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="440" y="585" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Worker Nodes</text>
    
    <rect x="360" y="610" width="160" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="440" y="635" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Red Hat Developer Hub</text>
    
    <!-- AKS Subnets -->
    <rect x="650" y="440" width="400" height="270" stroke="#0066cc" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="850" y="465" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0066cc">AKS Cluster</text>
    
    <rect x="680" y="480" width="160" height="60" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="760" y="505" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0066cc">System Node Pool Subnet</text>
    <text x="760" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">10.0.4.0/24</text>
    
    <rect x="860" y="480" width="160" height="60" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="940" y="505" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0066cc">User Node Pool Subnet</text>
    <text x="940" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">10.0.5.0/24</text>
    
    <!-- AKS Internal Components -->
    <rect x="680" y="560" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="760" y="585" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">System Nodes</text>
    
    <rect x="680" y="610" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="760" y="635" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Private API Server</text>
    
    <rect x="860" y="560" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="940" y="585" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">User Nodes</text>
    
    <rect x="860" y="610" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="940" y="635" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Red Hat Developer Hub</text>
    
    <!-- Private Link Services -->
    <rect x="130" y="360" width="40" height="60" stroke="#333" stroke-width="1" fill="#ccc" rx="5" ry="5"/>
    <text x="150" y="395" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90,150,395)">Private Link</text>
    
    <rect x="1030" y="360" width="40" height="60" stroke="#333" stroke-width="1" fill="#ccc" rx="5" ry="5"/>
    <text x="1050" y="395" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90,1050,395)">Private Link</text>
    
    <!-- Azure Internal Services -->
    <rect x="120" y="730" width="960" height="70" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="600" y="755" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0078d4">Private Endpoints for Azure Services</text>
    
    <rect x="140" y="765" width="140" height="30" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="210" y="785" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Key Vault</text>
    
    <rect x="290" y="765" width="140" height="30" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="360" y="785" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Container Registry</text>
    
    <rect x="440" y="765" width="140" height="30" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="510" y="785" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Storage Account</text>
    
    <rect x="590" y="765" width="140" height="30" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="660" y="785" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Database</text>
    
    <rect x="740" y="765" width="140" height="30" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="810" y="785" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Monitor/Log Analytics</text>
    
    <rect x="890" y="765" width="170" height="30" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="975" y="785" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Azure Backup/Recovery</text>
    
    <!-- Connection Lines -->
    <!-- Internet to Front Door -->
    <line x1="600" y1="160" x2="600" y2="180" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    
    <!-- Front Door to Firewall -->
    <line x1="600" y1="230" x2="600" y2="290" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    
    <!-- Firewall to Subnets -->
    <line x1="600" y1="340" x2="600" y2="365" stroke="#666" stroke-width="1" fill="none"/>
    <line x1="600" y1="365" x2="380" y2="365" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <line x1="600" y1="365" x2="820" y2="365" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Firewall to Clusters -->
    <line x1="600" y1="340" x2="600" y2="465" stroke="#666" stroke-width="1" fill="none"/>
    <line x1="600" y1="465" x2="550" y2="465" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <line x1="600" y1="465" x2="650" y2="465" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Clusters to Private Endpoints -->
    <line x1="350" y1="710" x2="350" y2="765" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <line x1="850" y1="710" x2="850" y2="765" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Legend -->
    <rect x="1090" y="160" width="15" height="15" fill="#0078d4"/>
    <text x="1110" y="173" font-family="Arial" font-size="10" text-anchor="start" fill="#333">Azure Network</text>
    
    <rect x="1090" y="185" width="15" height="15" fill="#cc0000"/>
    <text x="1110" y="198" font-family="Arial" font-size="10" text-anchor="start" fill="#333">ARO Components</text>
    
    <rect x="1090" y="210" width="15" height="15" fill="#0066cc"/>
    <text x="1110" y="223" font-family="Arial" font-size="10" text-anchor="start" fill="#333">AKS Components</text>
    
    <rect x="1090" y="235" width="15" height="15" fill="#e6e6e6"/>
    <text x="1110" y="248" font-family="Arial" font-size="10" text-anchor="start" fill="#333">External Networks</text>
    
    <line x1="1090" y1="260" x2="1105" y2="260" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="1110" y="263" font-family="Arial" font-size="10" text-anchor="start" fill="#333">Traffic Flow</text>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Additional Labels -->
    <text x="1060" y="730" font-family="Arial" font-size="14" font-weight="bold" text-anchor="end" fill="#333">Private Network Zone</text>
    <text x="1060" y="250" font-family="Arial" font-size="14" font-weight="bold" text-anchor="end" fill="#333">Public-Facing Zone</text>
</svg> 