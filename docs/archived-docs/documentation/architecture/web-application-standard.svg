<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill: #0366d6; }
    .subtitle { font: italic 18px sans-serif; fill: #24292e; }
    .label { font: bold 14px sans-serif; fill: #24292e; }
    .description { font: 12px sans-serif; fill: #586069; }
    .horizon1 { fill: #2188ff; }
    .horizon2 { fill: #f9c513; }
    .horizon3 { fill: #6f42c1; }
    .section-title { font: bold 16px sans-serif; fill: #24292e; }
    .component { fill: white; stroke: #0366d6; stroke-width: 2px; rx: 5px; ry: 5px; }
    .cloud { fill: #f1f8ff; stroke: #0366d6; stroke-width: 2px; rx: 20px; ry: 20px; }
    .container { fill: #e1e4e8; stroke: #24292e; stroke-width: 1px; rx: 5px; ry: 5px; }
    .arrow { fill: none; stroke: #586069; stroke-width: 1.5px; marker-end: url(#arrowhead); }
    .dashed { stroke-dasharray: 5,5; }
    .user { fill: #ffdf5d; stroke: #24292e; stroke-width: 1px; rx: 15px; ry: 15px; }
    .database { fill: #dbedff; stroke: #0366d6; stroke-width: 1.5px; rx: 3px; ry: 3px; }
    .gateway { fill: #e6f6e6; stroke: #24292e; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .security { fill: #ffe2e2; stroke: #cb2431; stroke-width: 1.5px; rx: 5px; ry: 5px; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#586069"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle">Three Horizons Standard Web Application Architecture</text>
  <text x="500" y="70" class="subtitle" text-anchor="middle">Secure, Scalable Web Application Pattern</text>
  
  <!-- Cloud Container -->
  <rect x="100" y="100" width="800" height="550" class="cloud"/>
  <text x="140" y="125" class="label">Azure Cloud Environment</text>
  
  <!-- User -->
  <rect x="30" y="300" width="90" height="40" class="user"/>
  <text x="75" y="325" class="label" text-anchor="middle">Users</text>
  
  <!-- Frontend Zone -->
  <rect x="170" y="150" width="220" height="190" class="container"/>
  <text x="280" y="170" class="section-title" text-anchor="middle">Frontend Tier</text>
  
  <!-- Frontend Components -->
  <rect x="190" y="190" width="180" height="40" class="component"/>
  <text x="280" y="215" class="label" text-anchor="middle">Application Gateway</text>
  
  <rect x="190" y="250" width="180" height="40" class="component"/>
  <text x="280" y="275" class="label" text-anchor="middle">CDN Endpoint</text>
  
  <rect x="190" y="310" width="180" height="40" class="component"/>
  <text x="280" y="335" class="label" text-anchor="middle">Web App Service (Frontend)</text>
  
  <!-- API/Middleware Zone -->
  <rect x="430" y="150" width="220" height="190" class="container"/>
  <text x="540" y="170" class="section-title" text-anchor="middle">API Tier</text>
  
  <!-- API Components -->
  <rect x="450" y="190" width="180" height="40" class="component"/>
  <text x="540" y="215" class="label" text-anchor="middle">API Management</text>
  
  <rect x="450" y="250" width="180" height="40" class="component"/>
  <text x="540" y="275" class="label" text-anchor="middle">Web App Service (API)</text>
  
  <rect x="450" y="310" width="180" height="40" class="component"/>
  <text x="540" y="335" class="label" text-anchor="middle">Service Bus</text>
  
  <!-- Data Zone -->
  <rect x="690" y="150" width="180" height="190" class="container"/>
  <text x="780" y="170" class="section-title" text-anchor="middle">Data Tier</text>
  
  <!-- Data Components -->
  <rect x="710" y="190" width="140" height="40" class="database"/>
  <text x="780" y="215" class="label" text-anchor="middle">SQL Database</text>
  
  <rect x="710" y="250" width="140" height="40" class="database"/>
  <text x="780" y="275" class="label" text-anchor="middle">Blob Storage</text>
  
  <rect x="710" y="310" width="140" height="40" class="database"/>
  <text x="780" y="335" class="label" text-anchor="middle">Redis Cache</text>
  
  <!-- DevOps -->
  <rect x="170" y="380" width="700" height="90" class="container"/>
  <text x="520" y="400" class="section-title" text-anchor="middle">DevOps & Monitoring</text>
  
  <!-- DevOps Components -->
  <rect x="190" y="420" width="150" height="40" class="component"/>
  <text x="265" y="445" class="label" text-anchor="middle">GitHub Actions</text>
  
  <rect x="360" y="420" width="150" height="40" class="component"/>
  <text x="435" y="445" class="label" text-anchor="middle">App Insights</text>
  
  <rect x="530" y="420" width="150" height="40" class="component"/>
  <text x="605" y="445" class="label" text-anchor="middle">Log Analytics</text>
  
  <rect x="700" y="420" width="150" height="40" class="component"/>
  <text x="775" y="445" class="label" text-anchor="middle">Azure Monitor</text>
  
  <!-- Security -->
  <rect x="170" y="510" width="700" height="90" class="container"/>
  <text x="520" y="530" class="section-title" text-anchor="middle">Security & Identity</text>
  
  <!-- Security Components -->
  <rect x="190" y="550" width="150" height="40" class="security"/>
  <text x="265" y="575" class="label" text-anchor="middle">Azure AD</text>
  
  <rect x="360" y="550" width="150" height="40" class="security"/>
  <text x="435" y="575" class="label" text-anchor="middle">Key Vault</text>
  
  <rect x="530" y="550" width="150" height="40" class="security"/>
  <text x="605" y="575" class="label" text-anchor="middle">Security Center</text>
  
  <rect x="700" y="550" width="150" height="40" class="security"/>
  <text x="775" y="575" class="label" text-anchor="middle">Private Link</text>
  
  <!-- Connecting arrows -->
  <!-- User to Frontend -->
  <path d="M 120 320 L 170 320" class="arrow" />
  
  <!-- Frontend Flow -->
  <path d="M 280 230 L 280 250" class="arrow" />
  <path d="M 280 290 L 280 310" class="arrow" />
  
  <!-- Frontend to API -->
  <path d="M 370 320 L 450 320" class="arrow" />
  <path d="M 370 215 L 430 215" class="arrow" />
  
  <!-- API Flow -->
  <path d="M 540 230 L 540 250" class="arrow" />
  <path d="M 540 290 L 540 310" class="arrow" />
  
  <!-- API to Data -->
  <path d="M 630 215 L 710 215" class="arrow" />
  <path d="M 630 275 L 710 275" class="arrow" />
  <path d="M 630 320 L 710 320" class="arrow" />
  
  <!-- Vertical connections to DevOps -->
  <path d="M 280 350 L 280 420" class="arrow dashed" />
  <path d="M 540 350 L 540 420" class="arrow dashed" />
  <path d="M 780 350 L 780 420" class="arrow dashed" />
  
  <!-- Vertical connections to Security -->
  <path d="M 265 460 L 265 550" class="arrow dashed" />
  <path d="M 435 460 L 435 550" class="arrow dashed" />
  <path d="M 605 460 L 605 550" class="arrow dashed" />
  <path d="M 775 460 L 775 550" class="arrow dashed" />

  <!-- Horizon Levels -->
  <rect x="880" y="170" width="20" height="50" class="horizon1" rx="5" ry="5" opacity="0.8"/>
  <text x="925" y="203" class="label" text-anchor="start">Horizon 1: Foundation</text>
  
  <rect x="880" y="250" width="20" height="50" class="horizon2" rx="5" ry="5" opacity="0.8"/>
  <text x="925" y="283" class="label" text-anchor="start">Horizon 2: Enhancement</text>
  
  <rect x="880" y="330" width="20" height="50" class="horizon3" rx="5" ry="5" opacity="0.8"/>
  <text x="925" y="363" class="label" text-anchor="start">Horizon 3: Innovation</text>
</svg>