<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="50" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Workflow Integration</text>
    
    <!-- GitHub Enterprise Cloud Section -->
    <rect x="100" y="100" width="300" height="600" stroke="#333333" stroke-width="3" fill="#f5f5f5" rx="10" ry="10"/>
    <text x="250" y="130" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">GitHub Enterprise</text>
    
    <!-- GitHub Components -->
    <rect x="130" y="160" width="240" height="70" stroke="#333333" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Source Repositories</text>
    
    <rect x="130" y="250" width="240" height="70" stroke="#333333" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="285" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Actions</text>
    
    <rect x="130" y="340" width="240" height="70" stroke="#333333" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="375" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Copilot</text>
    
    <rect x="130" y="430" width="240" height="70" stroke="#333333" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="465" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Codespaces</text>
    
    <rect x="130" y="520" width="240" height="70" stroke="#333333" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="555" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Pull Requests & Reviews</text>
    
    <rect x="130" y="610" width="240" height="70" stroke="#333333" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="645" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Advanced Security</text>
    
    <!-- Red Hat Developer Hub Section -->
    <rect x="450" y="100" width="300" height="600" stroke="#cc0000" stroke-width="3" fill="#fff5f5" rx="10" ry="10"/>
    <text x="600" y="130" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#cc0000">Red Hat Developer Hub</text>
    
    <!-- Developer Hub Components -->
    <rect x="480" y="160" width="240" height="70" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Developer Portal</text>
    
    <rect x="480" y="250" width="240" height="70" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="285" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Software Catalog</text>
    
    <rect x="480" y="340" width="240" height="70" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="375" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Software Templates</text>
    
    <rect x="480" y="430" width="240" height="70" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="465" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">OpenShift GitOps (ArgoCD)</text>
    
    <rect x="480" y="520" width="240" height="70" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="555" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">API Documentation</text>
    
    <rect x="480" y="610" width="240" height="70" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="645" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Tech Docs</text>
    
    <!-- Microsoft Azure Section -->
    <rect x="800" y="100" width="300" height="600" stroke="#0078d4" stroke-width="3" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="950" y="130" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Azure</text>
    
    <!-- Azure Components -->
    <rect x="830" y="160" width="240" height="70" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Red Hat OpenShift</text>
    
    <rect x="830" y="250" width="240" height="70" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="285" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Kubernetes Service</text>
    
    <rect x="830" y="340" width="240" height="70" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="375" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Monitor</text>
    
    <rect x="830" y="430" width="240" height="70" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="465" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Key Vault</text>
    
    <rect x="830" y="520" width="240" height="70" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="555" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Database</text>
    
    <rect x="830" y="610" width="240" height="70" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="645" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Storage</text>
    
    <!-- Integration Arrows -->
    <!-- GitHub to Developer Hub -->
    <!-- Source Repos to Software Catalog -->
    <path d="M 370 195 L 480 285" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <!-- GitHub Actions to GitOps -->
    <path d="M 370 285 L 480 465" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <!-- Codespaces to Software Templates -->
    <path d="M 370 465 L 480 375" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Developer Hub to Azure -->
    <!-- Software Templates to ARO/AKS -->
    <path d="M 720 375 L 830 195" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 720 375 L 830 285" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <!-- GitOps to ARO/AKS -->
    <path d="M 720 465 L 830 195" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 720 465 L 830 285" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Azure to GitHub -->
    <!-- Monitor to Actions -->
    <path d="M 830 375 C 600 375 600 285 370 285" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <!-- Key Vault to GitHub Security -->
    <path d="M 830 465 C 600 500 600 645 370 645" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Workflow Flows -->
    <rect x="100" y="730" width="1000" height="50" stroke="#333333" stroke-width="1" fill="#ffffcc" rx="5" ry="5"/>
    <text x="600" y="760" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
        Developer → GitHub Codespaces → Dev Hub Template → Application in ARO/AKS → GitOps → Monitoring → Continuous Improvement
    </text>
    
    <!-- Legend -->
    <rect x="150" y="40" width="15" height="15" fill="#333333"/>
    <text x="175" y="53" font-family="Arial" font-size="12" text-anchor="start" fill="#333">GitHub Components</text>
    
    <rect x="350" y="40" width="15" height="15" fill="#cc0000"/>
    <text x="375" y="53" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Developer Hub Components</text>
    
    <rect x="600" y="40" width="15" height="15" fill="#0078d4"/>
    <text x="625" y="53" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Azure Components</text>
</svg> 