<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="50" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Platform Architecture</text>
    
    <!-- Azure Cloud Section -->
    <rect x="100" y="100" width="1000" height="300" stroke="#0078d4" stroke-width="3" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="600" y="130" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Azure Cloud</text>
    
    <!-- Azure Services -->
    <rect x="150" y="160" width="180" height="80" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="240" y="210" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Resource Manager</text>
    
    <rect x="360" y="160" width="180" height="80" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="450" y="210" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Active Directory</text>
    
    <rect x="570" y="160" width="180" height="80" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="660" y="210" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Monitor</text>
    
    <rect x="780" y="160" width="180" height="80" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="870" y="210" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Key Vault</text>
    
    <rect x="150" y="270" width="180" height="80" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="240" y="320" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Storage</text>
    
    <rect x="360" y="270" width="180" height="80" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="450" y="320" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Database</text>
    
    <rect x="570" y="270" width="180" height="80" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="660" y="320" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Networking</text>
    
    <rect x="780" y="270" width="180" height="80" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="870" y="320" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Policy</text>
    
    <!-- ARO/AKS Container Platform -->
    <rect x="150" y="450" width="500" height="300" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="10" ry="10"/>
    <text x="400" y="480" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#cc0000">Azure Red Hat OpenShift (ARO)</text>
    
    <rect x="700" y="450" width="350" height="300" stroke="#0066cc" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="875" y="480" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0066cc">Azure Kubernetes Service (AKS)</text>
    
    <!-- ARO Components -->
    <rect x="180" y="520" width="120" height="60" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="240" y="555" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift API</text>
    
    <rect x="320" y="520" width="120" height="60" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="380" y="555" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift Console</text>
    
    <rect x="460" y="520" width="120" height="60" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="520" y="555" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift Operators</text>
    
    <rect x="180" y="600" width="120" height="60" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="240" y="635" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Developer Hub</text>
    
    <rect x="320" y="600" width="120" height="60" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="380" y="635" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift GitOps</text>
    
    <rect x="460" y="600" width="120" height="60" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="520" y="635" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Service Mesh</text>
    
    <rect x="250" y="680" width="250" height="50" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="375" y="710" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Application Workloads</text>
    
    <!-- AKS Components -->
    <rect x="730" y="520" width="120" height="60" stroke="#0066cc" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="790" y="555" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Kubernetes API</text>
    
    <rect x="870" y="520" width="120" height="60" stroke="#0066cc" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="930" y="555" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">AKS Dashboard</text>
    
    <rect x="730" y="600" width="120" height="60" stroke="#0066cc" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="790" y="635" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Developer Hub</text>
    
    <rect x="870" y="600" width="120" height="60" stroke="#0066cc" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="930" y="635" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Flux GitOps</text>
    
    <rect x="780" y="680" width="180" height="50" stroke="#0066cc" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="870" y="710" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Application Workloads</text>
    
    <!-- Connection Lines -->
    <!-- Azure to ARO -->
    <line x1="400" y1="400" x2="400" y2="450" stroke="#666666" stroke-width="3" stroke-dasharray="5,5"/>
    <!-- Azure to AKS -->
    <line x1="800" y1="400" x2="800" y2="450" stroke="#666666" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- GitHub Enterprise Integration (floating) -->
    <rect x="500" y="380" width="200" height="50" stroke="#333333" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="410" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Enterprise</text>
    
    <!-- Lines from GitHub to ARO and AKS -->
    <line x1="500" y1="405" x2="400" y2="500" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="700" y1="405" x2="800" y2="500" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Legend -->
    <rect x="980" y="350" width="20" height="20" fill="#0078d4"/>
    <text x="1010" y="365" font-family="Arial" font-size="14" text-anchor="start" fill="#333">Azure Services</text>
    
    <rect x="980" y="380" width="20" height="20" fill="#cc0000"/>
    <text x="1010" y="395" font-family="Arial" font-size="14" text-anchor="start" fill="#333">ARO Components</text>
    
    <rect x="980" y="410" width="20" height="20" fill="#0066cc"/>
    <text x="1010" y="425" font-family="Arial" font-size="14" text-anchor="start" fill="#333">AKS Components</text>
</svg> 