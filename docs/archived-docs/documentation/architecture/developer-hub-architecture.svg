<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Red Hat Developer Hub Architecture</text>
    <text x="600" y="70" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">Three Horizons Implementation</text>
    
    <!-- OpenShift Container -->
    <rect x="50" y="100" width="1100" height="650" stroke="#cc0000" stroke-width="3" fill="#fff5f5" rx="10" ry="10"/>
    <text x="600" y="130" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#cc0000">Azure Red Hat OpenShift (ARO)</text>
    
    <!-- Core Developer Hub -->
    <rect x="250" y="160" width="700" height="300" stroke="#0066cc" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="600" y="185" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#0066cc">Red Hat Developer Hub</text>
    
    <!-- Core Components -->
    <!-- Backstage Frontend -->
    <rect x="275" y="200" width="250" height="80" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="400" y="235" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Backstage Frontend</text>
    <text x="400" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">UI and user experience</text>
    
    <!-- Backstage Backend -->
    <rect x="275" y="290" width="250" height="150" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="400" y="315" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Backstage Backend</text>
    
    <rect x="290" y="330" width="220" height="35" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="400" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Catalog Service</text>
    
    <rect x="290" y="375" width="220" height="35" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="400" y="395" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Scaffolder Service</text>
    
    <!-- Core Plugins -->
    <rect x="545" y="200" width="380" height="240" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="735" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Core Plugins</text>
    
    <!-- Plugin Grid - Row 1 -->
    <rect x="560" y="240" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="640" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Software Catalog</text>
    
    <rect x="750" y="240" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="830" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Software Templates</text>
    
    <!-- Plugin Grid - Row 2 -->
    <rect x="560" y="290" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="640" y="315" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">TechDocs</text>
    
    <rect x="750" y="290" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="830" y="315" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Search</text>
    
    <!-- Plugin Grid - Row 3 -->
    <rect x="560" y="340" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="640" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">API Explorer</text>
    
    <rect x="750" y="340" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="830" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Authentication</text>
    
    <!-- Plugin Grid - Row 4 -->
    <rect x="560" y="390" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="640" y="415" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Permissions</text>
    
    <rect x="750" y="390" width="160" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="830" y="415" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Kubernetes</text>
    
    <!-- Infrastructure Layer -->
    <rect x="80" y="480" width="500" height="250" stroke="#333333" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="330" y="505" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Infrastructure Layer</text>
    
    <!-- Database -->
    <rect x="100" y="520" width="225" height="90" stroke="#0078d4" stroke-width="1" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="212" y="545" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Database for PostgreSQL</text>
    <text x="212" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Persistent storage for Developer Hub</text>
    <text x="212" y="585" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Flexible Server</text>
    
    <!-- OpenShift Resources -->
    <rect x="350" y="520" width="210" height="90" stroke="#cc0000" stroke-width="1" fill="#fff5f5" rx="5" ry="5"/>
    <text x="455" y="545" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift Resources</text>
    <text x="455" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Deployments, Services, Routes</text>
    <text x="455" y="585" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">ConfigMaps, Secrets</text>
    
    <!-- Storage -->
    <rect x="100" y="620" width="225" height="90" stroke="#0078d4" stroke-width="1" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="212" y="645" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Storage</text>
    <text x="212" y="665" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Blob storage for artifacts</text>
    <text x="212" y="685" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">File storage for TechDocs</text>
    
    <!-- OpenShift Operator -->
    <rect x="350" y="620" width="210" height="90" stroke="#cc0000" stroke-width="1" fill="#fff5f5" rx="5" ry="5"/>
    <text x="455" y="645" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Developer Hub Operator</text>
    <text x="455" y="665" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Installation and lifecycle</text>
    <text x="455" y="685" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">management</text>
    
    <!-- Integration Layer -->
    <rect x="620" y="480" width="500" height="250" stroke="#333333" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="870" y="505" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Integration Layer</text>
    
    <!-- GitHub -->
    <rect x="640" y="520" width="225" height="90" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
    <text x="752" y="545" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GitHub Enterprise Integration</text>
    <text x="752" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Authentication, Repositories</text>
    <text x="752" y="585" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Actions, CI/CD</text>
    
    <!-- Azure -->
    <rect x="875" y="520" width="225" height="90" stroke="#0078d4" stroke-width="1" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="987" y="545" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Service Integration</text>
    <text x="987" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Key Vault, Container Registry</text>
    <text x="987" y="585" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Monitor, Log Analytics</text>
    
    <!-- OpenShift -->
    <rect x="640" y="620" width="225" height="90" stroke="#cc0000" stroke-width="1" fill="#fff5f5" rx="5" ry="5"/>
    <text x="752" y="645" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift Integration</text>
    <text x="752" y="665" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">GitOps (ArgoCD)</text>
    <text x="752" y="685" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Service Mesh, Monitoring</text>
    
    <!-- Custom Plugins -->
    <rect x="875" y="620" width="225" height="90" stroke="#0066cc" stroke-width="1" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="987" y="645" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Custom Three Horizons Plugins</text>
    <text x="987" y="665" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Organization-specific templates</text>
    <text x="987" y="685" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Deployment dashboards</text>
    
    <!-- Connection Lines -->
    <!-- Frontend to Backend -->
    <line x1="400" y1="280" x2="400" y2="290" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Backend to Database -->
    <line x1="400" y1="440" x2="212" y2="520" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Backend to OpenShift Resources -->
    <line x1="400" y1="440" x2="455" y2="520" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Plugins to GitHub -->
    <line x1="735" y1="440" x2="752" y2="520" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Plugins to Azure -->
    <line x1="735" y1="440" x2="987" y2="520" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Backend to Storage -->
    <path d="M 400 440 C 350 470 300 550 212 620" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Operator to Resources -->
    <line x1="455" y1="620" x2="455" y2="610" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Custom Plugins to Core -->
    <path d="M 987 620 C 900 550 850 350 800 440" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="80" y="160" width="15" height="15" fill="#0066cc"/>
    <text x="100" y="173" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Developer Hub Components</text>
    
    <rect x="80" y="185" width="15" height="15" fill="#cc0000"/>
    <text x="100" y="198" font-family="Arial" font-size="12" text-anchor="start" fill="#333">OpenShift Components</text>
    
    <rect x="80" y="210" width="15" height="15" fill="#0078d4"/>
    <text x="100" y="223" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Azure Services</text>
    
    <rect x="80" y="235" width="15" height="15" fill="#333333"/>
    <text x="100" y="248" font-family="Arial" font-size="12" text-anchor="start" fill="#333">GitHub Components</text>
</svg> 