<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="750" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill: #0366d6; }
    .subtitle { font: italic 18px sans-serif; fill: #24292e; }
    .label { font: bold 14px sans-serif; fill: #24292e; }
    .small-label { font: bold 12px sans-serif; fill: #24292e; }
    .description { font: 12px sans-serif; fill: #586069; }
    .horizon1 { fill: #2188ff; }
    .horizon2 { fill: #f9c513; }
    .horizon3 { fill: #6f42c1; }
    .section-title { font: bold 16px sans-serif; fill: #24292e; }
    .component { fill: white; stroke: #0366d6; stroke-width: 2px; rx: 5px; ry: 5px; }
    .micro { fill: #f1f8ff; stroke: #0366d6; stroke-width: 1.5px; rx: 3px; ry: 3px; }
    .cloud { fill: #f1f8ff; stroke: #0366d6; stroke-width: 2px; rx: 20px; ry: 20px; }
    .container { fill: #e1e4e8; stroke: #24292e; stroke-width: 1px; rx: 5px; ry: 5px; }
    .k8s { fill: #d1fff3; stroke: #24292e; stroke-width: 1.5px; rx: 10px; ry: 10px; }
    .arrow { fill: none; stroke: #586069; stroke-width: 1.5px; marker-end: url(#arrowhead); }
    .dashed { stroke-dasharray: 5,5; }
    .user { fill: #ffdf5d; stroke: #24292e; stroke-width: 1px; rx: 15px; ry: 15px; }
    .database { fill: #dbedff; stroke: #0366d6; stroke-width: 1.5px; rx: 3px; ry: 3px; }
    .gateway { fill: #e6f6e6; stroke: #24292e; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .security { fill: #ffe2e2; stroke: #cb2431; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .messaging { fill: #fff5d1; stroke: #f9c513; stroke-width: 1.5px; rx: 5px; ry: 5px; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#586069"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle">Three Horizons Microservices Architecture</text>
  <text x="500" y="70" class="subtitle" text-anchor="middle">Cloud-Native Microservices Web Application</text>
  
  <!-- Cloud Container -->
  <rect x="80" y="100" width="850" height="600" class="cloud"/>
  <text x="120" y="125" class="label">Azure Cloud Environment</text>
  
  <!-- User -->
  <rect x="30" y="300" width="90" height="40" class="user"/>
  <text x="75" y="325" class="label" text-anchor="middle">Users</text>
  
  <!-- Frontend Zone -->
  <rect x="160" y="150" width="180" height="120" class="container"/>
  <text x="250" y="170" class="section-title" text-anchor="middle">Frontend</text>
  
  <!-- Frontend Components -->
  <rect x="170" y="190" width="160" height="30" class="component"/>
  <text x="250" y="210" class="label" text-anchor="middle">Application Gateway</text>
  
  <rect x="170" y="230" width="160" height="30" class="component"/>
  <text x="250" y="250" class="small-label" text-anchor="middle">CDN Profile</text>
  
  <!-- Gateway Zone -->
  <rect x="160" y="290" width="180" height="120" class="gateway"/>
  <text x="250" y="310" class="section-title" text-anchor="middle">API Gateway</text>
  
  <!-- API Gateway -->
  <rect x="170" y="330" width="160" height="30" class="component"/>
  <text x="250" y="350" class="small-label" text-anchor="middle">API Management</text>
  
  <rect x="170" y="370" width="160" height="30" class="component"/>
  <text x="250" y="390" class="small-label" text-anchor="middle">Traffic Manager</text>
  
  <!-- Kubernetes Cluster -->
  <rect x="370" y="150" width="450" height="340" class="k8s"/>
  <text x="395" y="170" class="label">AKS/ARO Kubernetes Cluster</text>
  
  <!-- Microservices -->
  <rect x="390" y="190" width="420" height="290" class="container"/>
  <text x="600" y="210" class="section-title" text-anchor="middle">Microservices</text>
  
  <!-- Individual Microservices -->
  <rect x="400" y="230" width="120" height="50" class="micro"/>
  <text x="460" y="260" class="small-label" text-anchor="middle">User Service</text>
  
  <rect x="400" y="290" width="120" height="50" class="micro"/>
  <text x="460" y="320" class="small-label" text-anchor="middle">Auth Service</text>
  
  <rect x="400" y="350" width="120" height="50" class="micro"/>
  <text x="460" y="380" class="small-label" text-anchor="middle">Product Service</text>
  
  <rect x="400" y="410" width="120" height="50" class="micro"/>
  <text x="460" y="440" class="small-label" text-anchor="middle">Cart Service</text>
  
  <rect x="530" y="230" width="120" height="50" class="micro"/>
  <text x="590" y="260" class="small-label" text-anchor="middle">Order Service</text>
  
  <rect x="530" y="290" width="120" height="50" class="micro"/>
  <text x="590" y="320" class="small-label" text-anchor="middle">Payment Service</text>
  
  <rect x="530" y="350" width="120" height="50" class="micro"/>
  <text x="590" y="380" class="small-label" text-anchor="middle">Notification Service</text>
  
  <rect x="530" y="410" width="120" height="50" class="micro"/>
  <text x="590" y="440" class="small-label" text-anchor="middle">Analytics Service</text>
  
  <rect x="660" y="230" width="120" height="50" class="micro"/>
  <text x="720" y="260" class="small-label" text-anchor="middle">Search Service</text>
  
  <rect x="660" y="290" width="120" height="50" class="micro"/>
  <text x="720" y="320" class="small-label" text-anchor="middle">Recommendation</text>
  
  <rect x="660" y="350" width="120" height="50" class="micro"/>
  <text x="720" y="380" class="small-label" text-anchor="middle">Review Service</text>
  
  <rect x="660" y="410" width="120" height="50" class="micro"/>
  <text x="720" y="440" class="small-label" text-anchor="middle">Content Service</text>
  
  <!-- Messaging -->
  <rect x="370" y="510" width="450" height="80" class="messaging"/>
  <text x="595" y="530" class="section-title" text-anchor="middle">Messaging & Event Bus</text>
  
  <rect x="400" y="550" width="180" height="30" class="component"/>
  <text x="490" y="570" class="small-label" text-anchor="middle">Event Grid</text>
  
  <rect x="610" y="550" width="180" height="30" class="component"/>
  <text x="700" y="570" class="small-label" text-anchor="middle">Service Bus</text>
  
  <!-- Data Zone -->
  <rect x="160" y="430" width="180" height="160" class="container"/>
  <text x="250" y="450" class="section-title" text-anchor="middle">Data Services</text>
  
  <!-- Data Components -->
  <rect x="170" y="470" width="160" height="30" class="database"/>
  <text x="250" y="490" class="small-label" text-anchor="middle">Azure SQL</text>
  
  <rect x="170" y="510" width="160" height="30" class="database"/>
  <text x="250" y="530" class="small-label" text-anchor="middle">Cosmos DB</text>
  
  <rect x="170" y="550" width="160" height="30" class="database"/>
  <text x="250" y="570" class="small-label" text-anchor="middle">Redis Cache</text>
  
  <!-- Security & DevOps -->
  <rect x="140" y="610" width="720" height="80" class="container"/>
  <text x="500" y="630" class="section-title" text-anchor="middle">Security, Identity & DevOps</text>
  
  <!-- Security & DevOps Components -->
  <rect x="150" y="650" width="110" height="30" class="security"/>
  <text x="205" y="670" class="small-label" text-anchor="middle">Azure AD</text>
  
  <rect x="270" y="650" width="110" height="30" class="security"/>
  <text x="325" y="670" class="small-label" text-anchor="middle">Key Vault</text>
  
  <rect x="390" y="650" width="110" height="30" class="component"/>
  <text x="445" y="670" class="small-label" text-anchor="middle">GitHub Actions</text>
  
  <rect x="510" y="650" width="110" height="30" class="component"/>
  <text x="565" y="670" class="small-label" text-anchor="middle">App Insights</text>
  
  <rect x="630" y="650" width="110" height="30" class="component"/>
  <text x="685" y="670" class="small-label" text-anchor="middle">Log Analytics</text>
  
  <rect x="750" y="650" width="100" height="30" class="component"/>
  <text x="800" y="670" class="small-label" text-anchor="middle">Azure Monitor</text>
  
  <!-- Connecting arrows -->
  <!-- User to Frontend -->
  <path d="M 120 320 L 160 250" class="arrow" />
  
  <!-- Frontend to API -->
  <path d="M 250 270 L 250 290" class="arrow" />
  
  <!-- API to Microservices -->
  <path d="M 340 350 L 380 350" class="arrow" />
  
  <!-- Microservices to Data -->
  <path d="M 360 420 L 340 470" class="arrow" />
  
  <!-- Microservices to Messaging -->
  <path d="M 600 480 L 600 510" class="arrow" />
  
  <!-- Connecting microservices -->
  <path d="M 460 280 L 530 255" class="arrow dashed" />
  <path d="M 520 350 L 460 350" class="arrow dashed" />
  <path d="M 590 340 L 590 350" class="arrow dashed" />
  <path d="M 650 255 L 590 255" class="arrow dashed" />
  <path d="M 720 340 L 650 375" class="arrow dashed" />
  <path d="M 660 440 L 590 440" class="arrow dashed" />
  
  <!-- Data to Security -->
  <path d="M 250 590 L 250 650" class="arrow dashed" />
  
  <!-- Horizon Levels -->
  <rect x="940" y="170" width="20" height="50" class="horizon1" rx="5" ry="5" opacity="0.8"/>
  <text x="830" y="170" class="label" text-anchor="start">Horizon 1: Foundation</text>
  <text x="830" y="190" class="description" text-anchor="start">Basic microservices</text>
  
  <rect x="940" y="250" width="20" height="50" class="horizon2" rx="5" ry="5" opacity="0.8"/>
  <text x="830" y="250" class="label" text-anchor="start">Horizon 2: Enhancement</text>
  <text x="830" y="270" class="description" text-anchor="start">Service mesh, advanced routing</text>
  
  <rect x="940" y="330" width="20" height="50" class="horizon3" rx="5" ry="5" opacity="0.8"/>
  <text x="830" y="330" class="label" text-anchor="start">Horizon 3: Innovation</text>
  <text x="830" y="350" class="description" text-anchor="start">AI-powered services</text>
</svg>