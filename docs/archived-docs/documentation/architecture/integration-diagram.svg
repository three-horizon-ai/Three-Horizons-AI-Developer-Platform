<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="800"
   height="600"
   viewBox="0 0 800 600"
   version="1.1"
   id="integration-diagram-svg"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   aria-labelledby="title-integration"
>
  <title id="title-integration">Three Horizons Platform Integration Diagram</title>
  <desc id="desc-integration">Diagram showing the integration architecture of the Three Horizons Platform</desc>
  
  <style>
    .background { fill: #F8F9FA; }
    .azure-blue { fill: #0072C6; }
    .azure-light { fill: #E5F2F9; stroke: #0072C6; }
    .github-dark { fill: #24292E; }
    .github-light { fill: #F0F2F5; stroke: #24292E; }
    .redhat-red { fill: #EE0000; }
    .redhat-light { fill: #FCE9E9; stroke: #EE0000; }
    .platform-fill { fill: #FFFFFF; stroke: #CCCCCC; }
    .text-dark { fill: #333333; font-family: Arial, sans-serif; font-size: 12px; }
    .title-text { fill: #333333; font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; }
    .subtitle-text { fill: #666666; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; }
    .label-text { fill: #FFFFFF; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
    .component-title { fill: #333333; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
    .connector { stroke: #666666; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); }
    .dashed-connector { stroke: #666666; stroke-width: 2px; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
    .bidirectional { stroke: #666666; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); marker-start: url(#arrowhead-start); }
  </style>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666" />
    </marker>
    <marker id="arrowhead-start" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#666666" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" class="background" />
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title-text">Three Horizons Platform Integration Architecture</text>
  
  <!-- Azure Section -->
  <g id="azure-section">
    <rect x="50" y="80" width="700" height="150" rx="5" class="azure-light" opacity="0.5" />
    <text x="100" y="110" class="subtitle-text">Microsoft Azure</text>
    
    <!-- Azure Components -->
    <rect x="100" y="130" width="120" height="80" rx="5" class="azure-blue" />
    <text x="160" y="170" text-anchor="middle" class="label-text">Azure Kubernetes Service</text>
    
    <rect x="250" y="130" width="120" height="80" rx="5" class="azure-blue" />
    <text x="310" y="170" text-anchor="middle" class="label-text">Azure Red Hat OpenShift</text>
    
    <rect x="400" y="130" width="120" height="80" rx="5" class="azure-blue" />
    <text x="460" y="170" text-anchor="middle" class="label-text">Azure Active Directory</text>
    
    <rect x="550" y="130" width="120" height="80" rx="5" class="azure-blue" />
    <text x="610" y="170" text-anchor="middle" class="label-text">Azure Monitor</text>
  </g>
  
  <!-- GitHub Section -->
  <g id="github-section">
    <rect x="50" y="250" width="700" height="150" rx="5" class="github-light" opacity="0.5" />
    <text x="100" y="280" class="subtitle-text">GitHub Enterprise</text>
    
    <!-- GitHub Components -->
    <rect x="100" y="300" width="120" height="80" rx="5" class="github-dark" />
    <text x="160" y="340" text-anchor="middle" class="label-text">Source Code Management</text>
    
    <rect x="250" y="300" width="120" height="80" rx="5" class="github-dark" />
    <text x="310" y="340" text-anchor="middle" class="label-text">GitHub Actions</text>
    
    <rect x="400" y="300" width="120" height="80" rx="5" class="github-dark" />
    <text x="460" y="340" text-anchor="middle" class="label-text">GitHub Packages</text>
    
    <rect x="550" y="300" width="120" height="80" rx="5" class="github-dark" />
    <text x="610" y="340" text-anchor="middle" class="label-text">GitHub Copilot</text>
  </g>
  
  <!-- Red Hat Section -->
  <g id="redhat-section">
    <rect x="50" y="420" width="700" height="150" rx="5" class="redhat-light" opacity="0.5" />
    <text x="100" y="450" class="subtitle-text">Red Hat Developer Hub</text>
    
    <!-- Red Hat Components -->
    <rect x="100" y="470" width="120" height="80" rx="5" class="redhat-red" />
    <text x="160" y="510" text-anchor="middle" class="label-text">Developer Portal</text>
    
    <rect x="250" y="470" width="120" height="80" rx="5" class="redhat-red" />
    <text x="310" y="510" text-anchor="middle" class="label-text">Service Catalog</text>
    
    <rect x="400" y="470" width="120" height="80" rx="5" class="redhat-red" />
    <text x="460" y="510" text-anchor="middle" class="label-text">Golden Paths</text>
    
    <rect x="550" y="470" width="120" height="80" rx="5" class="redhat-red" />
    <text x="610" y="510" text-anchor="middle" class="label-text">Documentation</text>
  </g>
  
  <!-- Connection Lines -->
  <!-- GitHub to Azure -->
  <path d="M160,300 L160,210" class="connector" />
  <path d="M310,300 L310,210" class="connector" />
  <path d="M460,300 L460,210" class="connector" />
  
  <!-- GitHub to Red Hat -->
  <path d="M160,380 L160,470" class="connector" />
  <path d="M310,380 L310,470" class="connector" />
  <path d="M460,380 L460,470" class="connector" />
  
  <!-- Azure to Red Hat -->
  <path d="M610,210 L610,250 L670,250 L670,470 L610,470" class="dashed-connector" />
  <path d="M100,200 L30,200 L30,400 L70,400 L100,400 L100,470" class="dashed-connector" />
  
  <!-- Bidirectional Connections -->
  <path d="M220,170 L250,170" class="bidirectional" />
  <path d="M370,170 L400,170" class="bidirectional" />
  <path d="M520,170 L550,170" class="bidirectional" />
  
  <path d="M220,340 L250,340" class="bidirectional" />
  <path d="M370,340 L400,340" class="bidirectional" />
  <path d="M520,340 L550,340" class="bidirectional" />
  
  <path d="M220,510 L250,510" class="bidirectional" />
  <path d="M370,510 L400,510" class="bidirectional" />
  <path d="M520,510 L550,510" class="bidirectional" />
  
  <!-- Legend -->
  <g id="legend" transform="translate(600, 30)">
    <rect x="0" y="0" width="15" height="5" class="azure-blue" />
    <text x="20" y="5" class="text-dark">Azure</text>
    
    <rect x="80" y="0" width="15" height="5" class="github-dark" />
    <text x="100" y="5" class="text-dark">GitHub</text>
    
    <rect x="160" y="0" width="15" height="5" class="redhat-red" />
    <text x="180" y="5" class="text-dark">Red Hat</text>
  </g>
</svg>