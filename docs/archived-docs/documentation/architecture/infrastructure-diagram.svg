<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
    <!-- Background -->
    <rect width="1200" height="900" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Infrastructure Architecture</text>
    
    <!-- Azure Cloud Container -->
    <rect x="50" y="70" width="1100" height="780" stroke="#0078d4" stroke-width="3" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="600" y="100" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Azure</text>
    
    <!-- Resource Groups -->
    <rect x="80" y="130" width="1040" height="700" stroke="#666666" stroke-width="2" fill="#ffffff" rx="5" ry="5" opacity="0.8"/>
    <text x="600" y="160" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#666">Azure Resource Group: Three-Horizons-RG</text>
    
    <!-- Network Infrastructure -->
    <rect x="100" y="180" width="1000" height="150" stroke="#333333" stroke-width="2" fill="#e6e6e6" rx="5" ry="5"/>
    <text x="600" y="205" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Network Infrastructure</text>
    
    <!-- VNET -->
    <rect x="120" y="220" width="280" height="90" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="5" ry="5"/>
    <text x="260" y="245" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0078d4">Virtual Network</text>
    <text x="260" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Address space: 10.0.0.0/16</text>
    <text x="260" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">three-horizons-vnet</text>
    
    <!-- Subnets -->
    <rect x="420" y="220" width="200" height="40" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="520" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">ARO Master Subnet</text>
    
    <rect x="420" y="270" width="200" height="40" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="520" y="295" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">ARO Worker Subnet</text>
    
    <!-- Network Security -->
    <rect x="640" y="220" width="200" height="90" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="740" y="255" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Network Security Groups</text>
    <text x="740" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Traffic control and security</text>
    
    <!-- Azure Firewall -->
    <rect x="860" y="220" width="200" height="90" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="960" y="255" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Firewall</text>
    <text x="960" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Managed network security</text>
    
    <!-- Compute Infrastructure -->
    <!-- ARO Cluster -->
    <rect x="100" y="350" width="560" height="320" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="10" ry="10"/>
    <text x="380" y="375" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#cc0000">Azure Red Hat OpenShift (ARO)</text>
    
    <!-- Master Nodes -->
    <rect x="120" y="400" width="520" height="100" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="380" y="420" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Master Nodes</text>
    
    <rect x="140" y="440" width="150" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="215" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Master-1</text>
    
    <rect x="310" y="440" width="150" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="385" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Master-2</text>
    
    <rect x="480" y="440" width="150" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="555" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Master-3</text>
    
    <!-- Worker Nodes -->
    <rect x="120" y="520" width="520" height="120" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="380" y="540" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Worker Nodes</text>
    
    <rect x="140" y="560" width="150" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="215" y="585" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Worker-1</text>
    
    <rect x="310" y="560" width="150" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="385" y="585" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Worker-2</text>
    
    <rect x="480" y="560" width="150" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="555" y="585" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Worker-3</text>
    
    <!-- Red Hat Developer Hub -->
    <rect x="120" y="650" width="520" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="380" y="675" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Red Hat Developer Hub (Backstage)</text>
    
    <!-- Supporting Services -->
    <rect x="680" y="350" width="420" height="320" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="890" y="375" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Supporting Azure Services</text>
    
    <!-- Azure Container Registry -->
    <rect x="700" y="400" width="180" height="80" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="790" y="435" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Container Registry</text>
    <text x="790" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Image storage</text>
    
    <!-- Azure Key Vault -->
    <rect x="900" y="400" width="180" height="80" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="990" y="435" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Key Vault</text>
    <text x="990" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Secrets management</text>
    
    <!-- Azure Database -->
    <rect x="700" y="500" width="180" height="80" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="790" y="535" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Database</text>
    <text x="790" y="555" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">PostgreSQL for Developer Hub</text>
    
    <!-- Azure Storage -->
    <rect x="900" y="500" width="180" height="80" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="990" y="535" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Storage</text>
    <text x="990" y="555" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Blob and file storage</text>
    
    <!-- Azure Log Analytics -->
    <rect x="700" y="600" width="180" height="80" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="790" y="635" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Log Analytics</text>
    <text x="790" y="655" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Logs and monitoring</text>
    
    <!-- Azure Monitor -->
    <rect x="900" y="600" width="180" height="80" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="990" y="635" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Monitor</text>
    <text x="990" y="655" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Metrics and alerts</text>
    
    <!-- GitHub Integration -->
    <rect x="100" y="720" width="1000" height="90" stroke="#333333" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="600" y="745" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">GitHub Enterprise Integration</text>
    
    <rect x="120" y="760" width="300" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="270" y="785" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">GitHub Actions Runners</text>
    
    <rect x="450" y="760" width="300" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="785" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">GitHub Enterprise Cloud</text>
    
    <rect x="780" y="760" width="300" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="930" y="785" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">GitHub Auth Integration</text>
    
    <!-- Connections -->
    <!-- ACR to ARO -->
    <path d="M 700 440 L 660 500" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Key Vault to ARO -->
    <path d="M 900 440 L 660 480" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Database to Developer Hub -->
    <line x1="700" y1="540" x2="640" y2="650" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Monitor to Log Analytics -->
    <line x1="900" y1="640" x2="880" y2="640" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- VNET to ARO -->
    <line x1="260" y1="310" x2="260" y2="350" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- GitHub to DevHub -->
    <path d="M 600 760 L 380 690" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="1000" y="70" width="15" height="15" fill="#0078d4"/>
    <text x="1020" y="83" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Azure Services</text>
    
    <rect x="1000" y="90" width="15" height="15" fill="#cc0000"/>
    <text x="1020" y="103" font-family="Arial" font-size="12" text-anchor="start" fill="#333">OpenShift Components</text>
    
    <rect x="1000" y="110" width="15" height="15" fill="#333333"/>
    <text x="1020" y="123" font-family="Arial" font-size="12" text-anchor="start" fill="#333">GitHub Components</text>
</svg> 