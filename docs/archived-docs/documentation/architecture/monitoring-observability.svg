<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill: #0366d6; }
    .subtitle { font: italic 18px sans-serif; fill: #24292e; }
    .label { font: bold 14px sans-serif; fill: #24292e; }
    .small-label { font: bold 12px sans-serif; fill: #24292e; }
    .description { font: 12px sans-serif; fill: #586069; }
    .horizon1 { fill: #2188ff; }
    .horizon2 { fill: #f9c513; }
    .horizon3 { fill: #6f42c1; }
    .section-title { font: bold 16px sans-serif; fill: #24292e; }
    .component { fill: white; stroke: #0366d6; stroke-width: 2px; rx: 5px; ry: 5px; }
    .cloud { fill: #f1f8ff; stroke: #0366d6; stroke-width: 2px; rx: 20px; ry: 20px; }
    .container { fill: #e1e4e8; stroke: #24292e; stroke-width: 1px; rx: 5px; ry: 5px; }
    .system { fill: #dbedff; stroke: #0366d6; stroke-width: 1px; rx: 10px; ry: 10px; }
    .arrow { fill: none; stroke: #586069; stroke-width: 1.5px; marker-end: url(#arrowhead); }
    .data-flow { fill: none; stroke: #28a745; stroke-width: 2px; marker-end: url(#greenarrow); }
    .alert-flow { fill: none; stroke: #cb2431; stroke-width: 2px; marker-end: url(#redarrow); stroke-dasharray: 5,5; }
    .dashboard { fill: #fffbdd; stroke: #f9c513; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .metric { fill: #f0fff0; stroke: #28a745; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .log { fill: #f8f8ff; stroke: #6f42c1; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .alert { fill: #ffe2e2; stroke: #cb2431; stroke-width: 1.5px; rx: 5px; ry: 5px; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#586069"/>
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="redarrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cb2431"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle">Three Horizons Monitoring & Observability Architecture</text>
  <text x="500" y="70" class="subtitle" text-anchor="middle">Comprehensive Platform Monitoring Framework</text>
  
  <!-- Cloud Container -->
  <rect x="80" y="100" width="840" height="550" class="cloud"/>
  <text x="120" y="125" class="label">Azure Cloud Environment</text>
  
  <!-- Systems Being Monitored -->
  <rect x="100" y="140" width="800" height="160" class="system"/>
  <text x="500" y="160" class="section-title" text-anchor="middle">Monitored Systems</text>
  
  <!-- Application Components -->
  <rect x="120" y="180" width="120" height="100" class="container"/>
  <text x="180" y="200" class="small-label" text-anchor="middle">Web Applications</text>
  <rect x="130" y="220" width="100" height="25" class="component"/>
  <text x="180" y="237" class="small-label" text-anchor="middle">Frontend</text>
  <rect x="130" y="250" width="100" height="25" class="component"/>
  <text x="180" y="267" class="small-label" text-anchor="middle">Backend APIs</text>
  
  <rect x="260" y="180" width="120" height="100" class="container"/>
  <text x="320" y="200" class="small-label" text-anchor="middle">Kubernetes</text>
  <rect x="270" y="220" width="100" height="25" class="component"/>
  <text x="320" y="237" class="small-label" text-anchor="middle">AKS/ARO</text>
  <rect x="270" y="250" width="100" height="25" class="component"/>
  <text x="320" y="267" class="small-label" text-anchor="middle">Containers</text>
  
  <rect x="400" y="180" width="120" height="100" class="container"/>
  <text x="460" y="200" class="small-label" text-anchor="middle">Serverless</text>
  <rect x="410" y="220" width="100" height="25" class="component"/>
  <text x="460" y="237" class="small-label" text-anchor="middle">Functions</text>
  <rect x="410" y="250" width="100" height="25" class="component"/>
  <text x="460" y="267" class="small-label" text-anchor="middle">Logic Apps</text>
  
  <rect x="540" y="180" width="120" height="100" class="container"/>
  <text x="600" y="200" class="small-label" text-anchor="middle">Data Services</text>
  <rect x="550" y="220" width="100" height="25" class="component"/>
  <text x="600" y="237" class="small-label" text-anchor="middle">Databases</text>
  <rect x="550" y="250" width="100" height="25" class="component"/>
  <text x="600" y="267" class="small-label" text-anchor="middle">Storage</text>
  
  <rect x="680" y="180" width="120" height="100" class="container"/>
  <text x="740" y="200" class="small-label" text-anchor="middle">Infrastructure</text>
  <rect x="690" y="220" width="100" height="25" class="component"/>
  <text x="740" y="237" class="small-label" text-anchor="middle">VMs</text>
  <rect x="690" y="250" width="100" height="25" class="component"/>
  <text x="740" y="267" class="small-label" text-anchor="middle">Networking</text>
  
  <!-- Telemetry Collection -->
  <rect x="100" y="320" width="800" height="100" class="container"/>
  <text x="500" y="340" class="section-title" text-anchor="middle">Telemetry Collection</text>
  
  <!-- Telemetry Types -->
  <rect x="120" y="360" width="150" height="40" class="metric"/>
  <text x="195" y="385" class="label" text-anchor="middle">Metrics</text>
  
  <rect x="290" y="360" width="150" height="40" class="log"/>
  <text x="365" y="385" class="label" text-anchor="middle">Logs</text>
  
  <rect x="460" y="360" width="150" height="40" class="component"/>
  <text x="535" y="385" class="label" text-anchor="middle">Traces</text>
  
  <rect x="630" y="360" width="150" height="40" class="component"/>
  <text x="705" y="385" class="label" text-anchor="middle">Health Status</text>
  
  <!-- Monitoring Platform -->
  <rect x="100" y="440" width="800" height="100" class="container"/>
  <text x="500" y="460" class="section-title" text-anchor="middle">Monitoring Platform</text>
  
  <!-- Monitoring Components -->
  <rect x="120" y="480" width="150" height="40" class="component"/>
  <text x="195" y="505" class="label" text-anchor="middle">Azure Monitor</text>
  
  <rect x="290" y="480" width="150" height="40" class="component"/>
  <text x="365" y="505" class="label" text-anchor="middle">Log Analytics</text>
  
  <rect x="460" y="480" width="150" height="40" class="component"/>
  <text x="535" y="505" class="label" text-anchor="middle">Application Insights</text>
  
  <rect x="630" y="480" width="150" height="40" class="component"/>
  <text x="705" y="505" class="label" text-anchor="middle">Prometheus/Grafana</text>
  
  <!-- Outputs Section -->
  <rect x="100" y="560" width="380" height="70" class="dashboard"/>
  <text x="290" y="580" class="section-title" text-anchor="middle">Dashboards & Visualization</text>
  <rect x="120" y="590" width="100" height="30" class="component"/>
  <text x="170" y="610" class="small-label" text-anchor="middle">Azure Dashboards</text>
  <rect x="240" y="590" width="100" height="30" class="component"/>
  <text x="290" y="610" class="small-label" text-anchor="middle">Grafana</text>
  <rect x="360" y="590" width="100" height="30" class="component"/>
  <text x="410" y="610" class="small-label" text-anchor="middle">Power BI</text>
  
  <rect x="520" y="560" width="380" height="70" class="alert"/>
  <text x="710" y="580" class="section-title" text-anchor="middle">Alerting & Response</text>
  <rect x="540" y="590" width="100" height="30" class="component"/>
  <text x="590" y="610" class="small-label" text-anchor="middle">Alert Rules</text>
  <rect x="660" y="590" width="100" height="30" class="component"/>
  <text x="710" y="610" class="small-label" text-anchor="middle">Action Groups</text>
  <rect x="780" y="590" width="100" height="30" class="component"/>
  <text x="830" y="610" class="small-label" text-anchor="middle">Automation</text>
  
  <!-- Connecting arrows -->
  <!-- Systems to Telemetry -->
  <path d="M 180 280 L 180 360" class="data-flow" />
  <path d="M 320 280 L 320 360" class="data-flow" />
  <path d="M 460 280 L 460 360" class="data-flow" />
  <path d="M 600 280 L 600 360" class="data-flow" />
  <path d="M 740 280 L 740 360" class="data-flow" />
  
  <!-- Telemetry to Platform -->
  <path d="M 195 400 L 195 480" class="arrow" />
  <path d="M 365 400 L 365 480" class="arrow" />
  <path d="M 535 400 L 535 480" class="arrow" />
  <path d="M 705 400 L 705 480" class="arrow" />
  
  <!-- Platform to Outputs -->
  <path d="M 195 520 L 195 590" class="arrow" />
  <path d="M 365 520 L 290 590" class="arrow" />
  <path d="M 535 520 L 410 590" class="arrow" />
  
  <path d="M 705 520 L 705 590" class="alert-flow" />
  <path d="M 535 520 L 590 590" class="alert-flow" />
  <path d="M 365 520 L 710 590" class="alert-flow" />
  <path d="M 195 520 L 830 590" class="alert-flow" />
  
  <!-- Horizon Levels -->
  <rect x="900" y="190" width="20" height="50" class="horizon1" rx="5" ry="5" opacity="0.8"/>
  <text x="890" y="215" class="label" text-anchor="end">Horizon 1: Foundation</text>
  
  <rect x="900" y="260" width="20" height="50" class="horizon2" rx="5" ry="5" opacity="0.8"/>
  <text x="890" y="285" class="label" text-anchor="end">Horizon 2: Enhancement</text>
  
  <rect x="900" y="330" width="20" height="50" class="horizon3" rx="5" ry="5" opacity="0.8"/>
  <text x="890" y="355" class="label" text-anchor="end">Horizon 3: Innovation</text>
</svg>