<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Security Architecture</text>
    
    <!-- Azure Security Container -->
    <rect x="50" y="80" width="1100" height="700" stroke="#0078d4" stroke-width="3" fill="#f0f5ff" rx="10" ry="10" opacity="0.3"/>
    <text x="600" y="110" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Azure Security Boundary</text>
    
    <!-- Identity and Access Management -->
    <rect x="80" y="140" width="300" height="220" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="230" y="165" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Identity & Access Management</text>
    
    <rect x="100" y="180" width="260" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="230" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Active Directory</text>
    
    <rect x="100" y="240" width="260" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="230" y="270" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Role-Based Access Control (RBAC)</text>
    
    <rect x="100" y="300" width="260" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="230" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Managed Identities</text>
    
    <!-- Network Security -->
    <rect x="400" y="140" width="400" height="220" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="600" y="165" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Network Security</text>
    
    <rect x="420" y="180" width="170" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="505" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Virtual Network</text>
    
    <rect x="420" y="240" width="170" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="505" y="270" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Network Security Groups</text>
    
    <rect x="420" y="300" width="170" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="505" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Private Link</text>
    
    <rect x="610" y="180" width="170" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="695" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Firewall</text>
    
    <rect x="610" y="240" width="170" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="695" y="270" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">DDoS Protection</text>
    
    <rect x="610" y="300" width="170" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="695" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Web Application Firewall</text>
    
    <!-- Data Protection -->
    <rect x="820" y="140" width="300" height="220" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="970" y="165" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Data Protection</text>
    
    <rect x="840" y="180" width="260" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="970" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Key Vault</text>
    
    <rect x="840" y="240" width="260" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="970" y="270" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Storage Encryption</text>
    
    <rect x="840" y="300" width="260" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="970" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Database Encryption</text>
    
    <!-- Container Platform Security -->
    <rect x="80" y="380" width="1040" height="180" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="10" ry="10"/>
    <text x="600" y="405" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#cc0000">Container Platform Security</text>
    
    <!-- ARO Security (Left Side) -->
    <rect x="100" y="420" width="490" height="130" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="345" y="445" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#cc0000">Azure Red Hat OpenShift Security</text>
    
    <rect x="120" y="460" width="140" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="190" y="485" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">OpenShift Security Context Constraints</text>
    
    <rect x="270" y="460" width="140" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="340" y="485" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">OpenShift Service Mesh Security</text>
    
    <rect x="420" y="460" width="140" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="490" y="485" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Red Hat Advanced Cluster Security</text>
    
    <text x="345" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Integrated with Azure Security Center</text>
    
    <!-- AKS Security (Right Side) -->
    <rect x="610" y="420" width="490" height="130" stroke="#0066cc" stroke-width="1" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="855" y="445" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#0066cc">Azure Kubernetes Service Security</text>
    
    <rect x="630" y="460" width="140" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="700" y="485" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Pod Security Policies</text>
    
    <rect x="780" y="460" width="140" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="850" y="485" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Azure Policy for AKS</text>
    
    <rect x="940" y="460" width="140" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="1010" y="485" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Istio Service Mesh Security</text>
    
    <text x="855" y="525" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Integrated with Azure Security Center</text>
    
    <!-- GitHub Security -->
    <rect x="80" y="580" width="1040" height="180" stroke="#333333" stroke-width="2" fill="#f5f5f5" rx="10" ry="10"/>
    <text x="600" y="605" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">GitHub Enterprise Security</text>
    
    <!-- Development Security -->
    <rect x="100" y="620" width="330" height="130" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="265" y="645" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Development Security</text>
    
    <rect x="120" y="660" width="140" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="190" y="685" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Secret Scanning</text>
    
    <rect x="270" y="660" width="140" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="340" y="685" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Dependabot</text>
    
    <text x="265" y="725" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Secure Development Practices</text>
    
    <!-- CI/CD Security -->
    <rect x="450" y="620" width="330" height="130" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="615" y="645" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">CI/CD Pipeline Security</text>
    
    <rect x="470" y="660" width="140" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="540" y="685" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Code Scanning</text>
    
    <rect x="620" y="660" width="140" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="690" y="685" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Actions Security</text>
    
    <text x="615" y="725" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Secure CI/CD Workflows</text>
    
    <!-- Advanced Security -->
    <rect x="800" y="620" width="320" height="130" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="960" y="645" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Advanced Security</text>
    
    <rect x="820" y="660" width="140" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="890" y="685" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">SAST (Static Analysis)</text>
    
    <rect x="970" y="660" width="130" height="40" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="1035" y="685" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Container Scanning</text>
    
    <text x="960" y="725" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Comprehensive Security Scanning</text>
    
    <!-- Security Monitoring and Compliance -->
    <rect x="200" y="65" width="800" height="30" stroke="#333333" stroke-width="1" fill="#ffffcc" rx="5" ry="5"/>
    <text x="600" y="85" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Security Center / Microsoft Defender for Cloud</text>
    
    <rect x="200" y="765" width="800" height="30" stroke="#333333" stroke-width="1" fill="#ffffcc" rx="5" ry="5"/>
    <text x="600" y="785" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Continuous Security Monitoring & Compliance</text>
    
    <!-- Legend -->
    <rect x="1100" y="160" width="15" height="15" fill="#0078d4"/>
    <text x="1120" y="173" font-family="Arial" font-size="10" text-anchor="start" fill="#333">Azure Security</text>
    
    <rect x="1100" y="185" width="15" height="15" fill="#cc0000"/>
    <text x="1120" y="198" font-family="Arial" font-size="10" text-anchor="start" fill="#333">ARO Security</text>
    
    <rect x="1100" y="210" width="15" height="15" fill="#0066cc"/>
    <text x="1120" y="223" font-family="Arial" font-size="10" text-anchor="start" fill="#333">AKS Security</text>
    
    <rect x="1100" y="235" width="15" height="15" fill="#333333"/>
    <text x="1120" y="248" font-family="Arial" font-size="10" text-anchor="start" fill="#333">GitHub Security</text>
    
    <rect x="1100" y="260" width="15" height="15" fill="#ffffcc"/>
    <text x="1120" y="273" font-family="Arial" font-size="10" text-anchor="start" fill="#333">Monitoring</text>
</svg> 