<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill: #0366d6; }
    .subtitle { font: italic 18px sans-serif; fill: #24292e; }
    .label { font: bold 14px sans-serif; fill: #24292e; }
    .small-label { font: bold 12px sans-serif; fill: #24292e; }
    .description { font: 12px sans-serif; fill: #586069; }
    .horizon1 { fill: #2188ff; }
    .horizon2 { fill: #f9c513; }
    .horizon3 { fill: #6f42c1; }
    .section-title { font: bold 16px sans-serif; fill: #24292e; }
    .component { fill: white; stroke: #0366d6; stroke-width: 2px; rx: 5px; ry: 5px; }
    .primary { fill: #f5f5ff; stroke: #0366d6; stroke-width: 2px; rx: 20px; ry: 20px; }
    .secondary { fill: #fff5f5; stroke: #cb2431; stroke-width: 2px; rx: 20px; ry: 20px; }
    .container { fill: #e1e4e8; stroke: #24292e; stroke-width: 1px; rx: 5px; ry: 5px; }
    .arrow { fill: none; stroke: #586069; stroke-width: 1.5px; marker-end: url(#arrowhead); }
    .rep-arrow { fill: none; stroke: #0366d6; stroke-width: 2px; marker-end: url(#bluearrowhead); stroke-dasharray: 5,5; }
    .fail-arrow { fill: none; stroke: #cb2431; stroke-width: 2px; marker-end: url(#redarrowhead); }
    .storage { fill: #dbedff; stroke: #0366d6; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .compute { fill: #f0fff0; stroke: #28a745; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .data { fill: #fff0f8; stroke: #6f42c1; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .policy { fill: #fffbdd; stroke: #f9c513; stroke-width: 1.5px; rx: 5px; ry: 5px; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#586069"/>
    </marker>
    <marker id="bluearrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0366d6"/>
    </marker>
    <marker id="redarrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cb2431"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle">Three Horizons Disaster Recovery Architecture</text>
  <text x="500" y="70" class="subtitle" text-anchor="middle">Business Continuity and Disaster Recovery Framework</text>
  
  <!-- Primary Region -->
  <rect x="100" y="120" width="350" height="400" class="primary"/>
  <text x="275" y="145" class="section-title" text-anchor="middle">Primary Region</text>
  <text x="275" y="165" class="small-label" text-anchor="middle">East US</text>
  
  <!-- Secondary Region -->
  <rect x="550" y="120" width="350" height="400" class="secondary"/>
  <text x="725" y="145" class="section-title" text-anchor="middle">Secondary Region</text>
  <text x="725" y="165" class="small-label" text-anchor="middle">West US</text>
  
  <!-- Primary Compute Resources -->
  <rect x="120" y="180" width="310" height="120" class="compute"/>
  <text x="275" y="200" class="section-title" text-anchor="middle">Compute Resources</text>
  
  <rect x="130" y="220" width="140" height="30" class="component"/>
  <text x="200" y="240" class="small-label" text-anchor="middle">AKS/ARO Cluster</text>
  
  <rect x="130" y="260" width="140" height="30" class="component"/>
  <text x="200" y="280" class="small-label" text-anchor="middle">App Services</text>
  
  <rect x="280" y="220" width="140" height="30" class="component"/>
  <text x="350" y="240" class="small-label" text-anchor="middle">Azure Functions</text>
  
  <rect x="280" y="260" width="140" height="30" class="component"/>
  <text x="350" y="280" class="small-label" text-anchor="middle">Virtual Machines</text>
  
  <!-- Secondary Compute Resources -->
  <rect x="570" y="180" width="310" height="120" class="compute"/>
  <text x="725" y="200" class="section-title" text-anchor="middle">Compute Resources</text>
  
  <rect x="580" y="220" width="140" height="30" class="component"/>
  <text x="650" y="240" class="small-label" text-anchor="middle">AKS/ARO Cluster</text>
  
  <rect x="580" y="260" width="140" height="30" class="component"/>
  <text x="650" y="280" class="small-label" text-anchor="middle">App Services</text>
  
  <rect x="730" y="220" width="140" height="30" class="component"/>
  <text x="800" y="240" class="small-label" text-anchor="middle">Azure Functions</text>
  
  <rect x="730" y="260" width="140" height="30" class="component"/>
  <text x="800" y="280" class="small-label" text-anchor="middle">Virtual Machines</text>
  
  <!-- Primary Data Resources -->
  <rect x="120" y="320" width="310" height="160" class="data"/>
  <text x="275" y="340" class="section-title" text-anchor="middle">Data Resources</text>
  
  <rect x="130" y="360" width="140" height="30" class="storage"/>
  <text x="200" y="380" class="small-label" text-anchor="middle">SQL Database</text>
  
  <rect x="130" y="400" width="140" height="30" class="storage"/>
  <text x="200" y="420" class="small-label" text-anchor="middle">Cosmos DB</text>
  
  <rect x="130" y="440" width="140" height="30" class="storage"/>
  <text x="200" y="460" class="small-label" text-anchor="middle">Storage Accounts</text>
  
  <rect x="280" y="360" width="140" height="30" class="storage"/>
  <text x="350" y="380" class="small-label" text-anchor="middle">Key Vault</text>
  
  <rect x="280" y="400" width="140" height="30" class="storage"/>
  <text x="350" y="420" class="small-label" text-anchor="middle">Redis Cache</text>
  
  <rect x="280" y="440" width="140" height="30" class="storage"/>
  <text x="350" y="460" class="small-label" text-anchor="middle">Event Hub</text>
  
  <!-- Secondary Data Resources -->
  <rect x="570" y="320" width="310" height="160" class="data"/>
  <text x="725" y="340" class="section-title" text-anchor="middle">Data Resources</text>
  
  <rect x="580" y="360" width="140" height="30" class="storage"/>
  <text x="650" y="380" class="small-label" text-anchor="middle">SQL Database</text>
  
  <rect x="580" y="400" width="140" height="30" class="storage"/>
  <text x="650" y="420" class="small-label" text-anchor="middle">Cosmos DB</text>
  
  <rect x="580" y="440" width="140" height="30" class="storage"/>
  <text x="650" y="460" class="small-label" text-anchor="middle">Storage Accounts</text>
  
  <rect x="730" y="360" width="140" height="30" class="storage"/>
  <text x="800" y="380" class="small-label" text-anchor="middle">Key Vault</text>
  
  <rect x="730" y="400" width="140" height="30" class="storage"/>
  <text x="800" y="420" class="small-label" text-anchor="middle">Redis Cache</text>
  
  <rect x="730" y="440" width="140" height="30" class="storage"/>
  <text x="800" y="460" class="small-label" text-anchor="middle">Event Hub</text>
  
  <!-- DR Policies -->
  <rect x="100" y="540" width="800" height="120" class="container"/>
  <text x="500" y="560" class="section-title" text-anchor="middle">Disaster Recovery Policies & Processes</text>
  
  <rect x="120" y="580" width="180" height="60" class="policy"/>
  <text x="210" y="600" class="label" text-anchor="middle">HA/DR Strategy</text>
  <text x="210" y="620" class="small-label" text-anchor="middle">RTO/RPO Definitions</text>
  
  <rect x="320" y="580" width="180" height="60" class="policy"/>
  <text x="410" y="600" class="label" text-anchor="middle">Backup Procedures</text>
  <text x="410" y="620" class="small-label" text-anchor="middle">Schedule & Retention</text>
  
  <rect x="520" y="580" width="180" height="60" class="policy"/>
  <text x="610" y="600" class="label" text-anchor="middle">Recovery Plans</text>
  <text x="610" y="620" class="small-label" text-anchor="middle">Failover/Failback</text>
  
  <rect x="720" y="580" width="160" height="60" class="policy"/>
  <text x="800" y="600" class="label" text-anchor="middle">Testing</text>
  <text x="800" y="620" class="small-label" text-anchor="middle">DR Drills & Validation</text>
  
  <!-- Connection arrows -->
  <!-- Replication Arrows -->
  <path d="M 270 240 L 580 240" class="rep-arrow" />
  <path d="M 270 280 L 580 280" class="rep-arrow" />
  <path d="M 200 380 L 580 380" class="rep-arrow" />
  <path d="M 200 420 L 580 420" class="rep-arrow" />
  <path d="M 200 460 L 580 460" class="rep-arrow" />
  <path d="M 350 380 L 730 380" class="rep-arrow" />
  <path d="M 350 420 L 730 420" class="rep-arrow" />
  <path d="M 350 460 L 730 460" class="rep-arrow" />
  
  <!-- Failover Arrow -->
  <path d="M 275 500 C 275 520, 500 530, 725 500" class="fail-arrow" />
  <text x="500" y="530" class="small-label" text-anchor="middle">Failover</text>
  
  <!-- Policy Connection Arrows -->
  <path d="M 275 500 L 210 580" class="arrow" />
  <path d="M 275 500 L 410 580" class="arrow" />
  <path d="M 725 500 L 610 580" class="arrow" />
  <path d="M 725 500 L 800 580" class="arrow" />
  
  <!-- Traffic Manager/Front Door -->
  <rect x="400" y="90" width="200" height="40" class="component"/>
  <text x="500" y="115" class="label" text-anchor="middle">Azure Traffic Manager</text>
  
  <path d="M 440 130 L 360 180" class="arrow" />
  <path d="M 560 130 L 640 180" class="arrow" />
  
  <!-- Horizon Levels -->
  <rect x="65" y="200" width="20" height="50" class="horizon1" rx="5" ry="5" opacity="0.8"/>
  <text x="55" y="225" class="label" text-anchor="end">H1</text>
  
  <rect x="65" y="300" width="20" height="50" class="horizon2" rx="5" ry="5" opacity="0.8"/>
  <text x="55" y="325" class="label" text-anchor="end">H2</text>
  
  <rect x="65" y="400" width="20" height="50" class="horizon3" rx="5" ry="5" opacity="0.8"/>
  <text x="55" y="425" class="label" text-anchor="end">H3</text>
</svg>