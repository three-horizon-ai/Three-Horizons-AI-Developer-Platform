<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; fill: #0366d6; }
    .subtitle { font: italic 18px sans-serif; fill: #24292e; }
    .label { font: bold 14px sans-serif; fill: #24292e; }
    .small-label { font: bold 12px sans-serif; fill: #24292e; }
    .description { font: 12px sans-serif; fill: #586069; }
    .horizon1 { fill: #2188ff; }
    .horizon2 { fill: #f9c513; }
    .horizon3 { fill: #6f42c1; }
    .section-title { font: bold 16px sans-serif; fill: #24292e; }
    .component { fill: white; stroke: #0366d6; stroke-width: 2px; rx: 5px; ry: 5px; }
    .function { fill: #fdf5e6; stroke: #f9c513; stroke-width: 1.5px; rx: 3px; ry: 3px; }
    .cloud { fill: #f1f8ff; stroke: #0366d6; stroke-width: 2px; rx: 20px; ry: 20px; }
    .container { fill: #e1e4e8; stroke: #24292e; stroke-width: 1px; rx: 5px; ry: 5px; }
    .arrow { fill: none; stroke: #586069; stroke-width: 1.5px; marker-end: url(#arrowhead); }
    .dashed { stroke-dasharray: 5,5; }
    .user { fill: #ffdf5d; stroke: #24292e; stroke-width: 1px; rx: 15px; ry: 15px; }
    .database { fill: #dbedff; stroke: #0366d6; stroke-width: 1.5px; rx: 3px; ry: 3px; }
    .gateway { fill: #e6f6e6; stroke: #24292e; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .security { fill: #ffe2e2; stroke: #cb2431; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .messaging { fill: #fff5d1; stroke: #f9c513; stroke-width: 1.5px; rx: 5px; ry: 5px; }
    .static { fill: #f0fff0; stroke: #28a745; stroke-width: 1.5px; rx: 5px; ry: 5px; }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#586069"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle">Three Horizons Serverless Architecture</text>
  <text x="500" y="70" class="subtitle" text-anchor="middle">Event-Driven, Serverless Web Application Pattern</text>
  
  <!-- Cloud Container -->
  <rect x="100" y="100" width="800" height="550" class="cloud"/>
  <text x="140" y="125" class="label">Azure Cloud Environment</text>
  
  <!-- User -->
  <rect x="30" y="300" width="90" height="40" class="user"/>
  <text x="75" y="325" class="label" text-anchor="middle">Users</text>
  
  <!-- Frontend Static Web App Zone -->
  <rect x="150" y="150" width="200" height="110" class="static"/>
  <text x="250" y="170" class="section-title" text-anchor="middle">Frontend (Static)</text>
  
  <!-- Frontend Components -->
  <rect x="170" y="190" width="160" height="30" class="component"/>
  <text x="250" y="210" class="small-label" text-anchor="middle">Static Web App</text>
  
  <rect x="170" y="230" width="160" height="30" class="component"/>
  <text x="250" y="250" class="small-label" text-anchor="middle">CDN Endpoint</text>
  
  <!-- API Management -->
  <rect x="150" y="280" width="200" height="70" class="gateway"/>
  <text x="250" y="300" class="section-title" text-anchor="middle">API Gateway</text>
  
  <rect x="170" y="320" width="160" height="30" class="component"/>
  <text x="250" y="340" class="small-label" text-anchor="middle">API Management</text>
  
  <!-- Azure Functions -->
  <rect x="400" y="150" width="460" height="230" class="container"/>
  <text x="630" y="170" class="section-title" text-anchor="middle">Azure Functions</text>
  
  <!-- Function Groups -->
  <!-- Auth Functions -->
  <rect x="420" y="190" width="200" height="70" class="function"/>
  <text x="520" y="210" class="small-label" text-anchor="middle">Authentication Functions</text>
  
  <rect x="430" y="220" width="80" height="30" class="component"/>
  <text x="470" y="240" class="small-label" text-anchor="middle">Login</text>
  
  <rect x="520" y="220" width="90" height="30" class="component"/>
  <text x="565" y="240" class="small-label" text-anchor="middle">User Profile</text>
  
  <!-- Business Logic Functions -->
  <rect x="420" y="280" width="200" height="70" class="function"/>
  <text x="520" y="300" class="small-label" text-anchor="middle">Business Logic Functions</text>
  
  <rect x="430" y="310" width="80" height="30" class="component"/>
  <text x="470" y="330" class="small-label" text-anchor="middle">Products</text>
  
  <rect x="520" y="310" width="90" height="30" class="component"/>
  <text x="565" y="330" class="small-label" text-anchor="middle">Orders</text>
  
  <!-- Integration Functions -->
  <rect x="640" y="190" width="200" height="70" class="function"/>
  <text x="740" y="210" class="small-label" text-anchor="middle">Integration Functions</text>
  
  <rect x="650" y="220" width="80" height="30" class="component"/>
  <text x="690" y="240" class="small-label" text-anchor="middle">Payments</text>
  
  <rect x="740" y="220" width="90" height="30" class="component"/>
  <text x="785" y="240" class="small-label" text-anchor="middle">Notifications</text>
  
  <!-- Analytics Functions -->
  <rect x="640" y="280" width="200" height="70" class="function"/>
  <text x="740" y="300" class="small-label" text-anchor="middle">Analytics Functions</text>
  
  <rect x="650" y="310" width="80" height="30" class="component"/>
  <text x="690" y="330" class="small-label" text-anchor="middle">Reporting</text>
  
  <rect x="740" y="310" width="90" height="30" class="component"/>
  <text x="785" y="330" class="small-label" text-anchor="middle">Insights</text>
  
  <!-- Event System -->
  <rect x="400" y="400" width="460" height="70" class="messaging"/>
  <text x="630" y="420" class="section-title" text-anchor="middle">Event-Driven Architecture</text>
  
  <rect x="420" y="430" width="130" height="30" class="component"/>
  <text x="485" y="450" class="small-label" text-anchor="middle">Event Grid</text>
  
  <rect x="565" y="430" width="130" height="30" class="component"/>
  <text x="630" y="450" class="small-label" text-anchor="middle">Event Hub</text>
  
  <rect x="710" y="430" width="130" height="30" class="component"/>
  <text x="775" y="450" class="small-label" text-anchor="middle">Logic Apps</text>
  
  <!-- Data Zone -->
  <rect x="150" y="370" width="200" height="150" class="container"/>
  <text x="250" y="390" class="section-title" text-anchor="middle">Data Services</text>
  
  <!-- Data Components -->
  <rect x="170" y="410" width="160" height="30" class="database"/>
  <text x="250" y="430" class="small-label" text-anchor="middle">Cosmos DB</text>
  
  <rect x="170" y="450" width="160" height="30" class="database"/>
  <text x="250" y="470" class="small-label" text-anchor="middle">Blob Storage</text>
  
  <rect x="170" y="490" width="160" height="30" class="database"/>
  <text x="250" y="510" class="small-label" text-anchor="middle">Table Storage</text>
  
  <!-- DevOps and Monitoring -->
  <rect x="150" y="540" width="710" height="70" class="container"/>
  <text x="500" y="560" class="section-title" text-anchor="middle">DevOps & Monitoring</text>
  
  <rect x="170" y="570" width="110" height="30" class="component"/>
  <text x="225" y="590" class="small-label" text-anchor="middle">GitHub Actions</text>
  
  <rect x="290" y="570" width="110" height="30" class="component"/>
  <text x="345" y="590" class="small-label" text-anchor="middle">Azure DevOps</text>
  
  <rect x="410" y="570" width="110" height="30" class="component"/>
  <text x="465" y="590" class="small-label" text-anchor="middle">App Insights</text>
  
  <rect x="530" y="570" width="110" height="30" class="component"/>
  <text x="585" y="590" class="small-label" text-anchor="middle">Log Analytics</text>
  
  <rect x="650" y="570" width="190" height="30" class="security"/>
  <text x="745" y="590" class="small-label" text-anchor="middle">Key Vault & Managed Identity</text>
  
  <!-- Connecting arrows -->
  <!-- User to Frontend -->
  <path d="M 120 320 L 150 230" class="arrow" />
  
  <!-- Frontend to API -->
  <path d="M 250 260 L 250 280" class="arrow" />
  
  <!-- API to Functions -->
  <path d="M 350 335 L 400 270" class="arrow" />
  
  <!-- Functions to Data -->
  <path d="M 420 335 L 380 430" class="arrow" />
  
  <!-- Functions to Event System -->
  <path d="M 630 350 L 630 400" class="arrow" />
  
  <!-- Event System to Functions (feedback loop) -->
  <path d="M 700 430 L 750 380 L 730 350" class="arrow dashed" />
  
  <!-- Functions Communication -->
  <path d="M 620 225 L 640 225" class="arrow dashed" />
  <path d="M 620 315 L 640 315" class="arrow dashed" />
  <path d="M 520 260 L 520 280" class="arrow dashed" />
  <path d="M 740 260 L 740 280" class="arrow dashed" />
  
  <!-- DevOps connection -->
  <path d="M 250 520 L 320 570" class="arrow dashed" />
  <path d="M 630 470 L 540 570" class="arrow dashed" />
  
  <!-- Horizon Levels -->
  <rect x="910" y="170" width="20" height="50" class="horizon1" rx="5" ry="5" opacity="0.8"/>
  <text x="880" y="195" class="label" text-anchor="end">H1: Foundation</text>
  
  <rect x="910" y="250" width="20" height="50" class="horizon2" rx="5" ry="5" opacity="0.8"/>
  <text x="880" y="275" class="label" text-anchor="end">H2: Enhancement</text>
  
  <rect x="910" y="330" width="20" height="50" class="horizon3" rx="5" ry="5" opacity="0.8"/>
  <text x="880" y="355" class="label" text-anchor="end">H3: Innovation</text>
</svg>