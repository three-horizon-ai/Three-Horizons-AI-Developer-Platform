<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
    <!-- Background -->
    <rect width="1000" height="600" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Architecture Decision Records (ADR) Workflow</text>
    <text x="500" y="70" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">Three Horizons Implementation Process</text>
    
    <!-- Main Flow -->
    <rect x="100" y="120" width="800" height="380" stroke="#333333" stroke-width="2" fill="#ffffff" rx="10" ry="10" opacity="0.5"/>
    
    <!-- Step 1: Architecture Problem -->
    <rect x="150" y="160" width="200" height="80" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="250" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Architecture Problem</text>
    <text x="250" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Identify architectural challenge</text>
    
    <!-- Step 2: Context Analysis -->
    <rect x="400" y="160" width="200" height="80" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="500" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Context Analysis</text>
    <text x="500" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Analyze requirements and constraints</text>
    
    <!-- Step 3: Solution Options -->
    <rect x="650" y="160" width="200" height="80" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="750" y="195" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Solution Options</text>
    <text x="750" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Identify candidate solutions</text>
    
    <!-- Step 4: Decision -->
    <rect x="400" y="270" width="200" height="80" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="5" ry="5"/>
    <text x="500" y="305" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Decision</text>
    <text x="500" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Select solution and document rationale</text>
    
    <!-- Step 5: Implementation -->
    <rect x="400" y="380" width="200" height="80" stroke="#0066cc" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="500" y="415" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Implementation</text>
    <text x="500" y="440" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Apply decision in architecture</text>
    
    <!-- Connections -->
    <path d="M 350 200 L 400 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 600 200 L 650 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 750 240 L 750 310 L 600 310" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 500 350 L 500 380" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 400 310 L 300 310 L 300 200 L 350 200" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" />
    
    <!-- ADR Document Format -->
    <rect x="150" y="520" width="700" height="60" stroke="#333333" stroke-width="1" fill="#ffffcc" rx="5" ry="5"/>
    <text x="500" y="545" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">ADR Document Format</text>
    <text x="500" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Title | Status | Context | Decision | Consequences | Compliance | References</text>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Supporting Elements -->
    <rect x="100" y="120" width="30" height="380" fill="#333333" opacity="0.1"/>
    <text x="115" y="310" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90,115,310)">ADR Process</text>
    
    <!-- Team Circles -->
    <circle cx="180" y="120" r="20" fill="#0078d4" opacity="0.3"/>
    <text x="180" y="125" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Arch</text>
    
    <circle cx="230" y="120" r="20" fill="#cc0000" opacity="0.3"/>
    <text x="230" y="125" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Dev</text>
    
    <circle cx="280" y="120" r="20" fill="#0066cc" opacity="0.3"/>
    <text x="280" y="125" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Ops</text>
    
    <circle cx="330" y="120" r="20" fill="#333333" opacity="0.3"/>
    <text x="330" y="125" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">UX</text>
    
    <!-- Notes -->
    <rect x="650" y="270" width="200" height="80" stroke="#666666" stroke-width="1" fill="#ffffff" rx="5" ry="5" stroke-dasharray="5,5"/>
    <text x="750" y="305" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#666">Evaluation Criteria</text>
    <text x="750" y="325" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">- Cost & Performance</text>
    <text x="750" y="340" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">- Security & Compliance</text>
    
    <rect x="650" y="380" width="200" height="80" stroke="#666666" stroke-width="1" fill="#ffffff" rx="5" ry="5" stroke-dasharray="5,5"/>
    <text x="750" y="415" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#666">Version Control</text>
    <text x="750" y="435" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">ADRs stored in GitHub as</text>
    <text x="750" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Markdown files with history</text>
</svg> 