<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
    <!-- Background -->
    <rect width="1000" height="700" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="500" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Identity Integration</text>
    <text x="500" y="70" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">Unified Authentication and Authorization</text>
    
    <!-- Main Container -->
    <rect x="50" y="100" width="900" height="550" stroke="#333333" stroke-width="2" fill="#ffffff" rx="10" ry="10" opacity="0.5"/>
    
    <!-- Azure AD Section -->
    <rect x="100" y="150" width="800" height="120" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="500" y="175" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Active Directory</text>
    <text x="500" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Central Identity Provider</text>
    
    <!-- Azure AD Components -->
    <rect x="120" y="210" width="150" height="45" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="195" y="237" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Users & Groups</text>
    
    <rect x="290" y="210" width="150" height="45" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="365" y="237" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Enterprise Apps</text>
    
    <rect x="460" y="210" width="150" height="45" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="535" y="237" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">App Registrations</text>
    
    <rect x="630" y="210" width="150" height="45" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="705" y="237" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Conditional Access</text>
    
    <!-- GitHub Integration -->
    <rect x="100" y="300" width="350" height="120" stroke="#333333" stroke-width="2" fill="#f5f5f5" rx="5" ry="5"/>
    <text x="275" y="325" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">GitHub Enterprise</text>
    <text x="275" y="350" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Development & CI/CD Platform</text>
    
    <!-- GitHub Components -->
    <rect x="120" y="360" width="150" height="45" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="195" y="387" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">SAML Integration</text>
    
    <rect x="290" y="360" width="140" height="45" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="360" y="387" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Team Sync</text>
    
    <!-- OpenShift Integration -->
    <rect x="550" y="300" width="350" height="120" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="5" ry="5"/>
    <text x="725" y="325" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#cc0000">Red Hat OpenShift</text>
    <text x="725" y="350" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Container Platform</text>
    
    <!-- OpenShift Components -->
    <rect x="570" y="360" width="150" height="45" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="645" y="387" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OAuth Integration</text>
    
    <rect x="740" y="360" width="140" height="45" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="810" y="387" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">RBAC</text>
    
    <!-- Developer Hub -->
    <rect x="320" y="450" width="360" height="120" stroke="#0066cc" stroke-width="2" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="500" y="475" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#0066cc">Red Hat Developer Hub</text>
    <text x="500" y="500" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Developer Experience Platform</text>
    
    <!-- Developer Hub Components -->
    <rect x="340" y="510" width="150" height="45" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="415" y="537" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Auth Provider</text>
    
    <rect x="510" y="510" width="150" height="45" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="585" y="537" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Permission System</text>
    
    <!-- Container Applications -->
    <rect x="320" y="600" width="360" height="30" stroke="#333333" stroke-width="1" fill="#e6e6e6" rx="5" ry="5"/>
    <text x="500" y="620" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Containerized Applications</text>
    
    <!-- Auth Flow Legend -->
    <rect x="800" y="600" width="130" height="30" stroke="#0078d4" stroke-width="1" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="865" y="620" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Authentication Flow</text>
    
    <rect x="800" y="640" width="130" height="30" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
    <text x="865" y="660" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Authorization Flow</text>
    
    <!-- User Icon -->
    <circle cx="95" y="450" r="30" fill="#0078d4" opacity="0.3"/>
    <text x="95" y="455" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">User</text>
    
    <!-- Connection Lines - Authentication -->
    <!-- User to Azure AD -->
    <path d="M 125 450 L 180 450 C 200 450 200 210 190 210" stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="160" y="430" font-family="Arial" font-size="10" text-anchor="middle" fill="#0078d4">1. Login</text>
    
    <!-- Azure AD to GitHub -->
    <path d="M 500 270 L 500 290 L 275 290 L 275 300" stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="350" y="285" font-family="Arial" font-size="10" text-anchor="middle" fill="#0078d4">2. SAML Auth</text>
    
    <!-- Azure AD to OpenShift -->
    <path d="M 500 270 L 500 290 L 725 290 L 725 300" stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="650" y="285" font-family="Arial" font-size="10" text-anchor="middle" fill="#0078d4">3. OAuth Auth</text>
    
    <!-- GitHub & OpenShift to Developer Hub -->
    <path d="M 275 420 L 275 490 L 320 490" stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="275" y="460" font-family="Arial" font-size="10" text-anchor="middle" fill="#0078d4">4a. GitHub Auth</text>
    
    <path d="M 725 420 L 725 490 L 680 490" stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="725" y="460" font-family="Arial" font-size="10" text-anchor="middle" fill="#0078d4">4b. OpenShift Auth</text>
    
    <!-- Developer Hub to Container Apps -->
    <path d="M 500 570 L 500 600" stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="520" y="585" font-family="Arial" font-size="10" text-anchor="middle" fill="#0078d4">5. App Auth</text>
    
    <!-- Authorization Lines -->
    <path d="M 365 233 C 400 233 400 280 400 320 C 400 380 250 380 195 360" stroke="#333333" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="315" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Groups</text>
    
    <path d="M 365 233 C 500 233 500 280 500 320 C 500 380 800 380 810 360" stroke="#333333" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="600" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Groups</text>
    
    <path d="M 360 385 C 360 400 500 430 500 440 C 500 450 480 510 415 510" stroke="#333333" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="420" y="430" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Team Membership</text>
    
    <path d="M 810 385 C 810 400 650 430 650 440 C 650 450 600 510 585 510" stroke="#333333" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="680" y="430" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">RBAC Permissions</text>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Protocol Labels -->
    <rect x="70" y="120" width="70" height="25" fill="#0078d4" rx="5" ry="5"/>
    <text x="105" y="137" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">OIDC</text>
    
    <rect x="150" y="120" width="70" height="25" fill="#0078d4" rx="5" ry="5"/>
    <text x="185" y="137" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">SAML</text>
    
    <rect x="230" y="120" width="70" height="25" fill="#0078d4" rx="5" ry="5"/>
    <text x="265" y="137" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">OAuth 2.0</text>
</svg> 