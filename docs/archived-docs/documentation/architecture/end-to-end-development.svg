<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
    <!-- Background -->
    <rect width="1200" height="600" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">End-to-End Development Process with Three Horizons</text>
    
    <!-- Process Flow Boxes -->
    <!-- Developer Activities (Inner Loop) -->
    <rect x="100" y="100" width="200" height="80" stroke="#333333" stroke-width="2" fill="#e6e6e6" rx="5" ry="5"/>
    <text x="200" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Development</text>
    <text x="200" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Inner Loop)</text>
    
    <!-- Code Integration -->
    <rect x="350" y="100" width="200" height="80" stroke="#333333" stroke-width="2" fill="#e6e6e6" rx="5" ry="5"/>
    <text x="450" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Code Integration</text>
    <text x="450" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Pull Requests)</text>
    
    <!-- Continuous Integration -->
    <rect x="600" y="100" width="200" height="80" stroke="#333333" stroke-width="2" fill="#e6e6e6" rx="5" ry="5"/>
    <text x="700" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Continuous Integration</text>
    <text x="700" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Build & Test)</text>
    
    <!-- Deployment -->
    <rect x="850" y="100" width="200" height="80" stroke="#333333" stroke-width="2" fill="#e6e6e6" rx="5" ry="5"/>
    <text x="950" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Deployment</text>
    <text x="950" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Outer Loop)</text>
    
    <!-- Flow Arrows -->
    <path d="M 300 140 L 350 140" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 550 140 L 600 140" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 800 140 L 850 140" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Feedback Loop -->
    <path d="M 950 180 C 950 230 200 230 200 180" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="575" y="250" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#666">Continuous Feedback Loop</text>
    
    <!-- Tools and Technologies -->
    <!-- Developer Tools -->
    <rect x="50" y="300" width="300" height="200" stroke="#0066cc" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="200" y="325" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0066cc">Developer Tools</text>
    
    <rect x="75" y="340" width="250" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="200" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">GitHub Codespaces</text>
    
    <rect x="75" y="390" width="250" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="200" y="415" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">GitHub Copilot</text>
    
    <rect x="75" y="440" width="250" height="40" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="200" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Red Hat Developer Hub Templates</text>
    
    <!-- Integration Tools -->
    <rect x="380" y="300" width="300" height="200" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="10" ry="10"/>
    <text x="530" y="325" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#cc0000">Integration & CI Tools</text>
    
    <rect x="405" y="340" width="250" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="530" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">GitHub Pull Requests</text>
    
    <rect x="405" y="390" width="250" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="530" y="415" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">GitHub Actions</text>
    
    <rect x="405" y="440" width="250" height="40" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="530" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">GitHub Advanced Security</text>
    
    <!-- Deployment Tools -->
    <rect x="710" y="300" width="300" height="200" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="860" y="325" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Deployment & Operations</text>
    
    <rect x="735" y="340" width="250" height="40" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="860" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">OpenShift GitOps (ArgoCD)</text>
    
    <rect x="735" y="390" width="250" height="40" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="860" y="415" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Azure Red Hat OpenShift (ARO)</text>
    
    <rect x="735" y="440" width="250" height="40" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="860" y="465" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Azure Monitor / Azure Log Analytics</text>
    
    <!-- Component Connections -->
    <line x1="200" y1="180" x2="200" y2="300" stroke="#0066cc" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="450" y1="180" x2="530" y2="300" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="950" y1="180" x2="860" y2="300" stroke="#0078d4" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Bottom Note -->
    <rect x="100" y="530" width="1000" height="50" stroke="#333333" stroke-width="1" fill="#ffffcc" rx="5" ry="5"/>
    <text x="600" y="560" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">
        Three Horizons combines Azure, Red Hat, and GitHub tools to create a seamless developer experience from code to production
    </text>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
</svg> 