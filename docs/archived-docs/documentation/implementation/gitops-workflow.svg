<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons GitOps Workflow</text>
    <text x="600" y="70" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">Continuous Deployment Pattern</text>
    
    <!-- Flow Diagram -->
    <!-- GitHub Section -->
    <rect x="100" y="100" width="300" height="600" stroke="#333333" stroke-width="2" fill="#f5f5f5" rx="10" ry="10"/>
    <text x="250" y="130" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">GitHub</text>
    
    <!-- Source Repository -->
    <rect x="130" y="150" width="240" height="120" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="175" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Source Repository</text>
    
    <rect x="145" y="190" width="210" height="70" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Application Code</text>
    <text x="250" y="240" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">CI Workflows</text>
    
    <!-- Config Repository -->
    <rect x="130" y="290" width="240" height="120" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="315" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Config Repository</text>
    
    <rect x="145" y="330" width="210" height="70" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="355" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Kubernetes Manifests</text>
    <text x="250" y="380" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Environment Configs</text>
    
    <!-- CI Process -->
    <rect x="130" y="430" width="240" height="120" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="455" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Actions</text>
    
    <rect x="145" y="470" width="210" height="70" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="495" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Build & Test</text>
    <text x="250" y="520" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Container Image Creation</text>
    
    <!-- GitOps PR Process -->
    <rect x="130" y="570" width="240" height="100" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="595" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitOps PRs</text>
    
    <rect x="145" y="610" width="210" height="45" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="638" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Config Update PRs</text>
    
    <!-- GitOps Operator Section -->
    <rect x="450" y="100" width="300" height="600" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="10" ry="10"/>
    <text x="600" y="130" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#cc0000">GitOps Controller</text>
    
    <!-- GitOps Components -->
    <rect x="480" y="150" width="240" height="90" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="180" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">OpenShift GitOps</text>
    <text x="600" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">(ArgoCD)</text>
    
    <rect x="480" y="260" width="240" height="90" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="290" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Git Repository Sync</text>
    <text x="600" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Config Monitoring</text>
    
    <rect x="480" y="370" width="240" height="90" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="400" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Desired State</text>
    <text x="600" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Environment Configuration</text>
    
    <rect x="480" y="480" width="240" height="90" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="510" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Reconciliation</text>
    <text x="600" y="535" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Change Detection & Apply</text>
    
    <rect x="480" y="590" width="240" height="90" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="620" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Status Reporting</text>
    <text x="600" y="645" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Sync Status & Health</text>
    
    <!-- Kubernetes Cluster Section -->
    <rect x="800" y="100" width="300" height="600" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="950" y="130" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#0078d4">Kubernetes Cluster</text>
    
    <!-- Cluster Components -->
    <rect x="830" y="150" width="240" height="90" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="180" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Dev Environment</text>
    <text x="950" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Developer Namespaces</text>
    
    <rect x="830" y="260" width="240" height="90" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="290" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Test Environment</text>
    <text x="950" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">QA Namespaces</text>
    
    <rect x="830" y="370" width="240" height="90" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="400" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Staging Environment</text>
    <text x="950" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Pre-Production Namespaces</text>
    
    <rect x="830" y="480" width="240" height="90" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="510" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Production Environment</text>
    <text x="950" y="535" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Production Namespaces</text>
    
    <rect x="830" y="590" width="240" height="90" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="620" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Actual State</text>
    <text x="950" y="645" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Running Applications</text>
    
    <!-- Connection Lines -->
    <!-- Developer to Source Repository -->
    <circle cx="50" y="195" r="30" fill="#333333" opacity="0.2"/>
    <text x="50" y="200" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Dev</text>
    <path d="M 80 195 L 130 195" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="105" y="185" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">1. Write Code</text>
    
    <!-- Source Repository to CI Process -->
    <path d="M 250 240 L 250 430" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="270" y="350" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">2. Trigger CI</text>
    
    <!-- CI Process to Container Registry -->
    <rect x="450" y="30" width="300" height="50" stroke="#0078d4" stroke-width="1" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="600" y="60" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Container Registry</text>
    <path d="M 250 470 L 400 470 L 400 60 L 450 60" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="365" y="450" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">3. Push Image</text>
    
    <!-- CI Process to Config Repository via PR -->
    <path d="M 250 520 L 420 520 L 420 630 L 355 630" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="400" y="550" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">4. Update Config</text>
    
    <!-- Config Repository to GitOps Controller -->
    <path d="M 370 355 L 480 355" stroke="#cc0000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="425" y="340" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000">5. Monitor</text>
    
    <!-- GitOps Controller to Kubernetes Cluster -->
    <path d="M 720 300 L 830 300" stroke="#cc0000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="775" y="285" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000">6a. Test</text>
    
    <path d="M 720 415 L 830 415" stroke="#cc0000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="775" y="400" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000">6b. Staging</text>
    
    <path d="M 720 525 L 830 y="525" stroke="#cc0000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="775" y="510" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000">6c. Production</text>
    
    <!-- Kubernetes Cluster to GitOps Controller (Status) -->
    <path d="M 830 635 L 720 635" stroke="#0078d4" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="775" y="650" font-family="Arial" font-size="10" text-anchor="middle" fill="#0078d4">7. Status</text>
    
    <!-- Container Registry to Kubernetes Cluster -->
    <path d="M 750 60 L 950 60 L 950 150" stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="850" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#0078d4">Deploy Images</text>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Key Benefits -->
    <rect x="450" y="720" width="300" height="60" stroke="#333333" stroke-width="1" fill="#ffffcc" rx="5" ry="5"/>
    <text x="600" y="740" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitOps Key Benefits</text>
    <text x="600" y="765" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Declarative | Versioned | Immutable | Automated | Self-healing</text>
    
    <!-- Legend -->
    <rect x="950" y="720" width="15" height="15" fill="#333333"/>
    <text x="970" y="733" font-family="Arial" font-size="10" text-anchor="start" fill="#333">GitHub Processes</text>
    
    <rect x="950" y="745" width="15" height="15" fill="#cc0000"/>
    <text x="970" y="758" font-family="Arial" font-size="10" text-anchor="start" fill="#333">GitOps Controller</text>
    
    <rect x="950" y="770" width="15" height="15" fill="#0078d4"/>
    <text x="970" y="783" font-family="Arial" font-size="10" text-anchor="start" fill="#333">Kubernetes Cluster</text>
</svg> 