<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Golden Paths</text>
    <text x="600" y="70" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">Standardized Developer Workflows and Best Practices</text>
    
    <!-- Golden Path Layers -->
    <path d="M 100 150 L 1100 150 L 1000 650 L 200 650 Z" fill="#f0f5ff" stroke="#0078d4" stroke-width="2"/>
    
    <!-- Layer 1: Inner Loop -->
    <rect x="200" y="200" width="800" height="90" stroke="#0066cc" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="600" y="240" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#0066cc">Inner Loop Development Golden Path</text>
    <text x="600" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Local development, testing, and debugging standards</text>
    
    <!-- Layer 1 Components -->
    <rect x="230" y="300" width="140" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="300" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Code Standards</text>
    
    <rect x="390" y="300" width="140" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="460" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">IDE Setup</text>
    
    <rect x="550" y="300" width="140" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="620" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Local Testing</text>
    
    <rect x="710" y="300" width="140" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="780" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Debugging Tools</text>
    
    <rect x="870" y="300" width="100" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="920" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Templates</text>
    
    <!-- Layer 2: Integration -->
    <rect x="250" y="370" width="700" height="90" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="600" y="410" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#cc0000">Integration Golden Path</text>
    <text x="600" y="440" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Code integration, review, and quality assurance workflow</text>
    
    <!-- Layer 2 Components -->
    <rect x="280" y="470" width="140" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="350" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Pull Request Flow</text>
    
    <rect x="430" y="470" width="140" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="500" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Code Review Process</text>
    
    <rect x="580" y="470" width="140" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="650" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">CI/CD Workflow</text>
    
    <rect x="730" y="470" width="180" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="820" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Quality Gate Requirements</text>
    
    <!-- Layer 3: Deployment -->
    <rect x="300" y="540" width="600" height="90" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="600" y="580" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#0078d4">Deployment Golden Path</text>
    <text x="600" y="610" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Application deployment, monitoring, and operations</text>
    
    <!-- Layer 3 Components -->
    <rect x="330" y="640" width="120" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="390" y="670" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Environments</text>
    
    <rect x="460" y="640" width="120" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="520" y="670" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">GitOps Process</text>
    
    <rect x="590" y="640" width="120" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="650" y="670" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Monitoring</text>
    
    <rect x="720" y="640" width="150" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="795" y="670" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Security Compliance</text>
    
    <!-- Red Hat Developer Hub -->
    <rect x="100" y="700" width="1000" height="60" stroke="#333333" stroke-width="2" fill="#ffffcc" rx="10" ry="10"/>
    <text x="600" y="730" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Red Hat Developer Hub - Central Platform for Developer Experience</text>
    <text x="600" y="750" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Software Catalog | Templates | Documentation | Self-Service Portal</text>
    
    <!-- Golden Path Sources -->
    <rect x="100" y="120" width="200" height="30" fill="#0066cc" rx="5" ry="5"/>
    <text x="200" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Development Standards</text>
    
    <rect x="330" y="120" width="200" height="30" fill="#cc0000" rx="5" ry="5"/>
    <text x="430" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">GitHub Best Practices</text>
    
    <rect x="560" y="120" width="200" height="30" fill="#0078d4" rx="5" ry="5"/>
    <text x="660" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Azure/ARO Best Practices</text>
    
    <rect x="790" y="120" width="200" height="30" fill="#333333" rx="5" ry="5"/>
    <text x="890" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Industry Best Practices</text>
    
    <!-- Legend -->
    <rect x="1130" y="200" width="15" height="15" fill="#0066cc"/>
    <text x="1150" y="213" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Inner Loop</text>
    
    <rect x="1130" y="225" width="15" height="15" fill="#cc0000"/>
    <text x="1150" y="238" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Integration Path</text>
    
    <rect x="1130" y="250" width="15" height="15" fill="#0078d4"/>
    <text x="1150" y="263" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Deployment Path</text>
    
    <rect x="1130" y="275" width="15" height="15" fill="#ffffcc"/>
    <text x="1150" y="288" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Platform Foundation</text>
    
    <!-- Connections -->
    <path d="M 600 290 L 600 370" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 600 460 L 600 540" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 600 630 L 600 700" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
</svg> 