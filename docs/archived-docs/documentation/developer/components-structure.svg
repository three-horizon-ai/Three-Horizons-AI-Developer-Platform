    <text x="195" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Main web interface</text>
    
    <rect x="290" y="190" width="150" height="70" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
