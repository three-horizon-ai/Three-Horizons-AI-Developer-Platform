    <line x1="600" y1="500" x2="600" y2="520" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="600" y1="650" x2="600" y2="670" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    
