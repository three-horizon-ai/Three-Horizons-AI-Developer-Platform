    <text x="365" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Sidebar & global nav</text>
    
    <rect x="460" y="190" width="150" height="70" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
    <text x="535" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Search</text>
    <text x="535" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Global search UI</text>
    
    <rect x="630" y="190" width="150" height="70" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
