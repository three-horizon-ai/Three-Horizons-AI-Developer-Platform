    <text x="45" y="450" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90,45,450)">External Integrations</text>
    
    <!-- GitHub Integration -->
    <rect x="1120" y="230" width="70" height="80" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
    <text x="1155" y="270" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90,1155,270)">GitHub</text>
    <line x1="1110" y1="270" x2="1119" y2="270" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Azure Integration -->
    <rect x="1120" y="320" width="70" height="80" stroke="#0078d4" stroke-width="1" fill="#f0f5ff" rx="5" ry="5"/>
    <text x="1155" y="360" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90,1155,360)">Azure</text>
    <line x1="1110" y1="360" x2="1119" y2="360" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- OpenShift Integration -->
    <rect x="1120" y="410" width="70" height="80" stroke="#cc0000" stroke-width="1" fill="#fff5f5" rx="5" ry="5"/>
    <text x="1155" y="450" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90,1155,450)">OpenShift</text>
    <line x1="1110" y1="450" x2="1119" y2="450" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Identity Integration -->
    <rect x="1120" y="500" width="70" height="80" stroke="#666666" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
    <text x="1155" y="540" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90,1155,540)">AAD / RH-SSO</text>
    <line x1="1110" y1="540" x2="1119" y2="540" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Legend -->
    <rect x="1120" y="130" width="15" height="15" fill="#333333"/>
    <text x="1140" y="143" font-family="Arial" font-size="10" text-anchor="start" fill="#333">UI Layer</text>
    
    <rect x="1120" y="150" width="15" height="15" fill="#0066cc"/>
    <text x="1140" y="163" font-family="Arial" font-size="10" text-anchor="start" fill="#333">Plugin Layer</text>
    
    <rect x="1120" y="170" width="15" height="15" fill="#0078d4"/>
    <text x="1140" y="183" font-family="Arial" font-size="10" text-anchor="start" fill="#333">Backend Layer</text>
    
    <rect x="1120" y="190" width="15" height="15" fill="#f5f5f5"/>
    <text x="1140" y="203" font-family="Arial" font-size="10" text-anchor="start" fill="#333">Infrastructure</text>
</svg> 