    <rect x="630" y="680" width="160" height="40" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
    <text x="710" y="705" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Networking & Routes</text>
    
    <rect x="800" y="680" width="160" height="40" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
    <text x="880" y="705" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Monitoring & Logging</text>
    
    <rect x="970" y="680" width="110" height="40" stroke="#333333" stroke-width="1" fill="#f5f5f5" rx="5" ry="5"/>
