<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Red Hat Developer Hub Component Structure</text>
    <text x="600" y="70" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">Three Horizons Implementation</text>
    
    <!-- Hub Main Container -->
