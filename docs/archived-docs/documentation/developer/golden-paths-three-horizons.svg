<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800">
    <!-- Background -->
    <rect width="1300" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="650" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Framework</text>
    <text x="650" y="70" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">Innovation and Strategic Business Growth</text>
    
    <!-- Horizons Framework -->
    <path d="M 100 150 L 1100 150 L 1000 650 L 200 650 Z" fill="#f0f5ff" stroke="#0078d4" stroke-width="2"/>
    
    <!-- Horizon 1 -->
    <rect x="200" y="200" width="800" height="110" stroke="#0066cc" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="600" y="240" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#0066cc">Horizon 1: Core Business</text>
    <text x="600" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Maintaining and extending current business models and processes</text>
    
    <!-- Horizon 1 Components -->
    <rect x="230" y="300" width="170" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="315" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Operational Excellence</text>
    
    <rect x="420" y="300" width="170" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="505" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Current Products & Services</text>
    
    <rect x="610" y="300" width="170" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="695" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Process Improvement</text>
    
    <rect x="800" y="300" width="170" height="50" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="885" y="330" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Efficiency Initiatives</text>
    
    <!-- Horizon 2 -->
    <rect x="250" y="370" width="700" height="110" stroke="#cc0000" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="600" y="410" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#cc0000">Horizon 2: Emerging Opportunities</text>
    <text x="600" y="440" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Developing new business models and capabilities with growth potential</text>
    
    <!-- Horizon 2 Components -->
    <rect x="280" y="470" width="155" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="357" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">New Business Models</text>
    
    <rect x="455" y="470" width="155" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="532" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Market Expansion</text>
    
    <rect x="630" y="470" width="155" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="707" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Growth Initiatives</text>
    
    <rect x="805" y="470" width="155" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="882" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Emerging Technologies</text>
    
    <!-- Horizon 3 -->
    <rect x="300" y="540" width="600" height="110" stroke="#0078d4" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="600" y="580" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#0078d4">Horizon 3: Future Growth</text>
    <text x="600" y="610" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Creating options for future business through disruptive innovations</text>
    
    <!-- Horizon 3 Components -->
    <rect x="330" y="640" width="135" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="397" y="670" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Disruptive Innovation</text>
    
    <rect x="475" y="640" width="135" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="542" y="670" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Research & Discovery</text>
    
    <rect x="620" y="640" width="135" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="687" y="670" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Strategic Ventures</text>
    
    <rect x="765" y="640" width="135" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="832" y="670" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Future Technologies</text>
    
    <!-- Foundation -->
    <rect x="100" y="700" width="1000" height="60" stroke="#333333" stroke-width="2" fill="#ffffcc" rx="10" ry="10"/>
    <text x="600" y="730" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Organizational Capabilities & Strategic Framework</text>
    <text x="600" y="750" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Leadership | Resources | Talent | Culture | Investment Strategy</text>
    
    <!-- Business Focus Areas -->
    <rect x="100" y="120" width="200" height="30" fill="#0066cc" rx="5" ry="5"/>
    <text x="200" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Present | 0-1 Years</text>
    
    <rect x="330" y="120" width="200" height="30" fill="#cc0000" rx="5" ry="5"/>
    <text x="430" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Near Future | 1-3 Years</text>
    
    <rect x="560" y="120" width="200" height="30" fill="#0078d4" rx="5" ry="5"/>
    <text x="660" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Future | 3-5+ Years</text>
    
    <rect x="790" y="120" width="200" height="30" fill="#333333" rx="5" ry="5"/>
    <text x="890" y="140" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Strategic Portfolio Balance</text>
    
    <!-- Legend -->
    <rect x="1130" y="200" width="15" height="15" fill="#0066cc"/>
    <text x="1150" y="213" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Horizon 1</text>
    
    <rect x="1130" y="225" width="15" height="15" fill="#cc0000"/>
    <text x="1150" y="238" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Horizon 2</text>
    
    <rect x="1130" y="250" width="15" height="15" fill="#0078d4"/>
    <text x="1150" y="263" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Horizon 3</text>
    
    <rect x="1130" y="275" width="15" height="15" fill="#ffffcc"/>
    <text x="1150" y="288" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Core Capabilities</text>
    
    <!-- Connections -->
    <path d="M 600 310 L 600 370" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 600 480 L 600 540" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 600 650 L 600 700" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow Definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
</svg>