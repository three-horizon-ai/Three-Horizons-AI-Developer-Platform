<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f7f7f7"/>
  
  <!-- Title -->
  <text x="400" y="50" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#333">Three Horizons Framework</text>
  
  <!-- Horizon 1 -->
  <rect x="100" y="100" width="600" height="100" fill="#e6f0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="400" y="150" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0066cc">Horizon 1: Core Business</text>
  
  <!-- Horizon 2 -->
  <rect x="100" y="250" width="600" height="100" fill="#fff0f0" stroke="#cc0000" stroke-width="2"/>
  <text x="400" y="300" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#cc0000">Horizon 2: Emerging Opportunities</text>
  
  <!-- Horizon 3 -->
  <rect x="100" y="400" width="600" height="100" fill="#f0f8ff" stroke="#0078d4" stroke-width="2"/>
  <text x="400" y="450" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0078d4">Horizon 3: Future Growth</text>
  
  <!-- Connection lines -->
  <line x1="400" y1="200" x2="400" y2="250" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="350" x2="400" y2="400" stroke="#666" stroke-width="2"/>
</svg>