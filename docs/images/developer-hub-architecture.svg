<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .section-title { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; font-weight: bold; fill: white; }
      .component-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; fill: white; }
      .legend-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 11px; fill: #34495e; }
      .github-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; font-weight: bold; fill: white; }
      
      /* Gradients */
      .catalog-gradient { fill: linear-gradient(135deg, #3498db, #2980b9); }
      .template-gradient { fill: linear-gradient(135deg, #27ae60, #229954); }
      .plugin-gradient { fill: linear-gradient(135deg, #8e44ad, #7d3c98); }
      .portal-gradient { fill: linear-gradient(135deg, #e67e22, #d35400); }
      .header-gradient { fill: linear-gradient(135deg, #e74c3c, #c0392b); }
      .github-gradient { fill: linear-gradient(135deg, #2c3e50, #34495e); }
      
      /* Shadows */
      .shadow { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
      
      /* Animations */
      .hover-animation { transition: transform 0.3s ease; }
      .hover-animation:hover { transform: scale(1.02); }
      
      /* Modern card styles */
      .modern-card { rx: 8; ry: 8; }
      .component-card { rx: 4; ry: 4; }
    </style>
    
    <!-- Gradients -->
    <linearGradient id="catalogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="templateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pluginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7d3c98;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="githubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Main container -->
  <rect x="50" y="50" width="900" height="600" fill="white" class="modern-card shadow" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Title -->
  <text x="500" y="90" text-anchor="middle" class="title-text">Red Hat Developer Hub Architecture</text>
  <text x="500" y="110" text-anchor="middle" class="legend-text" style="font-size: 14px;">Three Horizons AI Development Platform</text>
  
  <!-- Header - Red Hat Developer Hub -->
  <rect x="100" y="140" width="800" height="60" fill="url(#headerGrad)" class="modern-card shadow"/>
  <text x="500" y="175" text-anchor="middle" class="section-title" style="font-size: 20px;">Red Hat Developer Hub 1.5</text>
  
  <!-- Component Catalog (Blue) -->
  <rect x="120" y="230" width="180" height="150" fill="url(#catalogGrad)" class="modern-card shadow hover-animation"/>
  <text x="210" y="255" text-anchor="middle" class="section-title">Component Catalog</text>
  
  <!-- Component items -->
  <rect x="135" y="270" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="170" y="287" text-anchor="middle" class="component-text">API Services</text>
  <rect x="215" y="270" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="250" y="287" text-anchor="middle" class="component-text">Web Services</text>
  <rect x="135" y="305" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="170" y="322" text-anchor="middle" class="component-text">Libraries</text>
  <rect x="215" y="305" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="250" y="322" text-anchor="middle" class="component-text">Databases</text>
  <rect x="135" y="340" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="170" y="357" text-anchor="middle" class="component-text">Microservices</text>
  <rect x="215" y="340" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="250" y="357" text-anchor="middle" class="component-text">AI Models</text>
  
  <!-- Template Library (Green) -->
  <rect x="320" y="230" width="180" height="150" fill="url(#templateGrad)" class="modern-card shadow hover-animation"/>
  <text x="410" y="255" text-anchor="middle" class="section-title">Template Library</text>
  
  <!-- Template items -->
  <rect x="335" y="270" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="370" y="287" text-anchor="middle" class="component-text">React App</text>
  <rect x="415" y="270" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="450" y="287" text-anchor="middle" class="component-text">Spring Boot</text>
  <rect x="335" y="305" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="370" y="322" text-anchor="middle" class="component-text">Python API</text>
  <rect x="415" y="305" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="450" y="322" text-anchor="middle" class="component-text">Microservice</text>
  <rect x="335" y="340" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="370" y="357" text-anchor="middle" class="component-text">AI Workflow</text>
  <rect x="415" y="340" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="450" y="357" text-anchor="middle" class="component-text">MLOps</text>
  
  <!-- Plugin Ecosystem (Purple) -->
  <rect x="520" y="230" width="180" height="150" fill="url(#pluginGrad)" class="modern-card shadow hover-animation"/>
  <text x="610" y="255" text-anchor="middle" class="section-title">Plugin Ecosystem</text>
  
  <!-- Plugin items -->
  <rect x="535" y="270" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="570" y="287" text-anchor="middle" class="component-text">GitHub</text>
  <rect x="615" y="270" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="650" y="287" text-anchor="middle" class="component-text">Azure</text>
  <rect x="535" y="305" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="570" y="322" text-anchor="middle" class="component-text">Kubernetes</text>
  <rect x="615" y="305" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="650" y="322" text-anchor="middle" class="component-text">Argo CD</text>
  <rect x="535" y="340" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="570" y="357" text-anchor="middle" class="component-text">TechDocs</text>
  <rect x="615" y="340" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="650" y="357" text-anchor="middle" class="component-text">Copilot</text>
  
  <!-- Developer Portal (Orange) -->
  <rect x="720" y="230" width="180" height="150" fill="url(#portalGrad)" class="modern-card shadow hover-animation"/>
  <text x="810" y="255" text-anchor="middle" class="section-title">Developer Portal</text>
  
  <!-- Portal items -->
  <rect x="735" y="270" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="770" y="287" text-anchor="middle" class="component-text">Documentation</text>
  <rect x="815" y="270" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="850" y="287" text-anchor="middle" class="component-text">Golden Paths</text>
  <rect x="735" y="305" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="770" y="322" text-anchor="middle" class="component-text">Scorecards</text>
  <rect x="815" y="305" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="850" y="322" text-anchor="middle" class="component-text">Service Catalog</text>
  <rect x="735" y="340" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="770" y="357" text-anchor="middle" class="component-text">API Docs</text>
  <rect x="815" y="340" width="70" height="25" fill="rgba(255,255,255,0.2)" class="component-card"/>
  <text x="850" y="357" text-anchor="middle" class="component-text">AI Assistant</text>
  
  <!-- Connection arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Horizontal connection lines -->
  <line x1="300" y1="305" x2="320" y2="305" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="305" x2="520" y2="305" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="305" x2="720" y2="305" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- GitHub Enterprise section -->
  <rect x="300" y="420" width="400" height="50" fill="url(#githubGrad)" class="modern-card shadow"/>
  <text x="500" y="450" text-anchor="middle" class="github-text">GitHub Enterprise + GitHub Copilot</text>
  
  <!-- Connection from RHDH to GitHub -->
  <line x1="500" y1="400" x2="500" y2="420" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Microsoft Azure section -->
  <rect x="100" y="500" width="800" height="50" fill="#0078d4" class="modern-card shadow"/>
  <text x="500" y="530" text-anchor="middle" class="section-title" style="font-size: 18px;">Microsoft Azure (AKS/ARO + AI Services)</text>
  
  <!-- Connection from GitHub to Azure -->
  <line x1="500" y1="470" x2="500" y2="500" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="100" y="580" width="300" height="80" fill="#ecf0f1" class="modern-card" stroke="#bdc3c7" stroke-width="1"/>
  <text x="110" y="600" class="legend-text" style="font-weight: bold;">Three Horizons Components:</text>
  
  <!-- Legend items -->
  <rect x="110" y="610" width="15" height="15" fill="url(#catalogGrad)"/>
  <text x="135" y="622" class="legend-text">Software Catalog & APIs</text>
  
  <rect x="110" y="635" width="15" height="15" fill="url(#templateGrad)"/>
  <text x="135" y="647" class="legend-text">Golden Path Templates</text>
  
  <rect x="250" y="610" width="15" height="15" fill="url(#pluginGrad)"/>
  <text x="275" y="622" class="legend-text">Integrations & Plugins</text>
  
  <rect x="250" y="635" width="15" height="15" fill="url(#portalGrad)"/>
  <text x="275" y="647" class="legend-text">Developer Experience</text>
  
  <!-- AI Enhancement badge -->
  <rect x="750" y="580" width="150" height="30" fill="#f39c12" class="modern-card shadow"/>
  <text x="825" y="600" text-anchor="middle" class="section-title" style="font-size: 12px;">AI-Enhanced Platform</text>
  
</svg> 