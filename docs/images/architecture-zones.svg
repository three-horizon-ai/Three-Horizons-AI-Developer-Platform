<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
    <!-- Background -->
    <rect width="1200" height="700" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Architecture Zones</text>
    
    <!-- Development Zone -->
    <rect x="100" y="80" width="300" height="550" stroke="#0066cc" stroke-width="3" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="250" y="120" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#0066cc">Development Zone</text>
    <text x="250" y="145" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#666">(Inner Loop)</text>
    
    <!-- Development Tools -->
    <rect x="130" y="170" width="240" height="60" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Codespaces</text>
    
    <rect x="130" y="240" width="240" height="60" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="275" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Copilot</text>
    
    <rect x="130" y="310" width="240" height="60" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="345" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">VS Code / IDEs</text>
    
    <rect x="130" y="380" width="240" height="60" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="415" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Developer Hub Templates</text>
    
    <rect x="130" y="450" width="240" height="60" stroke="#0066cc" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="250" y="485" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Local Testing Tools</text>
    
    <text x="250" y="560" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Developer Workstations</text>
    <text x="250" y="580" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">& Cloud Environments</text>
    
    <!-- Integration Zone -->
    <rect x="450" y="80" width="300" height="550" stroke="#cc0000" stroke-width="3" fill="#fff5f5" rx="10" ry="10"/>
    <text x="600" y="120" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#cc0000">Integration Zone</text>
    <text x="600" y="145" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#666">(CI/CD Pipeline)</text>
    
    <!-- Integration Tools -->
    <rect x="480" y="170" width="240" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Actions</text>
    
    <rect x="480" y="240" width="240" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="275" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Pull Requests</text>
    
    <rect x="480" y="310" width="240" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="345" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Automated Testing</text>
    
    <rect x="480" y="380" width="240" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="415" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Container Builds</text>
    
    <rect x="480" y="450" width="240" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="485" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Security Scanning</text>
    
    <text x="600" y="560" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">GitHub Enterprise</text>
    <text x="600" y="580" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">& Azure DevOps</text>
    
    <!-- Runtime Zone -->
    <rect x="800" y="80" width="300" height="550" stroke="#0078d4" stroke-width="3" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="950" y="120" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#0078d4">Runtime Zone</text>
    <text x="950" y="145" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#666">(Outer Loop)</text>
    
    <!-- Runtime Tools -->
    <rect x="830" y="170" width="240" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="205" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Red Hat OpenShift</text>
    
    <rect x="830" y="240" width="240" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="275" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Kubernetes Service</text>
    
    <rect x="830" y="310" width="240" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="345" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">OpenShift GitOps</text>
    
    <rect x="830" y="380" width="240" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="415" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Monitor</text>
    
    <rect x="830" y="450" width="240" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="950" y="485" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Log Analytics</text>
    
    <text x="950" y="560" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Microsoft Azure Cloud</text>
    <text x="950" y="580" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Infrastructure</text>
    
    <!-- Connecting Arrows -->
    <!-- Development to Integration -->
    <path d="M 400 200 L 480 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 400 270 L 480 270" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 400 400 L 480 400" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Integration to Runtime -->
    <path d="M 720 200 L 830 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 720 400 L 830 400" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 720 340 L 830 340" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Feedback Loop -->
    <path d="M 830 480 C 600 650 400 650 250 510" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="600" y="650" font-family="Arial" font-size="14" font-style="italic" text-anchor="middle" fill="#666">Feedback Loop</text>
    
    <!-- Developer Hub Connecting All Zones -->
    <rect x="100" y="650" width="1000" height="40" stroke="#333" stroke-width="2" fill="#e6e6e6" rx="5" ry="5"/>
    <text x="600" y="675" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Red Hat Developer Hub (Central Developer Portal)</text>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
</svg> 