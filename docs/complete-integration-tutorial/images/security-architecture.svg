<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and styling -->
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap');
      text {
        font-family: 'Roboto', sans-serif;
        fill: #333333;
      }
      .title {
        font-size: 24px;
        font-weight: bold;
        text-anchor: middle;
      }
      .subtitle {
        font-size: 14px;
        font-weight: normal;
        text-anchor: middle;
      }
      .layer-title {
        font-size: 18px;
        font-weight: bold;
        text-anchor: middle;
      }
      .component-title {
        font-size: 12px;
        font-weight: bold;
      }
      .component-text {
        font-size: 10px;
      }
      .zero-trust-text {
        font-size: 16px;
        fill: white;
        font-weight: bold;
        text-anchor: middle;
      }
      .border-text {
        font-size: 12px;
        fill: #666666;
        font-weight: bold;
        text-anchor: middle;
        writing-mode: tb;
      }
      .legend-title {
        font-size: 12px;
        font-weight: bold;
      }
      .legend-text {
        font-size: 10px;
      }
      .compliance-text {
        font-size: 10px;
        font-weight: bold;
        fill: white;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background rectangle -->
  <rect width="900" height="700" fill="#f8f9fa" />

  <!-- Title -->
  <text x="450" y="35" class="title">Three Horizons Platform - Security Architecture (v1.0, April 2025)</text>

  <!-- Zero Trust Banner -->
  <rect x="150" y="55" width="600" height="30" rx="5" fill="#222222" />
  <text x="450" y="75" class="zero-trust-text">Zero Trust Security Model</text>

  <!-- Platform Icons -->
  <circle cx="350" cy="75" r="15" fill="#0078d4" /> <!-- Azure -->
  <text x="350" y="79" font-size="12" fill="white" text-anchor="middle">A</text>
  
  <circle cx="450" cy="75" r="15" fill="#ee0000" /> <!-- RHDH -->
  <text x="450" y="79" font-size="12" fill="white" text-anchor="middle">R</text>
  
  <circle cx="550" cy="75" r="15" fill="#6f42c1" /> <!-- GitHub -->
  <text x="550" y="79" font-size="12" fill="white" text-anchor="middle">G</text>

  <!-- Side borders with labels -->
  <rect x="120" y="100" width="20" height="500" fill="#e9ecef" />
  <text x="130" y="350" class="border-text">Trusted Security Boundary</text>
  
  <rect x="760" y="100" width="20" height="500" fill="#e9ecef" />
  <text x="770" y="350" class="border-text">Trusted Security Boundary</text>

  <!-- Identity and Access Management Layer -->
  <rect x="150" y="100" width="600" height="100" fill="#cfe2ff" rx="5" />
  <text x="450" y="125" class="layer-title">Identity and Access Management</text>

  <!-- Network Security Layer -->
  <rect x="150" y="210" width="600" height="100" fill="#fff3cd" rx="5" />
  <text x="450" y="235" class="layer-title">Network Security</text>

  <!-- Platform Security Layer -->
  <rect x="150" y="320" width="600" height="100" fill="#e2d9f3" rx="5" />
  <text x="450" y="345" class="layer-title">Platform Security</text>

  <!-- Data Security Layer -->
  <rect x="150" y="430" width="600" height="100" fill="#d1e7dd" rx="5" />
  <text x="450" y="455" class="layer-title">Data Security</text>

  <!-- Monitoring and Auditing Layer -->
  <rect x="150" y="540" width="600" height="100" fill="#f8d7da" rx="5" />
  <text x="450" y="565" class="layer-title">Monitoring and Auditing</text>

  <!-- Components for Identity Layer -->
  <rect x="170" y="140" width="125" height="50" fill="white" stroke="#0078d4" stroke-width="2" rx="3" />
  <text x="175" y="155" class="component-title">Microsoft Entra ID</text>
  <text x="175" y="170" class="component-text">Identity Provider</text>
  <text x="175" y="185" class="component-text">SSO & Conditional Access</text>

  <rect x="315" y="140" width="125" height="50" fill="white" stroke="#0078d4" stroke-width="2" rx="3" />
  <text x="320" y="155" class="component-title">Managed Identities</text>
  <text x="320" y="170" class="component-text">Service Authentication</text>
  <text x="320" y="185" class="component-text">No Credential Management</text>

  <rect x="460" y="140" width="125" height="50" fill="white" stroke="#0078d4" stroke-width="2" rx="3" />
  <text x="465" y="155" class="component-title">Workload Identity</text>
  <text x="465" y="170" class="component-text">Federated Credentials</text>
  <text x="465" y="185" class="component-text">OIDC Token Exchange</text>

  <rect x="605" y="140" width="125" height="50" fill="white" stroke="#0078d4" stroke-width="2" rx="3" />
  <text x="610" y="155" class="component-title">Multi-Factor Auth</text>
  <text x="610" y="170" class="component-text">Strong Authentication</text>
  <text x="610" y="185" class="component-text">Passwordless Options</text>

  <!-- Components for Network Layer -->
  <rect x="170" y="250" width="125" height="50" fill="white" stroke="#ffc107" stroke-width="2" rx="3" />
  <text x="175" y="265" class="component-title">NSGs/Firewall</text>
  <text x="175" y="280" class="component-text">Traffic Filtering</text>
  <text x="175" y="295" class="component-text">Azure Firewall Policy</text>

  <rect x="315" y="250" width="125" height="50" fill="white" stroke="#ffc107" stroke-width="2" rx="3" />
  <text x="320" y="265" class="component-title">Private Endpoints</text>
  <text x="320" y="280" class="component-text">PaaS Service Protection</text>
  <text x="320" y="295" class="component-text">No Public Internet Access</text>

  <rect x="460" y="250" width="125" height="50" fill="white" stroke="#ffc107" stroke-width="2" rx="3" />
  <text x="465" y="265" class="component-title">Network Policies</text>
  <text x="465" y="280" class="component-text">Pod Traffic Control</text>
  <text x="465" y="295" class="component-text">Micro-segmentation</text>

  <rect x="605" y="250" width="125" height="50" fill="white" stroke="#ffc107" stroke-width="2" rx="3" />
  <text x="610" y="265" class="component-title">TLS & mTLS</text>
  <text x="610" y="280" class="component-text">Encrypted Transit</text>
  <text x="610" y="295" class="component-text">Service Authentication</text>

  <!-- Components for Platform Layer -->
  <rect x="170" y="360" width="125" height="50" fill="white" stroke="#6f42c1" stroke-width="2" rx="3" />
  <text x="175" y="375" class="component-title">AKS/ARO Security</text>
  <text x="175" y="390" class="component-text">Microsoft Defender</text>
  <text x="175" y="405" class="component-text">Host Security</text>

  <rect x="315" y="360" width="125" height="50" fill="white" stroke="#6f42c1" stroke-width="2" rx="3" />
  <text x="320" y="375" class="component-title">K8s RBAC & Pod Security</text>
  <text x="320" y="390" class="component-text">Role-Based Access</text>
  <text x="320" y="405" class="component-text">Pod Security Standards</text>

  <rect x="460" y="360" width="125" height="50" fill="white" stroke="#6f42c1" stroke-width="2" rx="3" />
  <text x="465" y="375" class="component-title">GitHub Adv. Security</text>
  <text x="465" y="390" class="component-text">Code Scanning</text>
  <text x="465" y="405" class="component-text">Secret Detection</text>

  <rect x="605" y="360" width="125" height="50" fill="white" stroke="#6f42c1" stroke-width="2" rx="3" />
  <text x="610" y="375" class="component-title">OPA/Gatekeeper</text>
  <text x="610" y="390" class="component-text">Policy Enforcement</text>
  <text x="610" y="405" class="component-text">Admission Control</text>

  <!-- Components for Data Layer -->
  <rect x="170" y="470" width="125" height="50" fill="white" stroke="#198754" stroke-width="2" rx="3" />
  <text x="175" y="485" class="component-title">Key Vault</text>
  <text x="175" y="500" class="component-text">Secrets Management</text>
  <text x="175" y="515" class="component-text">Centralized Key Storage</text>

  <rect x="315" y="470" width="125" height="50" fill="white" stroke="#198754" stroke-width="2" rx="3" />
  <text x="320" y="485" class="component-title">Encrypted Storage</text>
  <text x="320" y="500" class="component-text">Azure Storage</text>
  <text x="320" y="515" class="component-text">PostgreSQL Encryption</text>

  <rect x="460" y="470" width="125" height="50" fill="white" stroke="#198754" stroke-width="2" rx="3" />
  <text x="465" y="485" class="component-title">Image Scanning</text>
  <text x="465" y="500" class="component-text">Container Vulnerability</text>
  <text x="465" y="515" class="component-text">Build-time Scanning</text>

  <rect x="605" y="470" width="125" height="50" fill="white" stroke="#198754" stroke-width="2" rx="3" />
  <text x="610" y="485" class="component-title">Data Classification</text>
  <text x="610" y="500" class="component-text">Sensitive Data Protection</text>
  <text x="610" y="515" class="component-text">Information Protection</text>

  <!-- Components for Monitoring Layer -->
  <rect x="170" y="580" width="125" height="50" fill="white" stroke="#dc3545" stroke-width="2" rx="3" />
  <text x="175" y="595" class="component-title">Azure Monitor</text>
  <text x="175" y="610" class="component-text">Log Analytics</text>
  <text x="175" y="625" class="component-text">Unified Monitoring</text>

  <rect x="315" y="580" width="125" height="50" fill="white" stroke="#dc3545" stroke-width="2" rx="3" />
  <text x="320" y="595" class="component-title">Prometheus & Grafana</text>
  <text x="320" y="610" class="component-text">Metric Collection</text>
  <text x="320" y="625" class="component-text">Visualization</text>

  <rect x="460" y="580" width="125" height="50" fill="white" stroke="#dc3545" stroke-width="2" rx="3" />
  <text x="465" y="595" class="component-title">Defender for Cloud</text>
  <text x="465" y="610" class="component-text">Threat Protection</text>
  <text x="465" y="625" class="component-text">Security Posture</text>

  <rect x="605" y="580" width="125" height="50" fill="white" stroke="#dc3545" stroke-width="2" rx="3" />
  <text x="610" y="595" class="component-title">SIEM</text>
  <text x="610" y="610" class="component-text">Security Event Management</text>
  <text x="610" y="625" class="component-text">Incident Response</text>

  <!-- Connecting Lines -->
  <line x1="232" y1="190" x2="232" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="377" y1="190" x2="377" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="522" y1="190" x2="522" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="667" y1="190" x2="667" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />

  <line x1="232" y1="300" x2="232" y2="360" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="377" y1="300" x2="377" y2="360" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="522" y1="300" x2="522" y2="360" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="667" y1="300" x2="667" y2="360" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />

  <line x1="232" y1="410" x2="232" y2="470" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="377" y1="410" x2="377" y2="470" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="522" y1="410" x2="522" y2="470" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="667" y1="410" x2="667" y2="470" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />

  <line x1="232" y1="520" x2="232" y2="580" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="377" y1="520" x2="377" y2="580" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="522" y1="520" x2="522" y2="580" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />
  <line x1="667" y1="520" x2="667" y2="580" stroke="#666" stroke-width="1" stroke-dasharray="5,3" />

  <!-- Legend -->
  <rect x="170" y="640" width="160" height="50" fill="white" stroke="#dee2e6" stroke-width="1" rx="3" />
  <text x="175" y="655" class="legend-title">Security Layers</text>
  
  <circle cx="180" cy="670" r="5" fill="#cfe2ff" />
  <text x="190" y="673" class="legend-text">Identity and Access</text>
  
  <circle cx="270" cy="670" r="5" fill="#fff3cd" />
  <text x="280" y="673" class="legend-text">Network</text>
  
  <circle cx="180" cy="685" r="5" fill="#e2d9f3" />
  <text x="190" y="688" class="legend-text">Platform</text>
  
  <circle cx="270" cy="685" r="5" fill="#d1e7dd" />
  <text x="280" y="688" class="legend-text">Data</text>
  
  <!-- Compliance Pills -->
  <rect x="350" y="655" width="80" height="20" rx="10" fill="#0078d4" />
  <text x="390" y="668" class="compliance-text">PCI DSS</text>
  
  <rect x="450" y="655" width="80" height="20" rx="10" fill="#6f42c1" />
  <text x="490" y="668" class="compliance-text">HIPAA</text>
  
  <rect x="550" y="655" width="80" height="20" rx="10" fill="#198754" />
  <text x="590" y="668" class="compliance-text">SOC2</text>
  
  <rect x="650" y="655" width="80" height="20" rx="10" fill="#dc3545" />
  <text x="690" y="668" class="compliance-text">ISO 27001</text>
</svg> 