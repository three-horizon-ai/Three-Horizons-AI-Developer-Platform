<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
    <!-- Definitions for gradients and markers -->
    <defs>
        <!-- Arrow marker definition -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
        </marker>
        
        <!-- Gradients for boxes -->
        <linearGradient id="gradient-rhdh" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#cc0000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a30000;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="gradient-github" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#6e86cf;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#5a75c5;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="gradient-azure" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#7cbea3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#5eb08b;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="gradient-user" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#e9a971;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e09255;stop-opacity:1" />
        </linearGradient>
        
        <!-- Version oval gradient -->
        <linearGradient id="gradient-version" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1000" height="600" fill="#fafafa"/>
    
    <!-- Red Header Banner -->
    <rect x="0" y="0" width="1000" height="90" fill="#cc0000"/>
    
    <!-- Title -->
    <text x="500" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">Authentication Flow</text>
    
    <!-- Version indicator oval -->
    <ellipse cx="1240" cy="45" rx="80" ry="25" fill="url(#gradient-version)" stroke="#ffffff" stroke-width="1"/>
    <text x="1240" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">v1.0 • 2025</text>
    
    <!-- Main Components -->
    <!-- Developer Hub Box -->
    <rect x="350" y="150" width="300" height="100" rx="10" ry="10" fill="url(#gradient-rhdh)" stroke="#7a0000" stroke-width="2"/>
    <text x="500" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">Red Hat Developer Hub</text>
    <text x="500" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">Internal Developer Portal</text>

    <!-- GitHub Enterprise Box -->
    <rect x="100" y="330" width="250" height="100" rx="10" ry="10" fill="url(#gradient-github)" stroke="#4a64b5" stroke-width="2"/>
    <text x="225" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">GitHub Enterprise</text>
    <text x="225" y="395" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">OAuth App / GitHub App</text>

    <!-- Microsoft Entra ID Box -->
    <rect x="650" y="330" width="250" height="100" rx="10" ry="10" fill="url(#gradient-azure)" stroke="#4e9d7c" stroke-width="2"/>
    <text x="775" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">Microsoft Entra ID</text>
    <text x="775" y="395" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">SSO / SAML2 Provider</text>

    <!-- User Box -->
    <rect x="350" y="480" width="300" height="80" rx="10" ry="10" fill="url(#gradient-user)" stroke="#d08245" stroke-width="2"/>
    <text x="500" y="520" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">Enterprise User</text>
    <text x="500" y="545" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">(Developer / Operator)</text>

    <!-- Connection Lines -->
    <!-- User to RHDH -->
    <path d="M 500 480 L 500 250" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="510" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">1. Access Portal</text>

    <!-- RHDH to Entra ID -->
    <path d="M 650 200 L 775 200 L 775 330" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="830" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">2. Redirect to SSO</text>

    <!-- Entra ID to User -->
    <path d="M 775 430 L 775 520 L 650 520" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="750" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#666">3. Authenticate User</text>

    <!-- User to Entra ID -->
    <path d="M 600 500 L 720 500" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="660" y="485" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">4. Provide Credentials</text>

    <!-- Entra ID to RHDH -->
    <path d="M 750 330 L 750 170 L 650 170" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="790" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">5. Return Auth Token</text>

    <!-- RHDH to GitHub -->
    <path d="M 350 200 L 225 200 L 225 330" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="190" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#666">6. Request GitHub Access</text>

    <!-- GitHub to User -->
    <path d="M 225 430 L 225 520 L 350 520" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="250" y="460" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">7. GitHub Auth Request</text>

    <!-- User to GitHub -->
    <path d="M 400 500 L 280 500" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="340" y="485" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">8. Authorize</text>

    <!-- GitHub to RHDH -->
    <path d="M 250 330 L 250 170 L 350 170" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="210" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#666">9. Return GitHub Token</text>

    <!-- Session Indication -->
    <text x="500" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#28a745">Authenticated Session Established</text>
    <path d="M 425 150 C 465 140, 535 140, 575 150" stroke="#28a745" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    
    <!-- Legend -->
    <g transform="translate(10,105)">
        <rect x="10" y="10" width="15" height="15" fill="url(#gradient-rhdh)" stroke="#7a0000" stroke-width="1"/>
        <text x="35" y="23" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Red Hat Components</text>
        
        <rect x="10" y="35" width="15" height="15" fill="url(#gradient-github)" stroke="#4a64b5" stroke-width="1"/>
        <text x="35" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">GitHub Enterprise</text>
        
        <rect x="10" y="60" width="15" height="15" fill="url(#gradient-azure)" stroke="#4e9d7c" stroke-width="1"/>
        <text x="35" y="73" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Microsoft Azure Services</text>
    </g>
    
    <g transform="translate(180,105)">
        <line x1="10" y1="10" x2="40" y2="10" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
        <text x="50" y="15" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Response Flow</text>
        
        <line x1="10" y1="35" x2="40" y2="35" stroke="#666666" stroke-width="2"/>
        <text x="50" y="40" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Request Flow</text>
    </g>
    
    <!-- Footer -->
    <rect x="0" y="570" width="1000" height="30" fill="#333333"/>
    <text x="500" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">Red Hat Developer Hub v1.5 - April 2025</text>
</svg> 