<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
    <!-- Definitions for gradients and markers -->
    <defs>
        <!-- Arrow marker definition -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
        </marker>
        
        <!-- Gradients for boxes -->
        <linearGradient id="gradient-rhdh" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ffebeb;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="gradient-github" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e9e9e9;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="gradient-azure" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#f0f5ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e6eeff;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1000" height="600" fill="#fafafa"/>
    
    <!-- Cabeçalho com fundo - NOVO -->
    <rect x="0" y="0" width="1000" height="40" fill="#f3f3f3" stroke="#dddddd" stroke-width="1"/>
    
    <!-- Título movido para bem mais acima -->
    <text x="500" y="18" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">Authentication Flow Diagram - Three Horizons Platform Integration</text>
    
    <!-- Main Components -->
    <!-- Developer Hub Box -->
    <rect x="350" y="120" width="300" height="100" rx="10" ry="10" fill="url(#gradient-rhdh)" stroke="#cc0000" stroke-width="2"/>
    <text x="500" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#cc0000">Red Hat Developer Hub</text>
    <text x="500" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Internal Developer Portal</text>

    <!-- GitHub Enterprise Box -->
    <rect x="100" y="300" width="250" height="100" rx="10" ry="10" fill="url(#gradient-github)" stroke="#24292e" stroke-width="2"/>
    <text x="225" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#24292e">GitHub Enterprise</text>
    <text x="225" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">OAuth App / GitHub App</text>

    <!-- Microsoft Entra ID Box -->
    <rect x="650" y="300" width="250" height="100" rx="10" ry="10" fill="url(#gradient-azure)" stroke="#0078d4" stroke-width="2"/>
    <text x="775" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Entra ID</text>
    <text x="775" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">SSO / SAML2 Provider</text>

    <!-- User Box -->
    <rect x="350" y="480" width="300" height="80" rx="10" ry="10" fill="#ffffff" stroke="#666666" stroke-width="2"/>
    <text x="500" y="520" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Enterprise User</text>
    <text x="500" y="545" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">(Developer / Operator)</text>

    <!-- Connection Lines -->
    <!-- User to RHDH -->
    <path d="M 500 480 L 500 220" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="510" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">1. Access Portal</text>

    <!-- RHDH to Entra ID -->
    <path d="M 650 170 L 775 170 L 775 300" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="715" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">2. Redirect to SSO</text>

    <!-- Entra ID to User -->
    <path d="M 775 400 L 775 520 L 650 520" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="750" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#666">3. Authenticate User</text>

    <!-- User to Entra ID -->
    <path d="M 600 500 L 720 500" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="660" y="465" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">4. Provide Credentials</text>

    <!-- Entra ID to RHDH -->
    <path d="M 750 300 L 750 140 L 650 140" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="790" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">5. Return Auth Token</text>

    <!-- RHDH to GitHub -->
    <path d="M 350 170 L 225 170 L 225 300" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="190" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#666">6. Request GitHub Access</text>

    <!-- GitHub to User -->
    <path d="M 225 400 L 225 520 L 350 520" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="250" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">7. GitHub Auth Request</text>

    <!-- User to GitHub -->
    <path d="M 400 500 L 280 500" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="340" y="465" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">8. Authorize</text>

    <!-- GitHub to RHDH -->
    <path d="M 250 300 L 250 140 L 350 140" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="210" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#666">9. Return GitHub Token</text>

    <!-- Session Indication - Reposicionado diretamente acima do Red Hat Developer Hub -->
    <text x="500" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#28a745">Authenticated Session Established</text>
    <path d="M 425 120 C 465 110, 535 110, 575 120" stroke="#28a745" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    
    <!-- Legend - Reposicionada -->
    <g transform="translate(10,45)">
        <rect x="10" y="10" width="15" height="15" fill="url(#gradient-rhdh)" stroke="#cc0000" stroke-width="1"/>
        <text x="35" y="23" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Red Hat Components</text>
        
        <rect x="10" y="35" width="15" height="15" fill="url(#gradient-github)" stroke="#24292e" stroke-width="1"/>
        <text x="35" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">GitHub Enterprise</text>
        
        <rect x="10" y="60" width="15" height="15" fill="url(#gradient-azure)" stroke="#0078d4" stroke-width="1"/>
        <text x="35" y="73" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Microsoft Azure Services</text>
    </g>
    
    <g transform="translate(180,45)">
        <line x1="10" y1="10" x2="40" y2="10" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
        <text x="50" y="15" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Response Flow</text>
        
        <line x1="10" y1="35" x2="40" y2="35" stroke="#666666" stroke-width="2"/>
        <text x="50" y="40" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Request Flow</text>
    </g>
</svg> 