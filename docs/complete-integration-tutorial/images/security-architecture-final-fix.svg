<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
    <!-- Background -->
    <rect width="900" height="650" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">Security Architecture (v1.0, April 2025)</text>
    
    <!-- Azure Cloud Box -->
    <rect x="35" y="70" width="830" height="550" rx="15" ry="15" fill="#f0f5ff" stroke="#0078d4" stroke-width="2" opacity="0.3"/>
    <text x="450" y="95" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Azure Cloud - Security Boundary</text>
    
    <!-- Identity Layer -->
    <rect x="75" y="120" width="750" height="110" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="110" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#2E7D32">Identity and Access Management</text>
    
    <!-- IAM Components -->
    <rect x="100" y="160" width="185" height="55" rx="5" ry="5" fill="white" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="192" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Microsoft Entra ID</text>
    <text x="192" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Primary Identity Provider</text>
    
    <rect x="310" y="160" width="185" height="55" rx="5" ry="5" fill="white" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="402" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Workload Identity</text>
    <text x="402" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Service Authentication</text>
    
    <rect x="520" y="160" width="285" height="55" rx="5" ry="5" fill="white" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="662" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">GitHub Enterprise Cloud SSO</text>
    <text x="662" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Developer Authentication w/ MFA</text>
    
    <!-- Network Layer -->
    <rect x="75" y="245" width="750" height="110" rx="10" ry="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="110" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#E65100">Network Security</text>
    
    <!-- Network Components -->
    <rect x="100" y="285" width="170" height="55" rx="5" ry="5" fill="white" stroke="#E65100" stroke-width="1.5"/>
    <text x="185" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Network Segmentation</text>
    <text x="185" y="330" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">NSGs, Azure Firewall</text>
    
    <rect x="285" y="285" width="170" height="55" rx="5" ry="5" fill="white" stroke="#E65100" stroke-width="1.5"/>
    <text x="370" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Private Endpoints</text>
    <text x="370" y="330" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">For PaaS Services</text>
    
    <rect x="470" y="285" width="170" height="55" rx="5" ry="5" fill="white" stroke="#E65100" stroke-width="1.5"/>
    <text x="555" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">TLS Encryption</text>
    <text x="555" y="330" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">All Communications</text>
    
    <rect x="655" y="285" width="150" height="55" rx="5" ry="5" fill="white" stroke="#E65100" stroke-width="1.5"/>
    <text x="730" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Network Policies</text>
    <text x="730" y="330" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Pod-to-Pod Security</text>
    
    <!-- Resource Protection Layer -->
    <rect x="75" y="370" width="750" height="110" rx="10" ry="10" fill="#E3F2FD" stroke="#0078d4" stroke-width="2"/>
    <text x="110" y="395" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#0078d4">Resource Protection</text>
    
    <!-- Resource Protection Components -->
    <rect x="100" y="410" width="170" height="55" rx="5" ry="5" fill="white" stroke="#0078d4" stroke-width="1.5"/>
    <text x="185" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Azure Policy</text>
    <text x="185" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Enforcement Controls</text>
    
    <rect x="285" y="410" width="170" height="55" rx="5" ry="5" fill="white" stroke="#0078d4" stroke-width="1.5"/>
    <text x="370" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">OPA/Gatekeeper</text>
    <text x="370" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Kubernetes Policy</text>
    
    <rect x="470" y="410" width="170" height="55" rx="5" ry="5" fill="white" stroke="#0078d4" stroke-width="1.5"/>
    <text x="555" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Security Center</text>
    <text x="555" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Continuous Monitoring</text>
    
    <rect x="655" y="410" width="150" height="55" rx="5" ry="5" fill="white" stroke="#0078d4" stroke-width="1.5"/>
    <text x="730" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">RBAC</text>
    <text x="730" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Least Privilege Access</text>
    
    <!-- GitHub Security Layer -->
    <rect x="75" y="495" width="370" height="90" rx="10" ry="10" fill="#F5F5F5" stroke="#24292e" stroke-width="2"/>
    <text x="105" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#24292e">GitHub Enterprise Security</text>
    
    <!-- GitHub Security Components -->
    <rect x="100" y="535" width="150" height="35" rx="5" ry="5" fill="white" stroke="#24292e" stroke-width="1.5"/>
    <text x="175" y="557" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Advanced Security</text>
    
    <rect x="270" y="535" width="150" height="35" rx="5" ry="5" fill="white" stroke="#24292e" stroke-width="1.5"/>
    <text x="345" y="557" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Secret Scanning</text>
    
    <!-- Red Hat Security Layer -->
    <rect x="460" y="495" width="365" height="90" rx="10" ry="10" fill="#FFEBEE" stroke="#cc0000" stroke-width="2"/>
    <text x="490" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#cc0000">Red Hat OpenShift Security</text>
    
    <!-- Red Hat Security Components - FURTHER ADJUSTED FOR SECURITY CONTEXT CONSTRAINTS -->
    <rect x="485" y="535" width="150" height="35" rx="5" ry="5" fill="white" stroke="#cc0000" stroke-width="1.5"/>
    <text x="560" y="557" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#333333">Security Context Constraints</text>
    
    <rect x="655" y="535" width="150" height="35" rx="5" ry="5" fill="white" stroke="#cc0000" stroke-width="1.5"/>
    <text x="730" y="557" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">Container Security</text>
    
    <!-- Legend -->
    <rect x="75" y="600" width="750" height="35" rx="5" ry="5" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1"/>
    
    <rect x="90" y="610" width="15" height="15" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
    <text x="115" y="622" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">Identity Security</text>
    
    <rect x="220" y="610" width="15" height="15" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
    <text x="245" y="622" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">Network Security</text>
    
    <rect x="350" y="610" width="15" height="15" fill="#E3F2FD" stroke="#0078d4" stroke-width="1"/>
    <text x="375" y="622" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">Azure Services</text>
    
    <rect x="480" y="610" width="15" height="15" fill="#F5F5F5" stroke="#24292e" stroke-width="1"/>
    <text x="505" y="622" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">GitHub Enterprise Cloud</text>
    
    <rect x="650" y="610" width="15" height="15" fill="#FFEBEE" stroke="#cc0000" stroke-width="1"/>
    <text x="675" y="622" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">Red Hat Services</text>
</svg>
