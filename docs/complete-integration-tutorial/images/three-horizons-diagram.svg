<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
    <!-- Background -->
    <rect width="1200" height="900" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="40" font-family="Arial" font-size="30" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Complete Integration</text>
    
    <!-- Azure Cloud -->
    <rect x="50" y="80" width="1100" height="780" stroke="#0078d4" stroke-width="3" fill="#f0f5ff" rx="10" ry="10" opacity="0.3"/>
    <text x="600" y="110" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Azure Cloud</text>
    
    <!-- GitHub Enterprise -->
    <rect x="80" y="140" width="320" height="350" stroke="#333333" stroke-width="2" fill="#f5f5f5" rx="10" ry="10"/>
    <text x="240" y="170" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">GitHub Enterprise</text>
    
    <!-- GitHub Services -->
    <rect x="100" y="190" width="280" height="60" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="240" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Source Repositories</text>
    
    <rect x="100" y="260" width="280" height="60" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="240" y="295" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Actions</text>
    
    <rect x="100" y="330" width="280" height="60" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="240" y="365" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Codespaces</text>
    
    <rect x="100" y="400" width="280" height="60" stroke="#333333" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="240" y="435" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Advanced Security</text>
    
    <!-- Red Hat Developer Hub -->
    <rect x="440" y="140" width="320" height="350" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="10" ry="10"/>
    <text x="600" y="170" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#cc0000">Red Hat Developer Hub</text>
    
    <!-- RHDH Services -->
    <rect x="460" y="190" width="280" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Developer Portal</text>
    
    <rect x="460" y="260" width="280" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="295" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Software Templates</text>
    
    <rect x="460" y="330" width="280" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="365" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Software Catalog</text>
    
    <rect x="460" y="400" width="280" height="60" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="600" y="435" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Tech Docs</text>
    
    <!-- Azure Services -->
    <rect x="800" y="140" width="320" height="350" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="960" y="170" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Services</text>
    
    <!-- Azure Core Services -->
    <rect x="820" y="190" width="280" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="960" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Microsoft Entra ID</text>
    
    <rect x="820" y="260" width="280" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="960" y="295" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Key Vault</text>
    
    <rect x="820" y="330" width="280" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="960" y="365" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Monitor</text>
    
    <rect x="820" y="400" width="280" height="60" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="960" y="435" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Container Registry</text>
    
    <!-- Platform Layer -->
    <rect x="80" y="510" width="1040" height="320" stroke="#666666" stroke-width="2" fill="#ffffff" rx="10" ry="10"/>
    <text x="600" y="540" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#666">Container Platform (PaaS)</text>
    
    <!-- Left Side - ARO -->
    <rect x="100" y="570" width="490" height="240" stroke="#cc0000" stroke-width="2" fill="#fff5f5" rx="10" ry="10"/>
    <text x="345" y="595" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#cc0000">Azure Red Hat OpenShift (ARO)</text>
    
    <!-- ARO Components -->
    <rect x="120" y="615" width="210" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="225" y="645" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift API & Console</text>
    
    <rect x="120" y="675" width="210" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="225" y="705" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift Operators</text>
    
    <rect x="120" y="735" width="210" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="225" y="765" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Service Mesh</text>
    
    <rect x="360" y="615" width="210" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="465" y="645" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift GitOps</text>
    
    <rect x="360" y="675" width="210" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="465" y="705" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">OpenShift Pipelines</text>
    
    <rect x="360" y="735" width="210" height="50" stroke="#cc0000" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="465" y="765" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Application Workloads</text>
    
    <!-- Right Side - AKS -->
    <rect x="610" y="570" width="490" height="240" stroke="#0078d4" stroke-width="2" fill="#f0f5ff" rx="10" ry="10"/>
    <text x="855" y="595" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Kubernetes Service (AKS)</text>
    
    <!-- AKS Components -->
    <rect x="630" y="615" width="210" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="735" y="645" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Kubernetes API & Dashboard</text>
    
    <rect x="630" y="675" width="210" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="735" y="705" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Policy for AKS</text>
    
    <rect x="630" y="735" width="210" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="735" y="765" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Istio Service Mesh</text>
    
    <rect x="870" y="615" width="210" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="975" y="645" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Flux GitOps</text>
    
    <rect x="870" y="675" width="210" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="975" y="705" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure DevOps Pipelines</text>
    
    <rect x="870" y="735" width="210" height="50" stroke="#0078d4" stroke-width="1" fill="#ffffff" rx="5" ry="5"/>
    <text x="975" y="765" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Application Workloads</text>
    
    <!-- Connection Lines -->
    <!-- GitHub to RHDH -->
    <path d="M 380 220 L 460 220" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 380 350 L 460 350" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- RHDH to Azure -->
    <path d="M 740 220 L 820 220" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 740 350 L 820 350" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- GitHub to ARO -->
    <path d="M 240 460 L 240 590" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- RHDH to ARO -->
    <path d="M 600 460 L 600 570" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Azure to AKS -->
    <path d="M 960 460 L 960 570" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- ARO to AKS (Optional Integration) -->
    <path d="M 590 690 L 630 690" stroke="#666" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Feedback Loops -->
    <path d="M 975 785 C 1100 820 300 820 225 785" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="600" y="840" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">Continuous Feedback Loop</text>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Legend -->
    <rect x="80" y="850" width="15" height="15" fill="#333333"/>
    <text x="100" y="863" font-family="Arial" font-size="12" text-anchor="start" fill="#333">GitHub Components</text>
    
    <rect x="280" y="850" width="15" height="15" fill="#cc0000"/>
    <text x="300" y="863" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Red Hat Components</text>
    
    <rect x="480" y="850" width="15" height="15" fill="#0078d4"/>
    <text x="500" y="863" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Azure Components</text>
    
    <rect x="680" y="850" width="15" height="15" fill="#666666"/>
    <text x="700" y="863" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Platform Services</text>
</svg> 