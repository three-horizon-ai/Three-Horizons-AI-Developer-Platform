<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
    <!-- Background -->
    <rect width="900" height="650" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">Integration Architecture (v2.1, April 2025)</text>
    
    <!-- Azure Cloud Box -->
    <rect x="50" y="70" width="800" height="490" rx="15" ry="15" fill="#f0f5ff" stroke="#0078d4" stroke-width="2" opacity="0.3"/>
    <text x="450" y="95" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Azure Cloud</text>
    
    <!-- GitHub Enterprise Cloud Box -->
    <rect x="80" y="120" width="210" height="280" rx="10" ry="10" fill="#f5f5f5" stroke="#24292e" stroke-width="2"/>
    <text x="185" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#24292e">GitHub Enterprise Cloud</text>
    
    <!-- GitHub Services -->
    <rect x="95" y="160" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="185" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Source Repositories</text>
    
    <rect x="95" y="210" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="185" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GitHub Actions</text>
    
    <rect x="95" y="260" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="185" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GitHub Copilot Business</text>
    
    <rect x="95" y="310" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="185" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GitHub Advanced Security</text>
    
    <rect x="95" y="360" width="180" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#24292e" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="185" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">GitHub Enterprise API Gateway</text>
    
    <!-- Red Hat Developer Hub Box -->
    <rect x="345" y="120" width="210" height="280" rx="10" ry="10" fill="#fff5f5" stroke="#cc0000" stroke-width="2"/>
    <text x="450" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#cc0000">Red Hat Developer Hub</text>
    
    <!-- RHDH Services -->
    <rect x="360" y="160" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cc0000" stroke-width="1"/>
    <text x="450" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Developer Portal</text>
    
    <rect x="360" y="210" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cc0000" stroke-width="1"/>
    <text x="450" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Software Templates</text>
    
    <rect x="360" y="260" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cc0000" stroke-width="1"/>
    <text x="450" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Software Catalog</text>
    
    <rect x="360" y="310" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#cc0000" stroke-width="1"/>
    <text x="450" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Tech Docs</text>
    
    <rect x="360" y="360" width="180" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#cc0000" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="450" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">API & Plugin System</text>
    
    <!-- Azure Services Box -->
    <rect x="610" y="120" width="210" height="280" rx="10" ry="10" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
    <text x="715" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Services</text>
    
    <!-- Azure Services -->
    <rect x="625" y="160" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
    <text x="715" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Microsoft Entra ID</text>
    
    <rect x="625" y="210" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
    <text x="715" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Key Vault</text>
    
    <rect x="625" y="260" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
    <text x="715" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Monitor</text>
    
    <rect x="625" y="310" width="180" height="40" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
    <text x="715" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Azure Container Registry</text>
    
    <rect x="625" y="360" width="180" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#0078d4" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="715" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Azure Resource Manager</text>
    
    <!-- Platform Title -->
    <rect x="80" y="420" width="730" height="30" rx="5" ry="5" fill="#f9f9f9" stroke="#666666" stroke-width="1"/>
    <text x="450" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666">Container Platforms</text>
    
    <!-- ARO Box -->
    <rect x="80" y="460" width="350" height="70" rx="5" ry="5" fill="#fff5f5" stroke="#cc0000" stroke-width="1.5"/>
    <text x="255" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#cc0000">Azure Red Hat OpenShift (ARO)</text>
    <text x="255" y="510" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">OpenShift GitOps, Pipelines, Service Mesh</text>
    
    <!-- AKS Box -->
    <rect x="460" y="460" width="350" height="70" rx="5" ry="5" fill="#e3f2fd" stroke="#0078d4" stroke-width="1.5"/>
    <text x="635" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Kubernetes Service (AKS)</text>
    <text x="635" y="510" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Flux GitOps, Azure DevOps, Istio</text>
    
    <!-- Feedback Loop -->
    <path d="M 255 530 C 255 550, 450 570, 635 530" stroke="#666666" stroke-width="1.5" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="450" y="565" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#666">Continuous Feedback Loop</text>
    
    <!-- Connecting Lines from GitHub to RHDH -->
    <path d="M 275 180 L 360 180" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 275 230 L 360 230" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 275 280 L 360 280" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Connecting Lines from RHDH to Azure Services -->
    <path d="M 540 180 L 625 180" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 540 230 L 625 230" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 540 280 L 625 280" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Connecting Lines to ARO and AKS -->
    <path d="M 185 400 L 185 460" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 450 400 L 450 460" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 715 400 L 715 460" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Legend -->
    <rect x="100" y="585" width="700" height="40" rx="5" ry="5" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1"/>
    
    <rect x="120" y="597" width="15" height="15" fill="#f5f5f5" stroke="#24292e" stroke-width="1"/>
    <text x="145" y="610" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">GitHub Enterprise Cloud</text>
    
    <rect x="320" y="597" width="15" height="15" fill="#fff5f5" stroke="#cc0000" stroke-width="1"/>
    <text x="345" y="610" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">Red Hat Components</text>
    
    <rect x="520" y="597" width="15" height="15" fill="#e3f2fd" stroke="#0078d4" stroke-width="1"/>
    <text x="545" y="610" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">Azure Services</text>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
        </marker>
    </defs>
</svg>
