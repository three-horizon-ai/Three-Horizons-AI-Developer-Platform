<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Background -->
    <rect width="1200" height="800" fill="#f7f7f7"/>
    
    <!-- Title -->
    <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#333333">Integration Architecture (v2.1, April 2025)</text>
    
    <!-- Azure Cloud Background -->
    <rect x="50" y="100" width="1100" height="650" rx="15" ry="15" fill="#f0f5ff" stroke="#0078d4" stroke-width="2" opacity="0.3"/>
    <text x="600" y="130" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft Azure Cloud</text>
    
    <!-- GitHub Enterprise Cloud Box -->
    <rect x="100" y="160" width="320" height="380" rx="10" ry="10" fill="#f5f5f5" stroke="#24292e" stroke-width="2"/>
    <text x="260" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#24292e">GitHub Enterprise Cloud</text>
    
    <!-- GitHub Services -->
    <rect x="120" y="210" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="260" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Source Repositories</text>
    
    <rect x="120" y="280" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="260" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Actions</text>
    
    <rect x="120" y="350" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="260" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Copilot Business</text>
    
    <rect x="120" y="420" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="260" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Advanced Security</text>
    
    <rect x="120" y="490" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#24292e" stroke-width="1"/>
    <text x="260" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">GitHub Enterprise API Gateway</text>
    
    <!-- Red Hat Developer Hub Box -->
    <rect x="440" y="160" width="320" height="380" rx="10" ry="10" fill="#fff5f5" stroke="#cc0000" stroke-width="2"/>
    <text x="600" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#cc0000">Red Hat Developer Hub</text>
    
    <!-- RHDH Services -->
    <rect x="460" y="210" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#cc0000" stroke-width="1"/>
    <text x="600" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Developer Portal</text>
    
    <rect x="460" y="280" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#cc0000" stroke-width="1"/>
    <text x="600" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Software Templates</text>
    
    <rect x="460" y="350" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#cc0000" stroke-width="1"/>
    <text x="600" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Software Catalog</text>
    
    <rect x="460" y="420" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#cc0000" stroke-width="1"/>
    <text x="600" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Tech Docs</text>
    
    <rect x="460" y="490" width="280" height="40" rx="5" ry="5" fill="#f9f9f9" stroke="#cc0000" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="600" y="515" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">API & Plugin System</text>
    
    <!-- Azure Services Box -->
    <rect x="780" y="160" width="320" height="380" rx="10" ry="10" fill="#f0f5ff" stroke="#0078d4" stroke-width="2"/>
    <text x="940" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Services</text>
    
    <!-- Azure Services -->
    <rect x="800" y="210" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
    <text x="940" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Microsoft Entra ID</text>
    
    <rect x="800" y="280" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
    <text x="940" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Key Vault</text>
    
    <rect x="800" y="350" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
    <text x="940" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Monitor</text>
    
    <rect x="800" y="420" width="280" height="60" rx="5" ry="5" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
    <text x="940" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Azure Container Registry</text>
    
    <rect x="800" y="490" width="280" height="40" rx="5" ry="5" fill="#f9f9f9" stroke="#0078d4" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="940" y="515" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Azure Resource Manager</text>
    
    <!-- Platform Layer -->
    <rect x="100" y="560" width="1000" height="160" rx="10" ry="10" fill="#ffffff" stroke="#666666" stroke-width="2"/>
    <text x="600" y="590" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#666">Container Platforms</text>
    
    <!-- ARO Box -->
    <rect x="120" y="610" width="480" height="90" rx="5" ry="5" fill="#fff5f5" stroke="#cc0000" stroke-width="1"/>
    <text x="360" y="640" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#cc0000">Azure Red Hat OpenShift (ARO)</text>
    <text x="360" y="670" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">OpenShift GitOps, Pipelines, Service Mesh</text>
    
    <!-- AKS Box -->
    <rect x="620" y="610" width="460" height="90" rx="5" ry="5" fill="#f0f5ff" stroke="#0078d4" stroke-width="1"/>
    <text x="850" y="640" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0078d4">Azure Kubernetes Service (AKS)</text>
    <text x="850" y="670" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Flux GitOps, Azure DevOps, Istio</text>
    
    <!-- Connection Lines -->
    <!-- Github to RHDH -->
    <path d="M 400 240 L 460 240" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 400 310 L 460 310" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 400 380 L 460 380" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- RHDH to Azure -->
    <path d="M 740 240 L 800 240" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 740 310 L 800 310" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 740 380 L 800 380" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Github to Platform -->
    <path d="M 260 490 L 260 610" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- RHDH to Platform -->
    <path d="M 600 490 L 600 610" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Azure to Platform -->
    <path d="M 940 490 L 940 610" stroke="#666666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Feedback Loop -->
    <path d="M 560 700 C 560 730, 400 750, 300 700" stroke="#666666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="430" y="740" font-family="Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#666">Continuous Feedback Loop</text>
    
    <!-- Legend -->
    <rect x="100" y="740" width="15" height="15" fill="#f5f5f5" stroke="#24292e" stroke-width="1"/>
    <text x="125" y="753" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">GitHub Enterprise Cloud</text>
    
    <rect x="280" y="740" width="15" height="15" fill="#fff5f5" stroke="#cc0000" stroke-width="1"/>
    <text x="305" y="753" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Red Hat Components</text>
    
    <rect x="460" y="740" width="15" height="15" fill="#f0f5ff" stroke="#0078d4" stroke-width="1"/>
    <text x="485" y="753" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">Azure Services</text>
    
    <!-- Arrow Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
        </marker>
    </defs>
</svg> 