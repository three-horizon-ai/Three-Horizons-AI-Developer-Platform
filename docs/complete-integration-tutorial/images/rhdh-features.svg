<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Definitions for gradients and markers -->
    <defs>
        <!-- Red Hat gradient -->
        <linearGradient id="rh-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#EE0000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#820000;stop-opacity:1" />
        </linearGradient>
        
        <!-- Feature box gradients -->
        <linearGradient id="feature1-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7B68EE;stop-opacity:0.7" />
            <stop offset="100%" style="stop-color:#4B0082;stop-opacity:0.7" />
        </linearGradient>
        
        <linearGradient id="feature2-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#20B2AA;stop-opacity:0.7" />
            <stop offset="100%" style="stop-color:#008080;stop-opacity:0.7" />
        </linearGradient>
        
        <linearGradient id="feature3-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:0.7" />
            <stop offset="100%" style="stop-color:#D2691E;stop-opacity:0.7" />
        </linearGradient>
        
        <linearGradient id="feature4-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6495ED;stop-opacity:0.7" />
            <stop offset="100%" style="stop-color:#4169E1;stop-opacity:0.7" />
        </linearGradient>
        
        <!-- Box shadow filter -->
        <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="4" dy="4" stdDeviation="5" flood-opacity="0.3"/>
        </filter>
        
        <!-- Connecting lines marker -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="800" fill="#F8F8F8"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="1200" height="100" fill="url(#rh-gradient)"/>
    <text x="600" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">
        Red Hat Developer Hub 1.5 Features
    </text>
    
    <!-- Central Hub Icon -->
    <circle cx="600" cy="300" r="100" fill="url(#rh-gradient)" filter="url(#drop-shadow)"/>
    <text x="600" y="290" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">RHDH 1.5</text>
    <text x="600" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Core Platform</text>
    
    <!-- Feature 1: Dynamic Plugins Architecture -->
    <rect x="150" y="200" width="250" height="200" rx="15" ry="15" fill="url(#feature1-gradient)" filter="url(#drop-shadow)"/>
    <text x="275" y="230" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
        Dynamic Plugins Architecture
    </text>
    <text x="275" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Plugin loading without rebuilds</text>
    <text x="275" y="290" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Hot-swappable plugins</text>
    <text x="275" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Runtime customization</text>
    <text x="275" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• K8s-based plugin management</text>
    
    <!-- Feature 2: Enhanced Software Catalog -->
    <rect x="800" y="200" width="250" height="200" rx="15" ry="15" fill="url(#feature2-gradient)" filter="url(#drop-shadow)"/>
    <text x="925" y="230" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
        Enhanced Software Catalog
    </text>
    <text x="925" y="265" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Improved component discovery</text>
    <text x="925" y="290" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Automatic relationship mapping</text>
    <text x="925" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Advanced filtering and search</text>
    <text x="925" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Extended metadata support</text>
    
    <!-- Feature 3: Template Improvements -->
    <rect x="150" y="500" width="250" height="200" rx="15" ry="15" fill="url(#feature3-gradient)" filter="url(#drop-shadow)"/>
    <text x="275" y="530" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
        Template Improvements
    </text>
    <text x="275" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Template parameters validation</text>
    <text x="275" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Conditional template steps</text>
    <text x="275" y="615" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Enhanced authoring experience</text>
    <text x="275" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Output preview capabilities</text>
    
    <!-- Feature 4: Integration Improvements -->
    <rect x="800" y="500" width="250" height="200" rx="15" ry="15" fill="url(#feature4-gradient)" filter="url(#drop-shadow)"/>
    <text x="925" y="530" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
        Integration Improvements
    </text>
    <text x="925" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Native OpenShift integration</text>
    <text x="925" y="590" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Enhanced K8s visualization</text>
    <text x="925" y="615" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Improved CI/CD integration</text>
    <text x="925" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">• Seamless GitHub Enterprise access</text>
    
    <!-- Connecting Lines -->
    <line x1="600" y1="200" x2="600" y2="400" stroke="#666" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="400" y1="300" x2="500" y2="300" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="700" y1="300" x2="800" y2="300" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="600" y1="400" x2="600" y2="600" stroke="#666" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="275" y1="600" x2="500" y2="600" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="700" y1="600" x2="800" y2="600" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- Footer -->
    <rect x="0" y="750" width="1200" height="50" fill="#333"/>
    <text x="600" y="780" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
        Red Hat Developer Hub v1.5 - April 2025
    </text>
    
    <!-- Version Label -->
    <rect x="1050" y="20" width="120" height="30" rx="15" ry="15" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="1"/>
    <text x="1110" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">v1.0 • 2025</text>
</svg> 