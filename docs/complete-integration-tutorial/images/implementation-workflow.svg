<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
    <!-- Definições -->
    <defs>
        <!-- Gradiente para os horizontes -->
        <linearGradient id="horizon1-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2188ff;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#2188ff;stop-opacity:0.1"/>
        </linearGradient>
        
        <linearGradient id="horizon2-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#f9c513;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#f9c513;stop-opacity:0.1"/>
        </linearGradient>
        
        <linearGradient id="horizon3-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#6f42c1;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#6f42c1;stop-opacity:0.1"/>
        </linearGradient>
        
        <!-- Gradientes para os phases -->
        <linearGradient id="phase1-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#0366d6;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#044289;stop-opacity:1"/>
        </linearGradient>
        
        <linearGradient id="phase2-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#e36209;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#c24e00;stop-opacity:1"/>
        </linearGradient>
        
        <linearGradient id="phase3-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#d73a49;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#b31d28;stop-opacity:1"/>
        </linearGradient>
        
        <linearGradient id="phase4-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#6f42c1;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#5a32a3;stop-opacity:1"/>
        </linearGradient>
        
        <linearGradient id="phase5-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#28a745;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#22863a;stop-opacity:1"/>
        </linearGradient>
        
        <linearGradient id="phase6-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#0075ca;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#005b9e;stop-opacity:1"/>
        </linearGradient>
        
        <linearGradient id="phase7-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#6639b7;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#512da8;stop-opacity:1"/>
        </linearGradient>
        
        <linearGradient id="phase8-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1"/>
        </linearGradient>
        
        <!-- Filtro de sombra -->
        <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
        </filter>
        
        <!-- Marcador de seta -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
        </marker>
    </defs>
    
    <!-- Fundo -->
    <rect width="1200" height="800" fill="#f6f8fa"/>
    
    <!-- Título -->
    <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#24292e">
        Three Horizons Implementation Workflow
    </text>
    
    <!-- Zonas dos horizontes -->
    <rect x="50" y="100" width="1100" height="200" fill="url(#horizon1-gradient)" rx="5" ry="5"/>
    <rect x="50" y="300" width="1100" height="200" fill="url(#horizon2-gradient)" rx="5" ry="5"/>
    <rect x="50" y="500" width="1100" height="200" fill="url(#horizon3-gradient)" rx="5" ry="5"/>
    
    <!-- Rótulos dos horizontes -->
    <rect x="50" y="100" width="200" height="40" fill="#2188ff" rx="5" ry="5"/>
    <text x="150" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Horizon 1: Foundation
    </text>
    
    <rect x="50" y="300" width="200" height="40" fill="#f9c513" rx="5" ry="5"/>
    <text x="150" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Horizon 2: Enhancement
    </text>
    
    <rect x="50" y="500" width="200" height="40" fill="#6f42c1" rx="5" ry="5"/>
    <text x="150" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Horizon 3: Innovation
    </text>
    
    <!-- Fases de Implementação -->
    <!-- Phase 1: Infrastructure Provisioning -->
    <rect x="100" y="160" width="150" height="100" rx="10" ry="10" fill="url(#phase1-gradient)" filter="url(#drop-shadow)"/>
    <text x="175" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Phase 1:</text>
    <text x="175" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Infrastructure</text>
    <text x="175" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Provisioning</text>
    
    <!-- Phase 2: Platform Installation -->
    <rect x="280" y="160" width="150" height="100" rx="10" ry="10" fill="url(#phase2-gradient)" filter="url(#drop-shadow)"/>
    <text x="355" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Phase 2:</text>
    <text x="355" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Platform</text>
    <text x="355" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Installation</text>
    
    <!-- Phase 3: Developer Hub Deployment -->
    <rect x="460" y="160" width="150" height="100" rx="10" ry="10" fill="url(#phase3-gradient)" filter="url(#drop-shadow)"/>
    <text x="535" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Phase 3:</text>
    <text x="535" y="210" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Developer Hub</text>
    <text x="535" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Deployment</text>
    
    <!-- Phase 4: GitHub Integration -->
    <rect x="640" y="200" width="150" height="100" rx="10" ry="10" fill="url(#phase4-gradient)" filter="url(#drop-shadow)"/>
    <text x="715" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Phase 4:</text>
    <text x="715" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">GitHub</text>
    <text x="715" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Integration</text>
    
    <!-- Phase 5: CI/CD Pipeline Setup -->
    <rect x="280" y="350" width="150" height="100" rx="10" ry="10" fill="url(#phase5-gradient)" filter="url(#drop-shadow)"/>
    <text x="355" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Phase 5:</text>
    <text x="355" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">CI/CD Pipeline</text>
    <text x="355" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Setup</text>
    
    <!-- Phase 6: Monitoring & Observability -->
    <rect x="460" y="350" width="150" height="100" rx="10" ry="10" fill="url(#phase6-gradient)" filter="url(#drop-shadow)"/>
    <text x="535" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Phase 6:</text>
    <text x="535" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Monitoring &</text>
    <text x="535" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Observability</text>
    
    <!-- Phase 7: Platform Validation -->
    <rect x="640" y="350" width="150" height="100" rx="10" ry="10" fill="url(#phase7-gradient)" filter="url(#drop-shadow)"/>
    <text x="715" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Phase 7:</text>
    <text x="715" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Platform</text>
    <text x="715" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Validation</text>
    
    <!-- Phase 8: Microsoft DevBox Configuration -->
    <rect x="460" y="550" width="150" height="100" rx="10" ry="10" fill="url(#phase8-gradient)" filter="url(#drop-shadow)"/>
    <text x="535" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Phase 8:</text>
    <text x="535" y="600" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Microsoft DevBox</text>
    <text x="535" y="620" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Configuration</text>
    
    <!-- Setas de conexão -->
    <!-- Horizon 1 Connections -->
    <line x1="250" y1="210" x2="280" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="430" y1="210" x2="460" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="610" y1="210" x2="640" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Horizon 2 Connections -->
    <line x1="715" y1="300" x2="355" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    <line x1="430" y1="400" x2="460" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="610" y1="400" x2="640" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Horizon 3 Connection -->
    <line x1="715" y1="450" x2="535" y2="550" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    
    <!-- Rótulos de dependência -->
    <rect x="800" y="190" width="300" height="140" rx="10" ry="10" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="950" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Implementation Dependencies:</text>
    <line x1="850" y1="240" x2="880" y2="240" stroke="#555" stroke-width="2"/>
    <text x="950" y="245" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333">Direct Dependency</text>
    <line x1="850" y1="270" x2="880" y2="270" stroke="#555" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="950" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333">Optional Dependency</text>
    <text x="950" y="305" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#666">
        Follow phases in order for a structured implementation
    </text>
    
    <!-- Legenda -->
    <rect x="800" y="550" width="300" height="100" rx="5" ry="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="950" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Three Horizons Model:</text>
    <rect x="820" y="590" width="15" height="15" fill="#2188ff" rx="2" ry="2"/>
    <text x="845" y="603" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333">Horizon 1: Foundation</text>
    <rect x="820" y="615" width="15" height="15" fill="#f9c513" rx="2" ry="2"/>
    <text x="845" y="628" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333">Horizon 2: Enhancement</text>
    <rect x="820" y="640" width="15" height="15" fill="#6f42c1" rx="2" ry="2"/>
    <text x="845" y="653" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333">Horizon 3: Innovation</text>
    
    <!-- Rodapé -->
    <line x1="50" y1="740" x2="1150" y2="740" stroke="#ddd" stroke-width="1"/>
    <text x="600" y="765" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">
        Three Horizons Implementation Workflow - v1.0 • April 2025
    </text>
    
    <!-- Selo de Versão -->
    <rect x="1050" y="20" width="120" height="30" rx="15" ry="15" fill="rgba(0,0,0,0.1)" stroke="#ddd" stroke-width="1"/>
    <text x="1110" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">v1.0 • 2025</text>
</svg> 