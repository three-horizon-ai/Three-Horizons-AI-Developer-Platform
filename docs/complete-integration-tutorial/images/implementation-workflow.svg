<svg width="900" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="400" fill="#f8f9fa" rx="10" ry="10" stroke="#ddd" stroke-width="1"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold">Three Horizons Integration Workflow</text>
  <text x="450" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">v2.0, April 2025</text>
  
  <!-- Workflow Phases -->
  <!-- Phase 1 -->
  <rect x="50" y="80" width="160" height="80" rx="8" ry="8" fill="#0078D4" fill-opacity="0.1" stroke="#0078D4" stroke-width="2"/>
  <text x="130" y="110" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Infrastructure</text>
  <text x="130" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Azure Resources</text>
  <text x="130" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">AKS/ARO Setup</text>

  <!-- Phase 2 -->
  <rect x="250" y="80" width="160" height="80" rx="8" ry="8" fill="#EE0000" fill-opacity="0.1" stroke="#EE0000" stroke-width="2"/>
  <text x="330" y="110" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Developer Hub</text>
  <text x="330" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Red Hat Developer Hub</text>
  <text x="330" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Template Configuration</text>

  <!-- Phase 3 -->
  <rect x="450" y="80" width="160" height="80" rx="8" ry="8" fill="#24292E" fill-opacity="0.1" stroke="#24292E" stroke-width="2"/>
  <text x="530" y="110" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">GitHub Integration</text>
  <text x="530" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">GitHub Enterprise Cloud</text>
  <text x="530" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Copilot & Advanced Security</text>

  <!-- Phase 4 -->
  <rect x="650" y="80" width="160" height="80" rx="8" ry="8" fill="#2188ff" fill-opacity="0.1" stroke="#2188ff" stroke-width="2"/>
  <text x="730" y="110" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">CI/CD Pipeline</text>
  <text x="730" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">GitHub Actions</text>
  <text x="730" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">GitOps Workflows</text>

  <!-- Implementation Details Section -->  
  <!-- Box 1 -->
  <rect x="50" y="200" width="160" height="160" rx="8" ry="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="50" y1="230" x2="210" y2="230" stroke="#ddd" stroke-width="2"/>
  <text x="130" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Azure Resources</text>
  
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="12">• Resource Groups</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="12">• Virtual Networks</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="12">• AKS/ARO Clusters</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="12">• Azure Monitor</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="12">• Azure Container Registry</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="12">• Azure DevBox</text>

  <!-- Box 2 -->
  <rect x="250" y="200" width="160" height="160" rx="8" ry="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="250" y1="230" x2="410" y2="230" stroke="#ddd" stroke-width="2"/>
  <text x="330" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Developer Hub</text>
  
  <text x="260" y="250" font-family="Arial, sans-serif" font-size="12">• Software Catalog</text>
  <text x="260" y="270" font-family="Arial, sans-serif" font-size="12">• Golden Path Templates</text>
  <text x="260" y="290" font-family="Arial, sans-serif" font-size="12">• API Documentation</text>
  <text x="260" y="310" font-family="Arial, sans-serif" font-size="12">• Technical Documentation</text>
  <text x="260" y="330" font-family="Arial, sans-serif" font-size="12">• Development Portal</text>
  <text x="260" y="350" font-family="Arial, sans-serif" font-size="12">• Plugin Ecosystem</text>

  <!-- Box 3 -->
  <rect x="450" y="200" width="160" height="160" rx="8" ry="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="450" y1="230" x2="610" y2="230" stroke="#ddd" stroke-width="2"/>
  <text x="530" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">GitHub Enterprise</text>
  
  <text x="460" y="250" font-family="Arial, sans-serif" font-size="12">• Source Repositories</text>
  <text x="460" y="270" font-family="Arial, sans-serif" font-size="12">• GitHub Actions</text>
  <text x="460" y="290" font-family="Arial, sans-serif" font-size="12">• GitHub Copilot Enterprise</text>
  <text x="460" y="310" font-family="Arial, sans-serif" font-size="12">• GitHub Advanced Security</text>
  <text x="460" y="330" font-family="Arial, sans-serif" font-size="12">• GitHub Codespaces</text>
  <text x="460" y="350" font-family="Arial, sans-serif" font-size="12">• Authentication Integration</text>

  <!-- Box 4 -->
  <rect x="650" y="200" width="160" height="160" rx="8" ry="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <line x1="650" y1="230" x2="810" y2="230" stroke="#ddd" stroke-width="2"/>
  <text x="730" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">CI/CD Pipeline</text>
  
  <text x="660" y="250" font-family="Arial, sans-serif" font-size="12">• Pull Request Workflows</text>
  <text x="660" y="270" font-family="Arial, sans-serif" font-size="12">• Build & Test Automation</text>
  <text x="660" y="290" font-family="Arial, sans-serif" font-size="12">• Security Scanning</text>
  <text x="660" y="310" font-family="Arial, sans-serif" font-size="12">• GitOps Deployment</text>
  <text x="660" y="330" font-family="Arial, sans-serif" font-size="12">• Canary/Blue-Green Deploy</text>
  <text x="660" y="350" font-family="Arial, sans-serif" font-size="12">• Environment Management</text>

  <!-- Connection Arrows -->
  <path d="M 210 120 L 250 120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 410 120 L 450 120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 610 120 L 650 120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg> 