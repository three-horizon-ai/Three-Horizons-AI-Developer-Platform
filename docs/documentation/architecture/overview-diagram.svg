<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 24px sans-serif; }
    .subtitle { font: 18px sans-serif; }
    .box { stroke: #333; stroke-width: 2; rx: 10; ry: 10; }
    .azure { fill: #0078D4; }
    .rh { fill: #EE0000; }
    .github { fill: #24292E; }
    .box-text { fill: white; font: bold 16px sans-serif; text-anchor: middle; }
    .arrow { stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <text x="400" y="40" class="title" text-anchor="middle">Three Horizons Platform Overview</text>
  <text x="400" y="70" class="subtitle" text-anchor="middle">Integrating Azure, Red Hat Developer Hub, and GitHub Enterprise</text>
  
  <!-- Azure Section -->
  <rect x="50" y="100" width="200" height="200" class="box azure" />
  <text x="150" y="150" class="box-text">Microsoft Azure</text>
  <text x="150" y="180" class="box-text" font-size="14">Azure Kubernetes Service</text>
  <text x="150" y="210" class="box-text" font-size="14">Azure Red Hat OpenShift</text>
  <text x="150" y="240" class="box-text" font-size="14">Azure Active Directory</text>
  <text x="150" y="270" class="box-text" font-size="14">Azure Monitor</text>
  
  <!-- Red Hat Section -->
  <rect x="300" y="100" width="200" height="200" class="box rh" />
  <text x="400" y="150" class="box-text">Red Hat Developer Hub</text>
  <text x="400" y="180" class="box-text" font-size="14">Developer Portal</text>
  <text x="400" y="210" class="box-text" font-size="14">Golden Paths</text>
  <text x="400" y="240" class="box-text" font-size="14">Service Catalog</text>
  <text x="400" y="270" class="box-text" font-size="14">Documentation</text>
  
  <!-- GitHub Section -->
  <rect x="550" y="100" width="200" height="200" class="box github" />
  <text x="650" y="150" class="box-text">GitHub Enterprise</text>
  <text x="650" y="180" class="box-text" font-size="14">Source Code Management</text>
  <text x="650" y="210" class="box-text" font-size="14">GitHub Actions</text>
  <text x="650" y="240" class="box-text" font-size="14">GitHub Copilot</text>
  <text x="650" y="270" class="box-text" font-size="14">Advanced Security</text>
  
  <!-- Arrows -->
  <line x1="250" y1="200" x2="290" y2="200" class="arrow" />
  <line x1="500" y1="200" x2="540" y2="200" class="arrow" />
  
  <!-- Developer Experience Box -->
  <rect x="100" y="330" width="600" height="50" class="box" fill="#009688" />
  <text x="400" y="360" class="box-text">Unified Developer Experience</text>
</svg> 