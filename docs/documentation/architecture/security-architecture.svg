<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="perimeter-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0063B1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="network-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DD7B00;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="identity-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#83B81A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5A8010;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="data-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CF2030;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#B01B29;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="app-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8661C5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6B4C9E;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">Three Horizons Security Architecture</text>
  
  <!-- Security Layers - Concentric Rings -->
  <!-- Perimeter Security - Outer Layer -->
  <ellipse cx="400" cy="300" rx="300" ry="200" fill="url(#perimeter-gradient)" filter="url(#shadow)" opacity="0.2"/>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#0078D4" font-weight="bold">Perimeter Security</text>
  
  <!-- Network Security - Second Layer -->
  <ellipse cx="400" cy="300" rx="240" ry="160" fill="url(#network-gradient)" filter="url(#shadow)" opacity="0.2"/>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#FF8C00" font-weight="bold">Network Security</text>
  
  <!-- Identity - Third Layer -->
  <ellipse cx="400" cy="300" rx="180" ry="120" fill="url(#identity-gradient)" filter="url(#shadow)" opacity="0.2"/>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#83B81A" font-weight="bold">Identity &amp; Access Management</text>
  
  <!-- Data Security - Fourth Layer -->
  <ellipse cx="400" cy="300" rx="120" ry="80" fill="url(#data-gradient)" filter="url(#shadow)" opacity="0.2"/>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#CF2030" font-weight="bold">Data Security</text>
  
  <!-- Application Security - Core -->
  <ellipse cx="400" cy="300" rx="60" ry="40" fill="url(#app-gradient)" filter="url(#shadow)" opacity="0.3"/>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#8661C5" font-weight="bold">Application Security</text>
  
  <!-- Security Components -->
  <!-- Perimeter Security Components -->
  <rect x="120" y="350" width="140" height="30" rx="5" ry="5" fill="url(#perimeter-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="190" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">DDoS Protection</text>
  
  <rect x="120" y="390" width="140" height="30" rx="5" ry="5" fill="url(#perimeter-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="190" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Web Application Firewall</text>
  
  <!-- Network Security Components -->
  <rect x="270" y="350" width="140" height="30" rx="5" ry="5" fill="url(#network-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="340" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Network Security Groups</text>
  
  <rect x="270" y="390" width="140" height="30" rx="5" ry="5" fill="url(#network-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="340" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Private Endpoints</text>
  
  <!-- Identity Components -->
  <rect x="420" y="350" width="140" height="30" rx="5" ry="5" fill="url(#identity-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="490" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Microsoft Entra ID Integration</text>
  
  <rect x="420" y="390" width="140" height="30" rx="5" ry="5" fill="url(#identity-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="490" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Role-Based Access Control</text>
  
  <!-- Data Security Components -->
  <rect x="570" y="350" width="140" height="30" rx="5" ry="5" fill="url(#data-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="640" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Key Vault</text>
  
  <rect x="570" y="390" width="140" height="30" rx="5" ry="5" fill="url(#data-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="640" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Encryption (At Rest/In Transit)</text>
  
  <!-- Application Security Components -->
  <rect x="270" y="430" width="140" height="30" rx="5" ry="5" fill="url(#app-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="340" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Secret Scanning</text>
  
  <rect x="420" y="430" width="140" height="30" rx="5" ry="5" fill="url(#app-gradient)" filter="url(#shadow)" opacity="0.8"/>
  <text x="490" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Vulnerability Scanning</text>
  
  <!-- Governance & Compliance -->
  <rect x="200" y="480" width="400" height="40" rx="5" ry="5" fill="#555" filter="url(#shadow)" opacity="0.8"/>
  <text x="400" y="505" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Governance, Risk Management &amp; Compliance</text>
  
  <!-- Monitoring & Response -->
  <rect x="250" y="530" width="300" height="40" rx="5" ry="5" fill="#888" filter="url(#shadow)" opacity="0.8"/>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Monitoring &amp; Incident Response</text>
  
  <!-- Legend -->
  <rect x="580" y="460" width="170" height="120" rx="5" ry="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="665" y="480" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Security Layers</text>
  
  <rect x="600" y="495" width="15" height="15" fill="url(#perimeter-gradient)"/>
  <text x="665" y="507" font-family="Arial, sans-serif" font-size="12" fill="#333">Perimeter Security</text>
  
  <rect x="600" y="520" width="15" height="15" fill="url(#network-gradient)"/>
  <text x="665" y="532" font-family="Arial, sans-serif" font-size="12" fill="#333">Network Security</text>
  
  <rect x="600" y="545" width="15" height="15" fill="url(#identity-gradient)"/>
  <text x="665" y="557" font-family="Arial, sans-serif" font-size="12" fill="#333">Identity &amp; Access</text>
  
  <rect x="600" y="570" width="15" height="15" fill="url(#data-gradient)"/>
  <text x="665" y="582" font-family="Arial, sans-serif" font-size="12" fill="#333">Data Security</text>
</svg> 