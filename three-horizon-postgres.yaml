apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-horizon-postgres
  namespace: three-horizon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: three-horizon-postgres
  template:
    metadata:
      labels:
        app: three-horizon-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: three-horizon-postgres
              key: postgresqlPassword
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: three-horizon-postgres
              key: postgresqlUsername
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: three-horizon-postgres
              key: postgresqlDatabase
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}  # Para produção, considere usar PVC
---
apiVersion: v1
kind: Service
metadata:
  name: three-horizon-postgres
  namespace: three-horizon
spec:
  selector:
    app: three-horizon-postgres
  ports:
  - port: 5432
    targetPort: 5432 