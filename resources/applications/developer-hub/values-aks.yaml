# Red Hat Developer Hub Helm Values for AKS
# Complete configuration following best practices

global:
  # Dynamic URL will be set during deployment
  clusterRouterBase: ""
  
  # PostgreSQL configuration
  postgresql:
    enabled: false  # Using external Azure PostgreSQL
    
upstream:
  backstage:
    image:
      registry: quay.io
      repository: redhat-developer-hub/redhat-developer-hub
      tag: latest
      
    # Resource configuration for production
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    
    # Enable horizontal pod autoscaling
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    
    # Application configuration
    appConfig:
      app:
        title: "Three Horizons Developer Platform"
        baseUrl: https://${DEVHUB_HOST}
        support:
          url: https://github.com/three-horizon-platform/Three-Horizons-Playbook/issues
          items:
            - title: "Documentation"
              icon: docs
              links:
                - url: https://github.com/three-horizon-platform/Three-Horizons-Playbook
                  title: "Platform Documentation"
      
      organization:
        name: "Three Horizons Platform"
        
      backend:
        baseUrl: https://${DEVHUB_HOST}
        listen:
          port: 7007
        cors:
          origin: https://${DEVHUB_HOST}
          methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
          credentials: true
        
        # External database configuration
        database:
          client: pg
          connection:
            host: ${POSTGRES_HOST}
            port: 5432
            user: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
            database: backstage
            ssl:
              require: true
              rejectUnauthorized: false
        
        # Caching configuration
        cache:
          store: memory
          
        # Authentication configuration
        auth:
          keys:
            - secret: ${BACKEND_SECRET}
            
      # Integrations configuration
      integrations:
        github:
          - host: github.com
            token: ${GITHUB_TOKEN}
            
        azure:
          - host: dev.azure.com
            credentials:
              - tenantId: ${AZURE_TENANT_ID}
                clientId: ${AZURE_CLIENT_ID}
                clientSecret: ${AZURE_CLIENT_SECRET}
                
      # Proxy configuration for external APIs
      proxy:
        '/argocd/api':
          target: ${ARGOCD_URL}
          changeOrigin: true
          secure: false
          headers:
            Authorization: Bearer ${ARGOCD_TOKEN}
            
      # Authentication providers
      auth:
        environment: production
        session:
          secret: ${SESSION_SECRET}
        providers:
          github:
            production:
              clientId: ${GITHUB_CLIENT_ID}
              clientSecret: ${GITHUB_CLIENT_SECRET}
              enterpriseInstanceUrl: ${GITHUB_ENTERPRISE_URL}
              
          microsoft:
            production:
              clientId: ${AZURE_CLIENT_ID}
              clientSecret: ${AZURE_CLIENT_SECRET}
              tenantId: ${AZURE_TENANT_ID}
              
      # Catalog configuration
      catalog:
        import:
          entityFilename: catalog-info.yaml
          pullRequestBranchName: backstage-integration
        rules:
          - allow:
            - Component
            - System
            - API
            - Resource
            - Location
            - Template
            - User
            - Group
            - Domain
        locations:
          # Platform catalog
          - type: url
            target: https://github.com/three-horizon-platform/Three-Horizons-Playbook/blob/main/catalog-info.yaml
            
          # Templates
          - type: url
            target: https://github.com/three-horizon-platform/Three-Horizons-Playbook/blob/main/resources/applications/web-application/template.yaml
          - type: url
            target: https://github.com/three-horizon-platform/Three-Horizons-Playbook/blob/main/resources/applications/kubernetes-application/template.yaml
            
          # Auto-discovery
          - type: github-discovery
            target: https://github.com/orgs/${GITHUB_ORG}/teams/${GITHUB_TEAM}/repos
            
        processors:
          microsoftGraphOrg:
            providers:
              - target: https://graph.microsoft.com/v1.0
                authority: https://login.microsoftonline.com
                tenantId: ${AZURE_TENANT_ID}
                clientId: ${AZURE_CLIENT_ID}
                clientSecret: ${AZURE_CLIENT_SECRET}
                
      # TechDocs configuration
      techdocs:
        builder: 'local'
        generator:
          runIn: 'docker'
          dockerImage: 'spotify/techdocs'
          pullImage: true
        publisher:
          type: 'azureBlobStorage'
          azureBlobStorage:
            containerName: 'techdocs'
            accountName: ${STORAGE_ACCOUNT_NAME}
            accountKey: ${STORAGE_ACCOUNT_KEY}
            
      # Search configuration
      search:
        pg:
          highlightOptions:
            useHighlight: true
            maxWord: 35
            minWord: 2
            shortWord: 3
            highlightAll: false
            maxFragments: 3
            fragmentDelimiter: ' ... '
            
      # Kubernetes plugin configuration
      kubernetes:
        serviceLocatorMethod:
          type: 'multiTenant'
        clusterLocatorMethods:
          - type: 'config'
            clusters:
              - url: ${KUBERNETES_API_URL}
                name: aks-cluster
                authProvider: 'serviceAccount'
                skipTLSVerify: false
                serviceAccountToken: ${KUBERNETES_TOKEN}
                
      # Permission configuration
      permission:
        enabled: true
        policy:
          csv:
            users:
              - name: ${ADMIN_USER}
                roles: [admin]
                
      # Scaffolder configuration
      scaffolder:
        # Default values for templates
        defaultAuthor:
          name: Three Horizons Platform
          email: platform@threehorizons.com
        defaultCommitMessage: "Initial commit from Developer Hub"
        
    # Extra environment variables
    extraEnvVars:
      - name: BACKEND_SECRET
        valueFrom:
          secretKeyRef:
            name: developer-hub-secrets
            key: backend-secret
      - name: POSTGRES_HOST
        valueFrom:
          secretKeyRef:
            name: postgres-credentials
            key: host
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: postgres-credentials
            key: username
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-credentials
            key: password
      - name: GITHUB_TOKEN
        valueFrom:
          secretKeyRef:
            name: github-credentials
            key: token
      - name: GITHUB_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: github-oauth
            key: client-id
      - name: GITHUB_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: github-oauth
            key: client-secret
      - name: AZURE_TENANT_ID
        valueFrom:
          secretKeyRef:
            name: azure-credentials
            key: tenant-id
      - name: AZURE_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: azure-credentials
            key: client-id
      - name: AZURE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: azure-credentials
            key: client-secret
      - name: SESSION_SECRET
        valueFrom:
          secretKeyRef:
            name: developer-hub-secrets
            key: session-secret
      - name: STORAGE_ACCOUNT_NAME
        valueFrom:
          secretKeyRef:
            name: techdocs-storage
            key: account-name
      - name: STORAGE_ACCOUNT_KEY
        valueFrom:
          secretKeyRef:
            name: techdocs-storage
            key: account-key
            
    # Volume mounts for additional configuration
    extraVolumeMounts:
      - name: app-config
        mountPath: /app/app-config.local.yaml
        subPath: app-config.local.yaml
        
    extraVolumes:
      - name: app-config
        configMap:
          name: developer-hub-config
          
# Route configuration (disabled for AKS, using Ingress instead)
route:
  enabled: false
  
# Ingress configuration for AKS
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  host: ${DEVHUB_HOST}
  tls:
    enabled: true
    secretName: developer-hub-tls

# ServiceAccount configuration
serviceAccount:
  create: true
  name: developer-hub
  annotations:
    azure.workload.identity/client-id: ${WORKLOAD_IDENTITY_CLIENT_ID}
  labels:
    azure.workload.identity/use: "true"

# Network Policy
networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 7007
        
# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  
# Monitoring
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics 