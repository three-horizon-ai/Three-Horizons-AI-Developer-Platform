apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{values.name}}
  namespace: {{values.namespace}}
  labels:
    app: {{values.name}}
    part-of: three-horizons
spec:
  replicas: {{values.replicas}}
  selector:
    matchLabels:
      app: {{values.name}}
  template:
    metadata:
      labels:
        app: {{values.name}}
    spec:
      containers:
      - name: {{values.name}}
        image: ghcr.io/threehorizonsorg/{{values.name}}:latest
        imagePullPolicy: Always
        ports:
        - containerPort: {{values.port}}
        resources:
          requests:
            cpu: {{values.resources.requestsCpu}}
            memory: {{values.resources.requestsMemory}}
          limits:
            cpu: {{values.resources.limitsCpu}}
            memory: {{values.resources.limitsMemory}}
        readinessProbe:
          httpGet:
            path: /health
            port: {{values.port}}
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: {{values.port}}
          initialDelaySeconds: 15
          periodSeconds: 20 