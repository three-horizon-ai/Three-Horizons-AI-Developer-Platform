apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: {{values.name}}
  description: {{values.description}}
  annotations:
    github.com/project-slug: ThreeHorizonsOrg/{{values.name}}-k8s
    backstage.io/kubernetes-id: {{values.name}}
    backstage.io/kubernetes-namespace: {{values.namespace}}
    backstage.io/techdocs-ref: dir:.
    azure.com/tag: three-horizons
  tags:
    - kubernetes
    - microservice
spec:
  type: service
  lifecycle: production
  owner: {{values.owner}}
  system: three-horizons-platform
  providesApis:
    - {{values.name}}-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: {{values.name}}-api
  description: API for {{values.name}} service
spec:
  type: openapi
  lifecycle: production
  owner: {{values.owner}}
  definition: |
    openapi: 3.0.0
    info:
      title: {{values.name}} API
      version: 1.0.0
      description: API for {{values.name}} service
    paths:
      /health:
        get:
          summary: Health check endpoint
          responses:
            '200':
              description: Service is healthy
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "UP" 