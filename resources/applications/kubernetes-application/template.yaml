apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: three-horizons-kubernetes-application
  title: Three Horizons Kubernetes Application
  description: Create a Kubernetes application with standardized configurations for Three Horizons
  tags:
    - kubernetes
    - microservice
    - recommended
spec:
  owner: three-horizons-platform-team
  type: service
  parameters:
    - title: Provide Application Information
      required:
        - name
        - description
        - namespace
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the service
          ui:autofocus: true
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
        description:
          title: Description
          type: string
          description: Description of the service
        namespace:
          title: Kubernetes Namespace
          type: string
          description: Namespace to deploy the service
          default: default
        owner:
          title: Owner
          type: string
          description: Owner of the service
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
      
    - title: Configure Service
      required:
        - port
        - replicas
      properties:
        port:
          title: Service Port
          type: number
          description: Port the service will listen on
          default: 8080
        replicas:
          title: Replicas
          type: number
          description: Number of pod replicas
          default: 2
        resources:
          title: Resource Requirements
          type: object
          description: Container resource requirements
          properties:
            requestsCpu:
              title: CPU Requests
              type: string
              default: "100m"
            requestsMemory:
              title: Memory Requests
              type: string
              default: "128Mi"
            limitsCpu:
              title: CPU Limits
              type: string
              default: "500m"
            limitsMemory:
              title: Memory Limits
              type: string
              default: "512Mi"
          
    - title: Configure Network
      properties:
        ingress:
          title: Create Ingress
          type: boolean
          description: Create an ingress for the service
          default: true
        ingressHost:
          title: Ingress Host
          type: string
          description: Hostname for the ingress
          default: service.threehorizons.example
          when:
            field: ingress
            value: true
        networkPolicy:
          title: Create Network Policy
          type: boolean
          description: Create network policy for the service
          default: true
  
  steps:
    - id: templateBase
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          namespace: ${{ parameters.namespace }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          resources:
            requestsCpu: ${{ parameters.resources.requestsCpu }}
            requestsMemory: ${{ parameters.resources.requestsMemory }}
            limitsCpu: ${{ parameters.resources.limitsCpu }}
            limitsMemory: ${{ parameters.resources.limitsMemory }}
          ingress: ${{ parameters.ingress }}
          ingressHost: ${{ parameters.ingressHost }}
          networkPolicy: ${{ parameters.networkPolicy }}
          
    - id: copyIngressManifest
      name: Copy Ingress Manifest
      action: fetch:template
      if: ${{ parameters.ingress == true }}
      input:
        url: ./manifests/ingress
        targetPath: ./kubernetes
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          ingressHost: ${{ parameters.ingressHost }}
    
    - id: copyNetworkPolicy
      name: Copy Network Policy Manifest
      action: fetch:template
      if: ${{ parameters.networkPolicy == true }}
      input:
        url: ./manifests/network-policy
        targetPath: ./kubernetes
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          port: ${{ parameters.port }}
          
    - id: publish
      name: Publish Service
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=ThreeHorizonsOrg&repo=${{ parameters.name }}-k8s
        defaultBranch: main
        
    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'
  
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }} 