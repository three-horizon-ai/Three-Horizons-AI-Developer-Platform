    \         webhookUrl: ${GITHUB_WEBHOOK_URL}\n          webhookSecret: ${GITHUB_WEBHOOK_SECRET}\n
    \         privateKey: |\n            ${GITHUB_PRIVATE_KEY_FILE}\nsignInPage: github\npermission:\n
    \ enabled: true\n  rbac:\n    admin:\n      users:\n        - name: user:default/jpeixoto6\n
