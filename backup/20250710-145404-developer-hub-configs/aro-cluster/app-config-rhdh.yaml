data:
  app-config-rhdh.yaml: "app:\n  title: Three Horizon AI - Red Hat Developer Hub\n
    \ baseUrl: https://backstage-developer-hub-developer-hub.apps.txl952sg.centralus.aroapp.io\n
    \ branding:\n    fullLogo: data:image/svg+xml;base64,\n
    \   iconLogo: data:image/svg+xml;base64,
    \ \nauth:\n  environment: production \n  providers:\n    github:\n      production:\n
    \       clientId: ${AUTH_GITHUB_CLIENT_ID} \n        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}\n
    \       signIn:\n          resolvers:\n            - resolver: usernameMatchingUserEntityName\n
