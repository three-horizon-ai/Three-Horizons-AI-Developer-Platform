<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="azure-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0063B1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="github-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#24292E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1B1F23;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="redhat-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="integration-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6E6E6E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4A4A4A;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">Three Horizons Integration Architecture</text>
  
  <!-- Azure Platform -->
  <rect x="150" y="150" width="180" height="120" rx="10" ry="10" fill="url(#azure-gradient)" filter="url(#shadow)"/>
  <text x="240" y="200" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white" font-weight="bold">Microsoft Azure</text>
  <text x="240" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Cloud Infrastructure</text>
  <text x="240" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Services &amp; Resources</text>
  
  <!-- GitHub Enterprise -->
  <rect x="470" y="150" width="180" height="120" rx="10" ry="10" fill="url(#github-gradient)" filter="url(#shadow)"/>
  <text x="560" y="200" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white" font-weight="bold">GitHub Enterprise</text>
  <text x="560" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Source Control</text>
  <text x="560" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">CI/CD Pipelines</text>
  
  <!-- Red Hat Developer Hub -->
  <rect x="310" y="350" width="180" height="120" rx="10" ry="10" fill="url(#redhat-gradient)" filter="url(#shadow)"/>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white" font-weight="bold">Red Hat Developer Hub</text>
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Developer Experience</text>
  <text x="400" y="445" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Platform Engineering</text>
  
  <!-- Three Horizons Integration Platform -->
  <ellipse cx="400" cy="300" rx="100" ry="40" fill="url(#integration-gradient)" filter="url(#shadow)"/>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">Three Horizons Platform</text>
  
  <!-- Connection Lines -->
  <line x1="240" y1="270" x2="350" y2="300" stroke="#0078D4" stroke-width="3" stroke-dasharray="5,5"/>
  <line x1="560" y1="270" x2="450" y2="300" stroke="#24292E" stroke-width="3" stroke-dasharray="5,5"/>
  <line x1="400" y1="340" x2="400" y2="350" stroke="#EE0000" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Workflow Arrows -->
  <polygon points="340,295 350,300 340,305" fill="#0078D4"/>
  <polygon points="460,295 450,300 460,305" fill="#24292E"/>
  <polygon points="395,345 400,350 405,345" fill="#EE0000"/>
  
  <!-- Horizon Layers -->
  <rect x="150" y="500" width="500" height="30" rx="5" ry="5" fill="#0078D4" filter="url(#shadow)" opacity="0.8"/>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Horizon 1: Foundation</text>
  
  <rect x="180" y="530" width="440" height="30" rx="5" ry="5" fill="#83B81A" filter="url(#shadow)" opacity="0.8"/>
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Horizon 2: Enhancement</text>
  
  <rect x="210" y="560" width="380" height="30" rx="5" ry="5" fill="#FF8C00" filter="url(#shadow)" opacity="0.8"/>
  <text x="400" y="580" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Horizon 3: Innovation</text>
  
  <!-- Legend -->
  <rect x="580" y="380" width="170" height="100" rx="5" ry="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="665" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">Legend</text>
  
  <rect x="600" y="415" width="15" height="15" fill="url(#azure-gradient)"/>
  <text x="665" y="427" font-family="Arial, sans-serif" font-size="12" fill="#333">Microsoft Azure</text>
  
  <rect x="600" y="440" width="15" height="15" fill="url(#github-gradient)"/>
  <text x="665" y="452" font-family="Arial, sans-serif" font-size="12" fill="#333">GitHub Enterprise</text>
  
  <rect x="600" y="465" width="15" height="15" fill="url(#redhat-gradient)"/>
  <text x="665" y="477" font-family="Arial, sans-serif" font-size="12" fill="#333">Red Hat Developer Hub</text>
</svg> 